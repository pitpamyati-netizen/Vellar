  "С побеждённых стало падать снаряжение. С обычного — изредка, с эпического — чаще, с хозяина логова — всегда.",
  "Класс больше ничего не запрещает. Надеть можно что угодно, но за чужое оружие точность ниже на 20 процентов и инициатива на 15, а за часть чужого доспеха — на 5 и 8.",
  "Карточка вещи говорит о такой цене до того, как вы её наденете.",
  "Умения, которые просят своё оружие, с чужим по-прежнему не работают: чужим мечом можно махать плохо, а выстрелить без лука нечем.",
  "Новый герой выходит одетым: оружие своего класса и доспех первой ступени. Кулак бьёт втрое слабее самого простого меча.",
