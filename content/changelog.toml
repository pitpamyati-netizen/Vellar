[[release]]
version = "1.50"
headline = "Обновление 1.50: у ремесла появились цеха, а у узла — имена тех, кто в нём стоит."
added = [
  "Ремёсел стало одиннадцать. Собирают руду, травы, шкуры, рыбу и лес: у рыбной ловли своя удочка, у лесного дела свой топор, и оба продаются в лавке.",
  "У каждого цеха свой материал. Кузнец кует тяжёлый и кольчужный доспех, железные клинки и оковку. Кожевник выделывает шкуры и шьёт лёгкое, портной ткёт и шьёт тканое.",
  "Древодел тешет брус и точит луки, арбалеты, посохи и жезлы. Стряпуха варит горячее из улова и снедь в дорогу.",
  "Шкуру теперь снимают с туш: выигранный бой над зверем или тварью отдаёт её тому, у кого в слоте нож свежевателя.",
  "Сырьё пошло ступенями: пять на каждый род, от железного лома до небесного железа. Что лежит в жиле, решает место, а не ваш уровень.",
  "Сырое переплавляют и выделывают: руда идёт в слитки, шкуры в кожу, волокно в ткань, кряжи в брус. Это отдельная работа и отдельная запись в ремесло.",
  "Зелья, настои, точила и снедь тоже пошли ступенями: на десятом ранге варят не то, что на первом.",
  "Узел локации теперь называет то, что в нём стоит: «Вступить в бой: Серый волк, 3 штуки», «Собрать сырьё: Горная руда». То же сказано и о соседних узлах — идти вслепую больше не приходится.",
]
changed = [
  "Рангов в ремесле стало десять вместо пяти, и каждый следующий дороже прошлого. Ранг решает ступень изделия: одна и та же кольчуга у ученика ветхая, у гранд-мастера немеркнущая.",
  "Рецепты теперь покрывают всю дорогу, а не первые её уровни: работа открыта на каждой ступени до последней.",
  "Пройденные ранги не закрываются: точило ученика куют и гранд-мастером, и заказчик просит именно его.",
  "Список работ в ремесле листается, ищется и режется разделами: сырьё, доспех, оружие, украшения, расходники.",
  "Кнопка работы называет изделие без прибавки: какая она будет, решает бросок при работе.",
  "Кирка больше не берёт обломки, а серп берёт и травы, и волокно.",
]

[[release]]
version = "1.49"
headline = "Обновление 1.49: у вещей появились имена и прибавки вразброс, а у локаций — глубина."
added = [
  "У найденной вещи теперь своё слово в имени: «Кованый меч ярости редкой работы», «Простая кольчуга выносливости доброй ковки».",
  "Два меча одной ступени и одной редкости больше не одно и то же: у них разные прибавки, разные числа и разные имена.",
  "Прибавок стало больше: необычная вещь несёт одну, редкая две, легендарная три, реликтовая четыре. Прибавкой бывает и характеристика, и проценты.",
  "Легендарной и реликтовой вещи прибавка изредка выпадает великой — в полтора раза выше обычного потолка. Карточка вещи называет такую вслух.",
  "В кузнице теперь разбирают вещи на сырьё и перековывают их: за золото вещь получает другую ведущую прибавку и другое имя.",
]
changed = [
  "Ступень вещи значит что-то и для процентов: на первом уровне прибавка вполовину слабее, чем на последнем.",
  "Качество работы в ремесле платит самой вещью: ладная партия выходит редкостью выше рецепта, отменная — на две. Реликтовое по-прежнему не куют.",
  "Лишнюю штуку сверху дают теперь только зельям и прочему, у чего редкости нет.",
  "Лавка выкладывает вещи со своими прибавками, как и добыча.",
  "Локации перестроились в глубину: до дальнего места теперь пять-восемь переходов, и чем дальше место, тем оно тяжелее.",
  "Свернуть с дороги стало ради чего: в тупиках стоят находки и святилища, а не очередная стычка.",
  "Хозяин логова по-прежнему ждёт в самой глубине, и выход обходит его стороной.",
]

[[release]]
version = "1.48"
headline = "Обновление 1.48: сто пятьдесят уровней, и весь мир пересчитан под них."
changed = [
  "Предел роста теперь сто пятидесятый уровень, а не трёхсотый. Мир тот же — те же города и ступени снаряжения, — но дорога до предела вдвое короче.",
  "Ваш уровень и опыт пересчитаны на новую дорогу. Всё нажитое осталось при вас: золото, вещи, умения с рангами, задания, ремёсла.",
  "Тем, кто перерос новый предел, поставлен предел. Уже вложенные очки не тронуты.",
  "Очков характеристик за уровень стало вчетверо больше, при создании раздают десять. Разницу за прошлые уровни вам доначислили нераспределённой.",
  "Сверх того каждая из семи характеристик теперь растёт сама: удача, ловкость и мудрость воина больше не стоят на месте всю игру.",
  "У крита, крит-урона, уклонения и точности больше нет стены посреди дороги: каждое очко прибавляет, следующее — чуть меньше предыдущего.",
  "Прибавки от вещей и умений по-прежнему дают ровно свои проценты.",
  "Умения приходят вдвое чаще: боевое или пассивное открывается раз в три-четыре уровня, а очков умений за уровень теперь два.",
  "Цена умения в бою и восстановление запаса считаются от вашего запаса, а не числом. На экране, как и раньше, стоит число.",
  "Золото пересчитано целиком: за бой платят меньше, и мера у платы теперь одна — один бой своего уровня.",
  "Ночь на постоялом дворе стоит трёх схваток, дорога до соседнего города — четырёх, наставник — пятнадцати, и так на любом уровне.",
  "Вещи в лавке подорожали, скупщик платит меньше, добыча падает реже, а починка в кузнице подешевела.",
  "Плата за задания пересчитана, и тот, кто его даёт, называет ту самую сумму, которую заплатит.",
  "Противник пересчитан под новую дорогу: бой держится прежних трёх ходов и стоит прежней доли здоровья.",
  "Окна уровней сжались вместе с дорогой: отряд собирают в пяти уровнях друг от друга, на поединок и арену выходят в трёх.",
  "В дом берут с десятого уровня.",
]

[[release]]
version = "1.47"
headline = "Обновление 1.47: у снаряжения появилась прочность, а в городах — кузница."
added = [
  "У всего надетого теперь есть прочность. Сколько её — решают уровень вещи и её редкость: ветхий меч обычной работы держит сорок боёв, именной славы — куда больше.",
  "В каждом городе открылась кузница. Там чинят надетое: по одной вещи или всё разом. Цена работы идёт от цены самой вещи и от того, насколько она сточена, и починка всегда дешевле новой.",
]
changed = [
  "Бой точит надетое: выигранный на единицу, проигранный втрое. Поединок и арена не точат ничего.",
  "Сточенная до конца вещь перестаёт давать что-либо — ни брони, ни урона, ни прибавок; сломанный меч бьёт как кулак. С вас она при этом не снимается: отнесите её в кузницу.",
  "О поломке говорит итог боя, а сколько прочности осталось — экран «Персонаж» и карточка вещи. Целая вещь об этом молчит.",
  "Инструмент по-прежнему в кузнице не чинят: сточенный меняют в лавке.",
]

[[release]]
version = "1.46"
headline = "Обновление 1.46: сырьё берут в дороге и своим инструментом."
changed = [
  "Кнопки «Собрать сырьё» на экране ремесла больше нет: сырьё берут там, где оно лежит, — в узле локации. Ждать четверть часа между сборами тоже больше не нужно.",
  "Собирать можно только инструментом: кирка берёт руду и обломки, серп — травы, нож свежевателя — шкуры. Инструмент надевается в новый слот «Инструмент», без него жила не даётся.",
  "У инструмента есть запас работы, и решает его редкость: обычный держит 25 сборов, необычный 60, редкий 150, легендарный 400. Сточенный инструмент рассыпается — починить его негде.",
  "Инструменты есть в лавке любого города и в любой час: обычный и необычный, по ступени вашего уровня.",
  "Сколько сырья вынесли, теперь решает ранг ремесла, а работа за жилу в него же и записывается: ремесло растёт от вылазок.",
  "Что лежит в жиле, зависит от места: в горах руда, на болоте болотная, в лесу смола. Одна и та же жила даёт разное тем, кто пришёл с разным инструментом.",
]
added = [
  "Новое ремесло — свежевание: шкуры теперь снимают ножом, а не находят сами собой.",
]

[[release]]
version = "1.45"
headline = "Обновление 1.45: разбор игры — починили лечение в отряде и три тупика."
fixed = [
  "Полковое лечение считало «насколько меня лечат» со знаменосца и раздавало это всему отряду. Теперь у каждого своё: «Спёртый воздух» на товарище и правда режет лечение ему, а не всем разом.",
  "Команда в группе («передать», «продать», «купить») роняла ответ, если в сумке лежала вещь, которой в игре больше нет. Теперь такая вещь просто не показывается.",
  "Бой, который игра больше не может прочесть, теперь читается как «боя нет» и отпускает: раньше он запирал игрока в бою, который не открыть и не бросить.",
  "На экране настроек размер страницы теперь назван правилом, а не числом: записей не больше восьми, а там, где у них длинные описания, меньше — столько, сколько влезает в сообщение.",
]

[[release]]
version = "1.44"
headline = "Обновление 1.44: у округи появилось состояние, и сводка на него смотрит."
added = [
  "На экране локации теперь есть строка о состоянии округи: тихая, по ней ходят, или её выработали и она переложилась.",
  "Сводка заставы теперь чаще шлёт дела туда, где неспокойно: в выработанные места и туда, где осел блуждающий ход. Обоз и спуск от этого не зависят.",
  "В выбитой и встревоженной округе сильные одиночки и хозяева логова чаще выходят с прозвищем. Обычных стай это не касается.",
  "Когда округа вокруг города выбита или неспокойна, лавка в нём дорожает и на прилавке становится меньше товара — но совсем пустой она не бывает.",
]

[[release]]
version = "1.43"
headline = "Обновление 1.43: сводка заставы стала подробнее — до пяти дел, два новых вида."
changed = [
  "В сводке заставы теперь четыре-пять дел вместо трёх. Два вида новые.",
  "«Выбить стаю»: застава называет породу и место, где она развелась. Закрывается победой над этой стаей в названной локации — как «разредить стаю», но теперь сказано, за кем идти.",
  "«Обыскать тайник» или «Собрать сырьё»: застава называет место, где стоит поискать. Закрывается отработанным узлом. Есть не в каждом городе — только где у места и правда есть тайник или делянка.",
  "Надбавка и правило «одно дело за переворот» прежние.",
]

[[release]]
version = "1.42"
headline = "Обновление 1.42: у заставы появилась сводка — куда сегодня стоит пойти."
added = [
  "В каждом городе теперь есть «Сводка»: три дела заставы на ближайшие полчаса. Разредить стаю в названной локации, проводить обоз до соседнего города, спуститься в названное подземелье.",
  "Первое закрытое дело за эти полчаса платит надбавку — примерно в полтора-два обычных боя, золотом и опытом.",
  "Дело закрывается само там, где вы его сделали: в бою, на дороге, в логове. Надбавка приходит вторым сообщением, как новый уровень.",
  "Дела меняются вместе с прилавком лавки и зависят от города и вашего уровня. Кнопки сводки ведут прямо к делу.",
  "Если рядом с городом осел блуждающий подземный ход, сводка о нём скажет — раньше такой ход находили только случайно.",
]

[[release]]
version = "1.41"
headline = "Обновление 1.41: боевой экран стал короче, а весь расклад темпа — по кнопке."
changed = [
  "Панель боя больше не тонет в абзаце про след и разгон каждый ход: теперь это одна строка-совет, а намерение врага названо одним словом.",
  "Появилась кнопка «Разбор боя» («/разбор»): отдельный экран, где собрано всё про темп — намерения врагов, разгон и разнобой, что делают три стойки. Открыть его — не ход.",
]
fixed = [
  "Подсказки намерений теперь описывают то, что бой и правда делает: напор больше не «бьёт сильнее» (он открывает бьющего), а заслон — «в полтора раза больше брони», а не «двойная».",
]

[[release]]
version = "1.40"
headline = "Обновление 1.40: у дороги появился сюжет — задания от Сурожа до Колвы."
added = [
  "Доска заданий больше не пустеет после Дубно. В тринадцати городах от Сурожа до Колвы теперь свои цепочки работ — сорок два задания на весь путь до трёхсотого уровня.",
  "Акт «Межа»: Дом Порубежья и Дом Камня грызутся за досмотр на крестовье трактов, и вы работаете то на одних, то на других — считаете чужие гири, разворачиваете обозы, ищете, кто жжёт весы.",
  "Акт «Выморочный дом»: у Дома Переправ не осталось наследника, и за броды и воду разом взялись дальняя ветвь, самозваный наследник и Вольная Гавань со скупленными долгами.",
  "Акт «Местничество»: Престол слабеет, дома тянут дружины к столице под видом посольств, а Дом Заставы подводит к Гнездну войско «для порядка».",
  "Акт «Порожний престол»: наследник не назван, и в столице кто-то рвётся сесть раньше совета. Цепочка заданий Гнездна из четырёх работ кончается реликтовой печаткой Престола.",
  "Каждое задание по-прежнему говорит, что делать, куда идти и что нажимать; наниматель называет плату в первых же словах.",
]

[[release]]
version = "1.39"
headline = "Обновление 1.39: снаряжение растёт вместе с дорогой, а реликвии стали редкостью."
changed = [
  "Ступеней снаряжения стало семнадцать вместо двенадцати, и они привязаны к городам: почти на каждом въезде в новый город в лавке и добыче появляется своя ступень — новое имя вещи и числа выше.",
  "Дорога вперёд теперь ощущается сменой снаряжения, а не долгим ожиданием одной и той же «Отменной» кольчуги на два города подряд.",
  "Реликтовая вещь падает с хозяина логова намного реже: была примерно с каждого четвёртого, стала — с каждого двадцатого. Растёт с вашим уровнем и не устаревает, так что теперь это редкая удача.",
]
added = [
  "Восемь новых родов оружия, все с первого уровня: рапира, арбалет, боевой молот, боевые когти и боевая коса (когти и коса бьют разрывающим — раньше так не бил никто).",
  "Среди них гримуар, сфера и тотем — оружие, что бьёт огнём, холодом и силой природы, под мага, жреца и друида.",
  "У доспеха на каждое место по два-три названия вместо одного, а украшений семь вместо трёх: печатка, амулет, талисман, браслет. Числа те же — разнообразие в выборе.",
  "Особых свойств у легендарных и реликтовых вещей стало двадцать семь вместо четырнадцати: вампиризм, отражение урона, урон в первый ход, по одной цели, по всем, сопротивления и другое.",
]

[[release]]
version = "1.38"
headline = "Обновление 1.38: «Мир» открывает ваш город, а между городами теперь ездят."
changed = [
  "Кнопка «Мир» больше не заставляет каждый раз выбирать город: она сразу открывает тот, где вы стоите. Ваша таверна, лавка и банк — в одно нажатие.",
]
added = [
  "В городе появилась кнопка «Дорога»: за ней — большая дорога и все открытые вам города с ценой пути до каждого.",
  "Переход в другой город стоит золота и проходится сразу, без ожидания. Соседний город дешевле дальнего, а с уровнем дорога дорожает. Свой город и дорога никуда — бесплатны.",
]

[[release]]
version = "1.37"
headline = "Обновление 1.37: напор, заслон и финт вместо круга тегов."
changed = [
  "Три тега боя больше не ходят по кругу и не бьют друг друга. Кто объявил напор — тот открыт: удар по нему мимо брони, его ответ вдвое слабее. Заслон — это «Защититься». Финт врага не уклоняется.",
  "«Брешь» теперь у того, кто объявил напор, а не у того, кто «угадал» тег. Повтор тега даёт разгон, три разных тега подряд — разнобой: враг теряет ход.",
  "Намерение врага — постоянная повадка: стая одного вида держит один строй весь бой, а не мельтешит всеми намерениями каждый круг. Хозяин логова в оборону не встаёт.",
  "Ветви умений называются Напор, Заслон и Финт (были Натиск, Оборона, Точность).",
]
added = [
  "Разбойник: «Обманный финт» на 1 уровне, «Скрытность» на 6-м. «Удар в спину» теперь на 15 уровне и бьёт только из незаметности — зато цель его не видит и не уклоняется.",
  "Из незаметности бьют также «Удар из тени» (бывшее «Исчезновение», 90) и «Удавка» (137). «Точный укол» и «Тень в спину» убраны — вложенные очки вернутся сами.",
]

[[release]]
version = "1.36"
headline = "Обновление 1.36: в города домов пришёл «Двор дома» — вступайте в один из семи."
added = [
  "У четырнадцати городов домов появилась кнопка «Двор дома». Вступают с 20 уровня, взнос — 300 золота; уйти потом можно бесплатно.",
  "Вступив, вы получаете технику дома — постоянную прибавку в бою. Дом Порубежья ускоряет и усиливает первый удар, Дом Камня крепит броню, Дом Заставы добавляет здоровья и брони, и так у каждого своя.",
  "Дом один: пока вы в одном, в другой не вступить. Техника при вас, пока вы дом не покинете, и новое имя её не отнимает.",
]
changed = [
  "Числа техник — первый набросок и будут выправляться по первым дням игры.",
]

[[release]]
version = "1.35"
headline = "Обновление 1.35: конец пути теперь сбрасывает уровень и даёт новое имя."
changed = [
  "«Перерождения» с закладом вещи или грани больше нет. На трёхсотом уровне в управе просят у Престола новое имя: уровень падает до первого.",
  "Золото, вещи и все изученные умения остаются при вас. Дорогу с первого до трёхсотого предстоит пройти заново.",
  "За каждый уход дают нераспределённые очки характеристик — за первые пять уходов — и титул: Вписанный, Примеченный, Признанный, Именитый, Ближний, Наречённый.",
  "Голосование ведёт Большой совет домов. Голос есть у того, кто брал новое имя, и весит столько уходов, сколько за ним стоит.",
  "Печатей больше нет: спуск в подземелья у всех одной глубины, а грань умения открывается на том ранге, что назван, и ни на каком другом.",
]

[[release]]
version = "1.34"
headline = "Обновление 1.34: Веллар — держава семи великих домов."
changed = [
  "Договора городов и Дорожной палаты больше нет. Веллар — единая держава на одной дороге; правят ею семь великих домов, у каждого по два города. Какой дом держит город, написано в его описании.",
  "Дома: Порубежья, Камня, Переправ, Вольной Гавани, Заставы, Мер, Курганов. Гнездно — Престол, столица державы; его не держит никто.",
  "«Палата» в каждом городе стала «Управой» — та же контора Престола: банк, книга, вопросы совета.",
  "Вы приезжаете в Веллар безродным: без дома, без места в списках. Наследовать удел нельзя, наняться в дом — можно.",
  "Спорная четвёртая локация каждого города теперь так и зовётся — межа между уделами домов.",
  "Задания первого акта переписаны: вы нанимаетесь в младшую службу Дома Порубежья.",
]

[[release]]
version = "1.33"
headline = "Обновление 1.33: в подземельях завелись твари, что бьют из темноты."
added = [
  "Новое прозвище врага — «Неуловимый». Такая стая заходит в бой незаметной: выбрать её нельзя, пока она сама не ударит, а через пару ходов после этого уходит из виду снова.",
  "Достать её можно тем же, чем и спрятавшегося игрока: ударом по всем, ядом и кровью или световой гранатой. Прозвище выпадает на тёмном ходу и гиблом спуске.",
]

[[release]]
version = "1.32"
headline = "Обновление 1.32: у алхимиков появилась световая граната — засвечивает спрятавшихся и слепит всех разом."
added = [
  "Новый расходник — «Световая граната». Кидается во всех врагов сразу, цель выбирать не надо: снимает незаметность и на 2 хода сбивает всем точность на 20 процентов.",
  "Рецепт у алхимиков, третий ранг: луговые травы и пещерный кристалл.",
]

[[release]]
version = "1.31"
headline = "Обновление 1.31: разбойник и маг уходят из виду по-настоящему — их нельзя выбрать целью, пока не проявятся."
changed = [
  "«Исчезновение» разбойника больше не гасит один удар. Теперь вас нельзя выбрать целью вовсе — пока вы сами не сделаете что-то, кроме «Защититься».",
  "Удар по всем находит ушедшего из виду и выдаёт его. Яд, огонь и кровь на нём тоже выдают. В одиночном бою противник, потерявший вас, бьёт впустую и теряет ход.",
]
added = [
  "У мага вместо «Разрыва потока» теперь «Невидимость» (уровень 105) — то же исчезновение, что у разбойника. Вложенные в «Разрыв потока» очки умений вернулись.",
]

[[release]]
version = "1.30"
headline = "Обновление 1.30: у каждого города теперь несколько названных подземелий, а в глубине попадаются твари с прозвищами."
changed = [
  "Вместо двух спусков у города теперь список названных подземелий — четыре-пять на город, вразброс по его уровням, и одно глубокое на самом верху.",
  "Сперва выбираете, куда спуститься, потом — насколько глубоко.",
  "У подземелья свой уровень, и он не растёт вместе с вами: то, что было по росту новичку, для переросшего платит меньше, и об этом сказано на карточке.",
  "Под землёй теперь свои твари: рудничные стражи, склепная нежить, ползуны из штреков. Дорожные волки и разбойники остаются на дороге.",
]
added = [
  "На тёмном ходу и гиблом спуске — а также у сильных одиночек и хозяев логова наверху — тварь бывает с прозвищем: Броненосный, Иглистый, Жиловатый, Гнилозубый, Стылый.",
  "Прозвище не украшение: иглистый возвращает вам часть урона, жиловатый лечится от ваших ран, гнилозубый травит по попаданию, выводковый приводит лишние тела.",
  "На боевом экране написано, что несёт каждое прозвище.",
]

[[release]]
version = "1.29"
headline = "Обновление 1.29: заход в подземелье кончается там, где вы из него вышли."
fixed = [
  "Уйти из захода теперь и правда значит уйти. Раньше незакрытый спуск оставался за спиной, и следующий бой — хоть в узле локации — игра собирала как комнату подземелья.",
  "Спутникам, ходившим с вами вниз, чужой заход больше не достаётся: их следующий бой — их собственный.",
  "«Богатая порода» прибавляет золота и на дне, а не только в комнатах: она обещает золото со всего захода, и дно — его часть.",
  "Состав большой гильдии читается страницами: тридцать имён со званиями в одно сообщение не помещались. Кнопка по-прежнему несёт имя, так что выгнать и повысить можно с любой страницы.",
]

[[release]]
version = "1.28"
headline = "Обновление 1.28: обучение теперь подсказывает по ходу и платит за каждый шаг."
changed = [
  "Экран, на котором делается шаг обучения, сам говорит, что сделать: отдельно заходить в «Обучение» за поручением больше не нужно. Кнопка «Обучение» в меню ведёт сразу к делу.",
  "За каждый шаг платят опытом и золотом. За всё обучение целиком — сверху набор: доспех первой ступени во все пустые слоты, три малых зелья лечения, опыт и золото.",
  "Награда идёт и тем, у кого обучение начато, но не закончено: за оставшиеся шаги её начислят по мере прохождения.",
]

[[release]]
version = "1.27"
headline = "Обновление 1.27: в глуши стали попадаться подземелья, которых в сводке не было."
added = [
  "В локациях сами собой открываются блуждающие подземелья — тёмные ходы под землю, которых на карте не было. Внутри как городской спуск: комната за комнатой, развилка за развилкой, в глубине логово.",
  "Подземелье рассчитано либо на одного, либо на отряд — видно на экране. С отрядом в одиночное не спускаются, в одиночку — в то, что на отряд.",
  "Пока в подземелье кто-то есть, войти не может никто: экран так и говорит. Пройденное до логова подземелье осыпается и исчезает; ушедший или проигравший освобождает вход для других.",
  "Уровень и плата подземелья — по той полосе локации, где оно возникло; у того, что на отряд, враги крепче и плата щедрее.",
]

[[release]]
version = "1.26"
headline = "Обновление 1.26: подземелья стали процедурными вылазками с выбором сложности."
changed = [
  "Спуск больше не прямая цепочка боёв. Теперь это заход комната за комнатой: после каждой — развилка на две-три двери, куда идти дальше решаете вы, а назад пути нет.",
  "На входе выбирают сложность: «разведка» (налегке), «тёмный ход» (враги крепче, плата щедрее) и «гиблый спуск» (враги вдвое опаснее, плата вдвое выше).",
  "Всё, что выше «разведки», несёт случайные условия на весь заход — и беды, и блага: промозглая тьма, спёртый воздух, богатая порода, твёрдая рука.",
  "«Тёмный ход» бросает одно условие, «гиблый спуск» — сразу два: одну беду и одно благо.",
  "Здоровье между боями по-прежнему не восстанавливается, но каждая выигранная комната немного латает раны, а «затишье» на развилке — сильно.",
  "Дно за логовом платит по-прежнему только дошедшему до него, но теперь тем щедрее, чем выше сложность. Ход наверх на последней развилке уводит с тем, что уже взято.",
  "Оба спуска города — обычный и глубокий — получают выбор сложности; Печати Палаты, как и раньше, добавляют заходу глубины.",
]

[[release]]
version = "1.25"
headline = "Обновление 1.25: локации больше не стоят на месте."
changed = [
  "Отработанная округа заселяется заново по-другому: другие тропы, места встают в другом порядке, у мест другие названия. Прежняя карта локации больше не возвращается.",
  "Карту двигает выработка, а не часы: пока в узлах есть что брать, всё на месте; проработали округу — она переложилась. Локацию, куда сутками никто не ходил, отпускает к исходной.",
  "Хозяин логова всегда в самой глубине локации, за шаг до выхода. Вереницы эпических стражей перед ним больше нет; мимо его логова путь к выходу есть, драться с ним — решение.",
]

[[release]]
version = "1.24"
headline = "Обновление 1.24: локации крупнее, эпических боёв меньше, а округа перекладывается заметно быстрее."
changed = [
  "В локации теперь от 16 до 28 узлов вместо 12–24: даже небольшая локация стала длиннее, развилок и обходных троп больше.",
  "Цепочка стражей перед хозяином логова короче — один-два вместо одного-трёх, — а на узле с сильным одиночкой теперь ровно один бой, а не два подряд.",
  "Сильный одиночка на случайном боевом узле снова редкость: смену ритма несёт подступ к логову, а не россыпь эпиков по всей вылазке.",
  "Проработанная округа перекладывается быстрее — за одну плотную вылазку она успевает смениться хотя бы раз.",
  "И перекладывается шире: меняется не только то, где ждёт стая, а где следы, но и то, где встретит сильный боец, а где — обычная стая.",
  "Схроны, сборы и святилища по-прежнему стоят там же и в том же числе: задание «найдите четыре схрона» остаётся выполнимым в любом поколении.",
  "Карты в этот раз переложились целиком: с новым размером локаций прежние тропы уже не те. Дальше карта снова постоянна, и выученная дорога останется прежней.",
]

[[release]]
version = "1.23"
headline = "Обновление 1.23: локации стали больше, а к хозяину логова ведёт цепочка эпических боёв."
changed = [
  "В локации теперь от 12 до 24 узлов вместо 8–14: больше развилок, больше обходных троп, дольше вылазка.",
  "Разнообразия прибавилось: имён у мест стало вдвое больше, сильные одиночные противники попадаются чаще, а находок — чуть больше, чем боёв.",
  "К хозяину логова ведёт вереница эпических боёв: один-три стража подряд, и в обход них к логову не пройти. Драться с самим хозяином по-прежнему необязательно — мимо логова путь есть.",
  "Карты в этот раз переложились целиком: с новым размером локаций прежние тропы уже не те. Дальше карта снова постоянна, и выученная дорога останется прежней.",
]

[[release]]
version = "1.22"
headline = "Обновление 1.22: проработанная округа заселяется заново."
changed = [
  "Локация, которую как следует выбили, перекладывается: там, где стояла засада, теперь встречают патруль; где были следы — оказывается схрон; короткие тропы между узлами ложатся иначе.",
  "Дорога, которую вы выучили, остаётся прежней. Узлы стоят на своих местах, зовутся как звались, ведут туда же. Меняется то, что в них ждёт, и какими срезками они связаны.",
  "Перекладку считает не время, а работа: пока в округе есть что брать, она стоит как стояла. Выбитая — заселяется заново; надолго забытая — отходит к исходному виду.",
  "Босс по-прежнему один и на том же удалении, и святилище остаётся святилищем.",
]

[[release]]
version = "1.21"
headline = "Обновление 1.21: вещи можно передавать соратникам и соклановцам напрямую."
added = [
  "На экране отряда появилась кнопка «Передать соратнику», на экране гильдии — «Передать соклановцу». Сначала выбираете, кому, потом вещь из сумки, а для стопки игра спросит, сколько передать.",
  "Передача мгновенная и получателя ни о чём не спрашивает — как и в игровой группе. Пошлиной не облагается.",
  "Передать нельзя тому, с кем у вас закрыты дела через чёрный список, и нельзя, пока вы в бою.",
  "Набором: «/отряд передать» и «/гильдия передать».",
]

[[release]]
version = "1.20"
headline = "Обновление 1.20: экрана «этот раздел ещё не готов» больше нет."
fixed = [
  "Служба, которой у города нет, больше не ведёт на пустой экран «этот раздел ещё не готов». Кнопки такой службы нет, а нажатая со старой клавиатуры — отвечает объяснением и оставляет вас в городе.",
]

[[release]]
version = "1.19"
headline = "Обновление 1.19: появились гильдии."
changed = [
  "В главном меню появилась кнопка «Гильдия». Основать свою можно с 10 уровня, грамота стоит 500 золота, а имя пишут одним сообщением — от 3 до 24 знаков.",
  "В гильдии три звания: основатель, офицер, участник. Основатель раздаёт и снимает звания, зовёт и распускает; офицер зовёт новых и берёт из общей казны; участник в казну только кладёт.",
  "Казна у гильдии общая. Класть может каждый в гильдии, берёт основатель и офицер. При роспуске казна возвращается основателю.",
  "Зовут в гильдию именем — с экрана гильдии или «/гильдия пригласить». Позванный соглашается сам, зов ждёт десять минут.",
  "Состав гильдии постоянный: он лежит в базе и переживает выход из игры.",
  "Набором: «/гильдия», «/гильдия создать», «/гильдия пригласить», «/гильдия принять», «/гильдия состав», «/гильдия казна», «/гильдия распустить».",
]

[[release]]
version = "1.18"
headline = "Обновление 1.18: отряд больше не распадается сам."
changed = [
  "Состав отряда теперь постоянный. Он держится, пока отряд не расформируют или пока из него не уйдёт собравший, и переживает выход из игры.",
  "Прежний срок в два часа отменён: собрались однажды — и дальше ходите вместе, ничего не пересобирая.",
  "Зов в отряд по-прежнему ждёт ответа пять минут и гаснет сам.",
]

[[release]]
version = "1.17"
headline = "Обновление 1.17: у каждого города теперь два спуска, второй — глубже."
changed = [
  "Ниже обычного подземелья у города открылся второй ход — глубокий спуск. У него своё имя и свой уровень: он идёт по верхней границе полосы города и с вами не растёт.",
  "Открыт он тому, кто добрался до последней локации города. До того экран подземелья называет глубокий ход и говорит, какой уровень для него нужен, но кнопки не даёт.",
  "Дно глубокого спуска платит по его уровню, а не по вашему: противник там крепче, и находка со дна дороже.",
  "Печати Палаты, как и раньше, кладут схватку ниже прежнего дна — теперь того из двух спусков, в котором вы сейчас.",
]

[[release]]
version = "1.16"
headline = "Обновление 1.16: провокация теперь провоцирует."
changed = [
  "«Провокация» воина уводит удар цели на воина: пока держится вызов, цель бьёт по нему, а не по тем, кто мягче. Провокатор на эти ходы прикрывается броней на четверть.",
  "«Вызов» паладина делает то же со всеми противниками сразу и вдобавок сбивает им удар. Встать между стаей и товарищами — теперь буквально его дело.",
  "Грань «На весь двор» у «Провокации» распространяет вызов на всех; грань «Затянуть» тянет и сам вызов, а не только броню.",
  "В одиночном бою переключать некого — там от провокации остаётся броня.",
]
fixed = [
  "«Лечит вас и ваш отряд» наконец лечит и отряд. Полковое лечение воина, паладина, жреца и друида поднимало одного заклинателя; теперь доля приходит каждому, и грань «снять беды» снимает их всем.",
  "Частые нажатия в бою больше не тонут в тишине: игра держит счёт отправок не только на бота целиком, но и на отдельный чат, и ответы на барабанную дробь идут по одному в секунду вместо отказа Telegram.",
]

[[release]]
version = "1.15"
headline = "Обновление 1.15: отряд стал отрядом — его создают, в него приглашают, и мест в нём больше нет."
changed = [
  "В главном меню появилась кнопка «Отряд». На ней — «Создать отряд», а у заведённого отряда — «Пригласить в отряд» и «Расформировать отряд».",
  "Отряд из одного человека — уже отряд: его заводят заранее и зовут в него, а не собирают наугад.",
  "Позвать можно тремя дорогами: именем с экрана приглашения, кнопкой «Позвать в отряд» рядом с тем, кто стоит на вашем узле, и словом «пригласить» ответом на его сообщение в игровой группе.",
  "Согласие по-прежнему даёт сам позванный: «Пойти вместе» на экране отряда или «/отряд принять» откуда угодно.",
  "Мест в отряде больше нет. Вожака, щита, лекаря, клинка и дозорного не стало вместе с их прибавками: каждый в отряде дерётся ровно тем, что принёс с собой.",
  "Стая теперь всегда бьёт того, кому осталось меньше всех: перехватить чужой удар в отряде нечем.",
  "Строка о своём в бою называет имя и числа: «Вы: здоровье 240 из 300».",
  "Набором: «/отряд создать», «/отряд расформировать», «/отряд пригласить», «/отряд принять», «/отряд отказать», «/отряд уйти».",
]

[[release]]
version = "1.14"
headline = "Обновление 1.14: в отряде пятеро, у каждого своё место, а закрыться умеет всякий."
changed = [
  "В отряд помещается пятеро, и у каждого есть место: вожак, щит, лекарь, клинок, дозорный.",
  "Место занимают сами: «/отряд щит», «/отряд лекарь», «/отряд клинок», «/отряд дозорный»; «/отряд снять» его освобождает. Свободные места и то, что каждое из них делает, называет «/отряд».",
  "Щит носит броню на сорок процентов крепче и бьёт на четверть слабее, а стая идёт на него, пока у него больше четверти здоровья. Уронили щит — стая берётся за тех, кто мягче.",
  "Лекарь лечит на сорок процентов лучше и бьёт на треть слабее. Клинок бьёт на четверть сильнее и получает на четверть больше. Дозорный ходит раньше всех и держит меньше.",
  "Место названо в бою вместе со здоровьем: «Вы (щит): здоровье 240 из 300».",
  "В бою появилась кнопка «Защититься»: ход уходит на оборону, а за него дают брони по три за уровень и треть уклонения до вашего следующего хода.",
  "На кнопке обычного удара написано, сколько он снимет: «Атака — натиск, урон от 17 до 19».",
  "Кнопка выбора цели называет здоровье той цели, которую выбирают.",
]
fixed = [
  "Ход, отданный обороне, теперь считается ходом: противник на него отвечает, а след помнит оборону — три хода подряд из защиты ломают размен так же, как три удара.",
]

[[release]]
version = "1.13"
headline = "Обновление 1.13: выучить все умения больше нельзя, и это выбор, а не потеря."
changed = [
  "Ранг умения стоит тем дороже, чем он выше: первый — очко, пятый — четыре. Умение, поднятое до предела, стоит двенадцать.",
  "Сорок умений класса стоят 480 очков, а триста уровней дают 299. К пределу доводится около трёх пятых дерева — остальное вы выбираете.",
  "Прежнее «к трёхсотому изучено всё и всё на пятом ранге» отменено: оно делало двух воинов одного уровня неразличимыми.",
  "У каждого умения есть ветвь: натиск, оборона или точность. Это тот же след, что умение оставляет в бою, — сборка в одной ветви чаще набирает разгон.",
  "Позднее умение ветви открывают вложенные в неё очки, а не уровень: на четырёх ступенях нужно 0, 20, 50 и 90 вложенных.",
  "На четырёх уровнях боевое умение приходит парой: два на одно место. Взяли одно — второе закрыто, пока не разберёте взятое у наставника.",
  "Пятый ранг возвращает умение на ход раньше: четырёх очков одни проценты урона не стоят.",
  "Позднее умение не бьёт сильнее — оно делает больше: барьер, оглушение всех сразу, метка, «не пасть».",
]

[[release]]
version = "1.12"
headline = "Обновление 1.12: у удара есть род, у состояния — имя, а умений стало шестьдесят."
changed = [
  "Удар больше не «физический» вообще. Копьё колет, меч рубит, булава дробит, зверь рвёт — и защита считается по тому, чем именно ударили.",
  "Латы держат удар вообще, а поддоспешник — колющий: две защиты складываются, а не заменяют друг друга.",
  "«Стихийного урона» больше нет: он обещал стихию и не называл ни одной. Вместо него двенадцать настоящих — огонь, холод, яд, кислота, ветер, хаос и прочие.",
  "То, что висит на вас и на противнике, называется вслух и со сроком: «горение 2 хода», «оглушение 1 ход», «слабость 3 хода».",
  "Состояний двадцать: от горения и яда до очарования, заморозки и барьера. Щит стал барьером: у него есть срок, и он сгорает вместе с тем, кто его поставил.",
  "Оглушение пережидают, заморожённый получает больше урона, а испуганного приводит в чувство первый же дошедший удар.",
  "Очарованный бьёт по своим, спутанный — в кого попало. Ход у них есть: отнимают у них не ход, а прицел.",
  "Умений у класса шестьдесят вместо четырнадцати: двадцать боевых и сорок пассивных. В панель по-прежнему встают шесть — выбирать стало из чего.",
  "Развитие стало ровным: с первого уровня по трёхсотый нет ни одного долгого промежутка без нового умения.",
  "Очко за уровень ровно покрывает шестьдесят умений по пять рангов: к трёхсотому изучено всё и всё на пятом ранге.",
  "«Постоянные» умения теперь называются пассивными. Слота они по-прежнему не занимают: изученное работает.",
]
fixed = [
  "Горение от двух разных умений больше не считается дважды: это одно горение, и оно обновляется.",
  "Урон по ходам смягчается защитой: раньше он проходил мимо любых сопротивлений.",
  "Кнопка называет каждое состояние, которое умение накладывает, и на сколько ходов.",
]

[[release]]
version = "1.11"
headline = "Обновление 1.11: удар лёг в границы, а спуск стал местом."
changed = [
  "Верх удара нигде не выше полутора нижних. Булава на сотом уровне бьёт «от 257 до 383» вместо «от 122 до 518», меч — «от 245 до 281».",
  "По такому числу можно решать, добьёт ли удар. По прежнему решать было нечего.",
  "Размах остался характером оружия: булава бьёт шире меча, посох ровнее всех. Ушёл только тот размах, что рос сам собой со ступенью вещи.",
  "Подземелье города больше не подстраивается под того, кто в него спускается: у спуска свой уровень, по самой глубокой локации города, до которой вы дошли.",
  "Переросший город перерос и его подземелье: платит оно по уровню города, и экран говорит об этом до входа.",
  "Стая делит бой целиком. Трое противников и раньше были слабее каждый; теперь они и платят как один бой, а не как три.",
  "Обычный противник на первых уровнях бьёт заметнее и падает быстрее: бой на первом уровне тянулся четыре с половиной хода при обещанных трёх.",
  "Все шестнадцать расовых способностей заработали: раньше это были строки, которые игра нигде не читала.",
  "Сопротивление огню, холоду и яду наконец что-то значит: живой огонь бьёт огнём, утопленник холодом, паук ядом.",
  "Опыт за задания, находки на событиях и уцелевшие после работы материалы считаются по вашим особенностям.",
  "Ранг «Исчезновения», «Юркости», «Отсрочки» и «По памяти» возвращает умение быстрее: раньше очко в такой ранг пропадало.",
]
fixed = [
  "Экран умений показывал восемь кнопок и рассказывал про пять: остальное не помещалось в сообщение и пропадало молча.",
  "В главном меню больше нет «Назад» и «Главное меню»: первая вела в главное меню, вторая — туда, где вы уже стоите.",
  "«Назад» после укладки умения в слот вело обратно в выбор умения, и слот читался пустым, хотя умение уже лежало в нём.",
  "Отчёт о бое, задании и дне спуска называет тот опыт, который вам записали.",
]

[[release]]
version = "1.10"
headline = "Обновление 1.10: удар стал ровнее, а умения делают то, что написано."
changed = [
  "Разброс урона стал вдвое уже. Булава на сотом уровне била «от 9 до 630»: одно нажатие приносило то девятку, то шесть сотен. Теперь она бьёт «от 122 до 518».",
  "В среднем оружие бьёт ровно столько же. Ушла не сила, а та часть невезения, которая была не игрой, а шумом. Булава по-прежнему бьёт шире меча, посох ровнее всех.",
  "Бой стал предсказуемее, но не дешевле: везучих боёв на два хода почти не осталось, зато и неудачных вдвое меньше.",
  "Инициатива наконец что-то значит: кто быстрее, того противник не всегда успевает достать. Всё, что её отнимает и прибавляет, работает.",
  "Щит держится три хода, как и написано, — раньше он стоял до конца боя. Взамен все щиты стали больше.",
  "Лечение по ходам лечит каждый ход, а не один раз и молчок.",
]
fixed = [
  "Пятнадцать постоянных умений из сорока восьми начали работать: «физический урон выше», «урон по зверям выше», «добыча выпадает чаще». Очко в них вкладывалось и не давало ничего.",
  "Дымовая шашка, финт, облако тьмы и путы сбивают противнику прицел. Точность противника не считалась вовсе.",
  "«Ответный выпад» воина отвечает на удар, «Жажда крови» варвара забирает часть нанесённого урона, «Последний рубеж» не даёт пасть.",
  "«Ярость» снимает броню, «Аватар ярости» бьёт вдвое сильнее и растёт с рангом, «Медвежий облик» поднимает запас здоровья прямо в бою.",
  "Кража золота у гоблина берёт долю кошелька, а не сотню с полтиной. «Очарование» кончает бой миром только с тем, кто на мир способен.",
  "Тексты, обещавшие не те числа, исправлены по числам: «Печать смерти», «Второе дыхание», «Боевой клич», «Дикий удар», «Небесная кара», «Возвращение», «Благословение».",
]

[[release]]
version = "1.9"
headline = "Обновление 1.9: ход тратится только на то, что произошло."
changed = [
  "Постоянные умения работают все до одного: изучено — значит работает, слотов под них больше нет. Раньше в бою считались три из шести, и очко, вложенное в четвёртое, не делало ничего.",
  "Карточка персонажа называет все девять производных значений вместо шести: сила крита, восстановление ресурса и лечение по ходам считались в каждом бою и не были сказаны нигде.",
  "Победа и поражение читают последний ход: кто ударил последним и сколько снял этот удар. Раньше «Победа.» не говорила ни того, ни другого.",
  "Новый уровень приходит отдельным сообщением и со всем причитающимся: очками, здоровьем, открывшимися умениями и городом. Строкой посреди отчёта о бое он терялся между добычей и здоровьем.",
]
fixed = [
  "Пустой слот в бою больше не съедает ход. Нажатие на «4. Пустой слот» прокручивало ход целиком: откаты тикали, и каждый живой враг успевал ударить, пока вы не сделали ничего.",
  "Столько же стоило нажатие на умение в откате, на умение без ресурса и на умение не под то оружие. Теперь игра говорит «нельзя» и ждёт следующего нажатия, а ход остаётся ваш.",
  "Пустой слот и кнопки больше не получает. Позицию держит номер: третье умение остаётся «3.», даже когда первый и второй слоты пусты.",
  "Промах перестал накладывать эффекты. Кровотечение, помеха и оглушение идут следом за попаданием, а не за нажатием: раньше промахнуться было выгоднее, чем попасть.",
  "Наставник перестал брать деньги за то, чего не может забрать: расовое умение стояло в его списке, он объявлял его забытым — и умение оставалось на месте.",
]

[[release]]
version = "1.8"
headline = "Обновление 1.8: урон бросается костями, а редкость наконец что-то значит."
changed = [
  "Урон стал числом в границах. Меч бьёт «от 6 до 114», булава — вразброс шире, чем меч. Раньше урон был долей от невидимого «стандартного удара», и найденное оружие ощущалось никак.",
  "Весь урон в игре растёт из оружия. Умение говорит, во сколько раз оно бьёт сильнее обычного удара, и кнопка показывает границы: «урон от 34 до 96».",
  "Броня доспеха — число, и оно написано на карточке. Прибавки к характеристикам — тоже числа.",
  "Редкость решает, что вещь даёт. Обычная — только броню и урон, необычная — одну характеристику, редкая — две, легендарная — две и особое свойство.",
  "Появились реликтовые вещи. Они дают то же, что легендарные, но их числа считаются от вашего уровня и растут вместе с вами — такая вещь не устаревает никогда.",
  "Реликтовое берут только с хозяина логова или получают за цепочку заданий, пройденную до конца. На прилавке его не бывает.",
  "Снаряжение теперь есть на всём пути до трёхсотого уровня: двенадцать ступеней у каждого вида, от ветхого до немеркнущего. Раньше после тридцатого надеть было нечего.",
  "С побеждённых стало падать снаряжение. С обычного — изредка, с эпического — чаще, с хозяина логова — всегда.",
  "Класс больше ничего не запрещает. Надеть можно что угодно, но за чужое оружие точность ниже на 20 процентов и инициатива на 15, а за часть чужого доспеха — на 5 и 8.",
  "Карточка вещи говорит о такой цене до того, как вы её наденете.",
  "Умения, которые просят своё оружие, с чужим по-прежнему не работают: чужим мечом можно махать плохо, а выстрелить без лука нечем.",
  "Новый герой выходит одетым: оружие своего класса и доспех первой ступени. Кулак бьёт втрое слабее самого простого меча.",
  "«Эпический» стал «Легендарным», и добавился «Реликтовый».",
]


[[release]]
version = "1.7"
headline = "Обновление 1.7: доспех держит удар, а оружие бывает разным."
changed = [
  "У доспеха появилась броня. Раньше защита росла из одной выносливости, и латы ощущались как стёганка. Теперь каждая надетая вещь держит своё число, и оно видно на карточке.",
  "У доспеха есть род: тканый, лёгкий, средний, тяжёлый. Тяжёлый держит удар вчетверо лучше ткани и отнимает инициативу, ткань добавляет запас ресурса. Нагрудник прикрывает больше, чем сапоги.",
  "У оружия есть род: кинжал, короткий меч, меч, двуручный меч, топор, булава, копьё, лук, посох, жезл и символ веры. Двуручник бьёт тяжелее, кинжал — быстрее и злее, и это написано числами на карточке.",
  "Класс носит своё. Разбойник не возьмёт двуручник, маг не наденет латы: карточка чужой вещи говорит об этом словами и кнопки «Надеть» не показывает вовсе. Продать такую вещь по-прежнему можно.",
  "Умение может просить оружие: выстрел — лук, удар в спину — кинжал, вихрь клинков — меч. Кнопка говорит, чего не хватает, до нажатия, и ход на отказ не уходит.",
  "В лавках появилось оружие каждого рода с первых уровней и доспех для тех, кому раньше нечего было надеть.",
  "Четырнадцать вещей перестали обещать урон, которого не было: «физический урон» и «магический урон» не считал никто, теперь это обычный урон и он работает.",
  "Противники стали крепче на сорок процентов. Их считали против безоружного героя, и вооружённый клал их за два хода.",
  "У вещей больше нет описаний. Вещь называет себя именем, родом, слотом и числами — так о ней можно сказать правду, а не одну фразу на сотню предметов.",
]


[[release]]
version = "1.6"
headline = "Обновление 1.6: игра зовёт вещи привычными словами."
changed = [
  "«Подряды» стали «Заданиями»: доска заданий в таверне, кнопка «Сдать задание», журнал «Задания» в главном меню. Сами работы, плата и счёт остались прежними.",
  "«Долговой круг» стал «Ареной». Ставка, слепок соперника и таблица сезона не менялись: арена по-прежнему отдаёт сверху только то, что уже держит вашего.",
  "«Оборот» на трёхсотом уровне стал «Перерождением», а «Счётный вопрос» Палаты — «Голосованием». Печать Палаты, заклад и вес голоса те же.",
  "Обучение считает шаги, а не задания, чтобы шаг обучения и работа с доски не звались одним словом. Кнопка на экране обучения теперь «Перейти к шагу».",
]


[[release]]
version = "1.5"
headline = "Обновление 1.5: характеристики говорят правду, а экран не забывает, как он называется."
changed = [
