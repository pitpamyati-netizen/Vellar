  "Ваш персонаж прежний: характеристики, умения, вещи и уровень не тронуты. Умение расы вызывается командой «/раса»; прежние «/род» и «/народ» работают.",
]

[[release]]
version = "0.7"
fixed = [
  "Игра больше не отвечает «что-то пошло не так» на каждое нажатие. Виновата была прерванная вылазка: игра помнила экран локации, но не саму локацию, и спотыкалась об это снова при каждом ответе.",
  "Потерянная вылазка теперь просто заканчивается: вы оказываетесь в списке локаций своего города и выбираете, куда идти.",
]

[[release]]
version = "0.9"
headline = "Обновление 0.9: в городах появились люди."
added = [
  "В городе, где кто-то живёт, появилась кнопка «Жители». Человек говорит своё и держит свою работу: подряд берут у него, а не с доски.",
  "Работа у жителя — тот же разговор, что и на доске: соглашаетесь, спрашиваете, кто платит, или уходите. Уйти можно всегда, подряд от этого не закрывается.",
]
changed = [
  "Мир теперь меняется, не останавливая игру: новый человек, новый подряд, новая локация или новый противник появляются между двумя вашими нажатиями, без перезапуска.",
]

[[release]]
version = "1.0"
headline = "Обновление 1.0: бой стоит здоровья, работа — заказчика, круг — своих денег."
added = [
  "Спуск в подземелье платит на дне: золото, опыт и находка сверх всего, что вы взяли в трёх схватках. Ушли на середине — унесли только взятое.",
  "У сырья появилось место: травы берут на лугах и в лесу, болотную руду — у воды, кристалл — под землёй, лишайник — на скалах. Что даёт ваш город, написано на экране ремесла.",
  "Три новых материала и три рецепта под них: молот каменотёса, зелье лечения и тихие шаги.",
  "Работу стали заказывать: «Точила для заставы» в Дубно и «Настой для мостков» в Суроже платят за сделанное своими руками.",
]
changed = [
  "Обычный противник бьёт втрое сильнее прежнего. Вылазка перестала быть бесплатной: раны копятся, и постель в таверне наконец имеет цену. Эпические противники и хозяева мест бьют как били.",
  "Классы сравнялись в бою против хозяина места: самый быстрый больше не кончает его вдвое быстрее самого медленного.",
  "Долговой круг отдаёт долги, а не печатает золото: сверх ставки он платит только тем, что уже держит вашего. Проигранная ставка — то, что вернёт следующая победа. Первый выход даётся в долг.",
]
fixed = [
  "Сделка в группе списывает золото ровно в тот миг, когда вы соглашаетесь. Раньше между проверкой кошелька и оплатой оставался зазор, в который помещалась ваша же покупка в другом окне.",
