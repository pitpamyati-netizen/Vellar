  "Стая делит силу на всех. Трое врагов — это по-прежнему один бой, а не три подряд.",
]

[[release]]
version = "0.5"
changed = [
  "Никаких иных народов: в Велларе живут люди, и различает их работа. Вместо расы — род, семья с промыслом: обозники, мытари, рудокопы, углежоги, перевозчики.",
  "Ремёсла названы по работе: ратник, забойщик, заступник, ловчий, головорез, чародей, лекарь, ведун.",
  "Ваш персонаж прежний: характеристики, умения, вещи и уровень не тронуты. Изменились только имена на экране.",
  "Экраны спрашивают род и ремесло, а не расу и класс. Умение рода вызывается командой «/род»; прежние «/народ» и «/раса» работают.",
  "Чародей считает не ману, а чары; ловчий — выдержку, головорез — прыть. Числа те же.",
  "Умение рода — приём его промысла: углежог швыряет горсть пепла, плавильщик ставит клеймо, перевозчик уходит в воду. Противники тоже переназваны: живой огонь вместо элементаля.",
]

[[release]]
version = "0.6"
added = [
  "Ремёсла: пять работ, которым учится кто угодно. Горное дело и травничество приносят сырьё, кузнечное дело, алхимия и кожевенное дело делают из него вещи.",
  "Экран «Ремёсла» в главном меню: у каждого ремесла свой ранг, и он растёт от работы, а не от выбора при создании.",
  "Собирать можно раз в четверть часа, и откат этот ваш собственный: сырьё родится снова, зашли вы за это время или нет.",
  "Партия выходит обычной, ладной или отменной: ладная даёт лишнюю вещь, отменная ещё и оставляет половину материалов.",
]
changed = [
  "Раса и класс снова называются расой и классом: человек, дварф, лесной эльф, орк, тифлинг; воин, варвар, паладин, следопыт, разбойник, маг, жрец, друид.",
  "Слово «ремесло» теперь значит только производство. Ремесло — это то, что вы делаете руками и продаёте, а не то, кем вы записаны.",
  "Вы приключенец, а не житель: ни двора, ни семьи, ни приписки к городу. Дорога, подряды, добыча и работа руками.",
  "Ваш персонаж прежний: характеристики, умения, вещи и уровень не тронуты. Умение расы вызывается командой «/раса»; прежние «/род» и «/народ» работают.",
]

[[release]]
