  "Эпические противники и хозяева логова. Обычный бой кончается за три хода, эпический тянется вдвое, хозяин — вчетверо. Локация называет, кто где ждёт.",
  "У каждого ремесла есть все три следа не позже четырнадцатого уровня, так что перелом доступен любому.",
]
changed = [
  "Умения больше не слабеют с уровнем. Раньше после тридцатого любое умение било слабее простой атаки; теперь сила умения — доля вашего удара, и она держится до трёхсотого.",
  "Брешь теперь стоит своего: броня врага не в счёт, и его собственный удар в этот ход вдвое слабее.",
