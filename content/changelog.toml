# Что изменилось в игре, словами игрока.
#
# Одна запись - одно действие, которое игрок теперь может совершить, или одна
# вещь, которую он теперь увидит. Никаких модулей, коммитов и таблиц: канал
# читают те, кто играет (Narrative.md, раздел 8). Версии только числовые:
# "0.10" выходит после "0.9".
#
# Пост в канал: uv run python scripts/broadcast.py --changelog latest --dry-run

[[release]]
version = "0.1"
added = [
  "Создание персонажа: род, ремесло, две черты и первые очки.",
  "Дорога и пятнадцать городов: локации, узлы и путь с первого уровня.",
  "Бой без таймера: шесть умений, три пассивных, зелья и отход.",
  "Лавка города: ассортимент меняется со сменой стражи, раз в шесть часов.",
  "Настройки для чтения с экрана: длина ответа, подтверждения, автодействие.",
]

