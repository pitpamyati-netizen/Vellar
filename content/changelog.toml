[[release]]
version = "1.7"
headline = "Обновление 1.7: доспех держит удар, а оружие бывает разным."
changed = [
  "У доспеха появилась броня. Раньше защита росла из одной выносливости, и латы ощущались как стёганка. Теперь каждая надетая вещь держит своё число, и оно видно на карточке.",
  "У доспеха есть род: тканый, лёгкий, средний, тяжёлый. Тяжёлый держит удар вчетверо лучше ткани и отнимает прыть, ткань добавляет запас ресурса. Нагрудник прикрывает больше, чем сапоги.",
  "У оружия есть род: кинжал, короткий меч, меч, двуручный меч, топор, булава, копьё, лук, посох, жезл и символ веры. Двуручник бьёт тяжелее, кинжал — быстрее и злее, и это написано числами на карточке.",
  "Класс носит своё. Разбойник не возьмёт двуручник, маг не наденет латы: карточка чужой вещи говорит об этом словами и кнопки «Надеть» не показывает вовсе. Продать такую вещь по-прежнему можно.",
  "Умение может просить оружие: выстрел — лук, удар в спину — кинжал, вихрь клинков — меч. Кнопка говорит, чего не хватает, до нажатия, и ход на отказ не уходит.",
  "В лавках появилось оружие каждого рода с первых уровней и доспех для тех, кому раньше нечего было надеть.",
  "Четырнадцать вещей перестали обещать урон, которого не было: «физический урон» и «магический урон» не считал никто, теперь это обычный урон и он работает.",
  "Противники стали крепче на сорок процентов. Их считали против безоружного героя, и вооружённый клал их за два хода.",
  "У вещей больше нет описаний. Вещь называет себя именем, родом, слотом и числами — так о ней можно сказать правду, а не одну фразу на сотню предметов.",
]


[[release]]
version = "1.6"
headline = "Обновление 1.6: игра зовёт вещи привычными словами."
changed = [
  "«Подряды» стали «Заданиями»: доска заданий в таверне, кнопка «Сдать задание», журнал «Задания» в главном меню. Сами работы, плата и счёт остались прежними.",
  "«Долговой круг» стал «Ареной». Ставка, слепок соперника и таблица сезона не менялись: арена по-прежнему отдаёт сверху только то, что уже держит вашего.",
  "«Оборот» на трёхсотом уровне стал «Перерождением», а «Счётный вопрос» Палаты — «Голосованием». Печать Палаты, заклад и вес голоса те же.",
  "Обучение считает шаги, а не задания, чтобы шаг обучения и работа с доски не звались одним словом. Кнопка на экране обучения теперь «Перейти к шагу».",
]


[[release]]
version = "1.5"
headline = "Обновление 1.5: характеристики говорят правду, а экран не забывает, как он называется."
changed = [
  "Характеристики наконец описаны тем, что игра за ними считает. До этого экран обещал переносимый вес, сопротивления, редкость добычи и лечение от мудрости — и ни одного из четырёх в расчёте не было.",
  "Класс говорит, от чего у него растёт удар, и говорит это словами: «Сила ведёт удар, выносливость держит Отвагу и место в строю». Раньше про силу было написано «урон в бою, когда класс дерётся силой».",
  "Всякий экран называет себя, даже когда наверху стоит весть о случившемся. Вложили очко — слышите и «Сила теперь 8», и «Характеристики», а не одно вместо другого.",
  "«Подробные описания» в настройках наконец что-то переключают: с ними характеристики объясняют, что даёт вложенное очко, без них — только называют числа.",
  "Проценты читаются по-русски: «2,75 процента», а не «2.8 процентов».",
  "Кнопка «Данжи» стала «Подземельями», а «Собрать ресурсы» — «Собрать сырьё»: игра зовёт вещи так же, как их зовёт Веллар.",
  "Хозяина логова больше нигде не называют боссом.",
]


[[release]]
version = "1.4"
headline = "Обновление 1.4: умение говорит, что будет с нажатия, а панель не режет набранное."
changed = [
  "Умение, дошедшее до ранга грани, так и говорит на кнопке: «сначала выберите грань». Раньше кнопка обещала ранг, нажатие уходило на грань, и ранг не менялся — экран выглядел заевшим.",
  "Выбрав грань, вы слышите, что ранг снова растёт за очко умений.",
  "Описание умения в списке больше не обрывается на середине.",
  "Игра, запущенная поверх ещё не закрывшейся копии, дожидается её сама, а не сыплет отказами Telegram.",
  "Грани умений наконец делают то, что написано. Раньше любая первая грань просто била на 20 процентов сильнее, любая вторая — стоила на 35 дешевле, а у постоянных умений грань не делала вовсе ничего.",
  "«Кровопускание» теперь пускает кровь, «Размах» задевает вторую цель, «Оглушение» отнимает ход. Описание грани и её числа — одно и то же.",
  "Кровотечение, горение и яд отнимают здоровье каждый ход. Раньше «цель теряет здоровье ещё 3 хода» было только надписью.",
]


[[release]]
version = "1.3"
headline = "Обновление 1.3: локация никуда не денется, а список можно искать."
added = [
  "Нажатие на вещь в сумке или на прилавке открывает её карточку: что она даёт, сколько стоит и чем отличается от того, что на вас надето. Сравнение считается само.",
  "Поиск по списку: нажмите «Поиск», наберите слово одним сообщением — и список оставит только то, где это слово есть, хоть в названии, хоть в описании.",
  "Разделы списка: особенности режутся по разделам, вещи — по виду, умения — на боевые и постоянные.",
  "Взятый подряд остаётся на доске со своим счётом, и его можно вернуть, если передумали.",
]
changed = [
  "Локация теперь всегда одна и та же: узлы, их имена и тропы между ними не меняются. Дорогу, выученную один раз, можно не учить заново.",
  "Зато в узле теперь не одно дело, а несколько: стая за стаей, горсть за горстью. Вычищенный узел заводится заново примерно через три минуты — уже другими противниками и другими находками.",
  "Узел говорит, сколько в нём осталось, и когда в нём снова что-то будет. Отметки «здесь уже прошли» больше нет.",
  "Подряд говорит, что делать, куда идти и что нажимать. Первый подряд Дубно называет локацию прямо в словах нанимателя.",
  "Доска подрядов и стойка в таверне принадлежат тому городу, в котором вы стоите.",
  "Разбойник начинает не с удара в спину, а с обманного финта: удар в спину бьют из тени, и он открывается позже.",
  "Бой зачитывает весь ход целиком: собственный удар больше не теряется за ответом противника.",
  "«Следующая страница» на последней странице больше не показывается.",
  "Сбор отдаёт то, чем узел назван: из трав — травы, из рудной жилы — руду. Шкура с кабана больше не волчья.",
]


[[release]]
version = "1.2"
headline = "Обновление 1.2: за игрой теперь присматривают."
added = [
  "Сделку, в которой обманули, смотритель теперь откатывает одной кнопкой: вещь возвращается тому, кто её отдал, а золото — тому, кто платил. Пошлина не возвращается: её в игре уже нет.",
]
changed = [
  "Ответ приходит так же быстро, когда играют многие: игра держит очередь сама и не даёт Telegram просить её подождать.",
  "Мир копируется по ночам, и каждая копия сразу разворачивается обратно — чтобы «копия есть» и «копия цела» были одним и тем же.",
  "Если игра встанет молча, об этом узнают в ту же минуту: за её дыханием следит отдельный сторож, живущий вне игры.",
]


[[release]]
version = "1.1"
headline = "Обновление 1.1: у дороги появился конец, и на нём есть что делать."
added = [
  "Дорожная палата открыта в каждом городе. С трёхсотого уровня в ней совершают Оборот: закладывают надетую вещь или грань умения и получают Печать Палаты.",
  "Оборот не трогает уровень, опыт и характеристики. Печать открывает другое: спуск в подземелья идёт на схватку глубже за каждую, и грань умения выбирается на ранг раньше.",
  "Палата просит с каждым Оборотом вещь дороже. Заложенное не возвращают и второй раз не принимают: что ушло в Оборот, ушло насовсем.",
  "Счётный вопрос: Палата спрашивает игру о пошлине, о воротах, о цене воды. Отвечает тот, у кого есть Печать, и голос весит столько Оборотов, сколько за ним стоит.",
  "Счёт голосов виден на экране вопроса: сколько подано, за что и кто впереди. Свой голос можно переменить, пока цикл открыт.",
]
changed = [
  "Экран подземелья называет число схваток, а не обещает три: у того, кто совершал Обороты, их больше.",
]


