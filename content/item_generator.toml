# Умный лут: чем находка отличается от случайной вещи (ADR 0071).
#
# ЧЕГО ЗДЕСЬ НЕТ. Ни одного вида снаряжения, ни одной ступени, ни одной редкости.
# Всё это живёт в items.toml и живёт там по-прежнему: вещь по-прежнему собирается
# из вида, ступени, редкости и оттиска (ADR 0015, 0059), и второго каталога у неё
# быть не может — два места, называющие одну вещь, однажды разойдутся.
#
# Здесь лежит ровно то, чего в items.toml нет: КАК ВЕЩЬ НАХОДЯТ и ЧЕГО ОНА СТОИТ
# ТОМУ, КТО ЕЁ НАДЕЛ.
#
# ============================================================================
# [meta].class_share — УМНЫЙ ЛУТ
# ============================================================================
#
# Доля находок, подобранных под класс победителя. Остальные падают как падали.
#
# Число взято не с потолка: восемьдесят пять на пятнадцать — та же доля, что у
# Diablo III после Loot 2.0, и известны обе её стороны. Хорошая: без неё игрок,
# который не торгует, месяцами не видит вещи своего рода, и находка перестаёт
# быть событием. Плохая: когда всё падает «твоё», торговать не с кем и
# пробовать нечего.
#
# Пятнадцать процентов чужого держатся здесь НАРОЧНО и не пропадают даром: чужое
# перековывают в кузнице (ADR 0060) или отдают соратнику. Находка, которую некуда
# деть, — это мусор; находка, которую есть куда деть, — это выбор.
#
# «Своё» считается по классу победителя (classes.toml, weapons/armor). В отряде
# своим считается то, что подходит хоть кому-то из победивших: добычу они всё
# равно делят между собой.
#
# ============================================================================
# [[requirement]] — ЧЕГО ВЕЩЬ ТРЕБУЕТ
# ============================================================================
#
# У рода снаряжения есть характеристики, которых он просит, и порог, растущий со
# ступенью вещи: `stats` и «уровень × factor + base».
#
# Характеристик несколько, и порог берётся ЛЮБОЙ из них. Иначе порог наказывал бы
# за своё же: булаву носят и воин, и жрец, но силу растит только первый, а
# мудрость — только второй. Названы те характеристики, на которых стоят классы,
# этот род носящие (`classes.toml`, key_stats[0]); чужому классу ни одна из них
# не достаётся, и он платит — ровно в этом весь смысл.
#
# ЭТО НЕ ЗАПРЕТ. Ровно как чужой род (ADR 0064): двуручник поднимет и разбойник,
# просто он им медленнее и чаще мажет. Не добрал до порога — платишь точностью и
# инициативой, ровно как за чужое, и цена названа на карточке вещи ДО того, как
# ты её надел (`equipment.equip_warning`).
#
# Почему порогом, а не запретом: запрет пришлось бы объяснять на каждом экране,
# где вещь может оказаться, — в лавке, в сумке, в добыче, в казне гильдии, — и
# каждый раз одинаково. Цена объясняется один раз и видна на характеристиках.
#
# ============================================================================
# [[class_affix]] — ЧТО ВЕЩЬ ДАЁТ СВОЕМУ
# ============================================================================
#
# Именной аффикс легендарной и реликтовой вещи, работающий только у своего
# класса. Вещь при этом остаётся собранной из своего имени и ни от чего больше не
# зависит (ADR 0059): аффикс лежит НА ВЕЩИ, а классом решается лишь то,
# складывается ли он в свёрток надевшего (`modifiers.equipment_modifiers`).
#
# Отсюда и честность экрана: карточка говорит «Ярость строя: только воину», и
# разбойник, поднявший её, видит ту же строку и знает, что ему она не даёт
# ничего — и что вещь стоит перековать.
#
# min_item_level — с какой ступени аффикс вообще выпадает. Именной аффикс на
# ветхом мече первой ступени обесценил бы само слово «именной».

[meta]
# Доля находок, подобранных под класс победителя.
class_share = 0.85
# Насколько дороже своего рода обходится недобранный порог характеристики.
# Те же две цифры, что за чужой род (ADR 0064): точность и инициатива.
requirement_accuracy_penalty = 4.0
requirement_initiative_penalty = 6.0
# Насколько глубже недобор считается: за каждые столько очков нехватки — ещё
# одна такая цена. Без этого «не хватает одного» и «не хватает сорока» стоили бы
# одинаково, а это разные вещи.
requirement_step = 20

# --- чего требует оружие ----------------------------------------------------
#
# Множитель и основа читаются как «уровень вещи × factor + base». Двуручник
# семнадцатой ступени просит около 218 силы — столько собирает воин, вложившийся
# в неё; разбойник той же ступени не соберёт и половины, и это ровно то, что
# должно случиться.

[[requirement]]
kind = "greatsword"
stats = ["STR"]
factor = 1.5
base = 8

[[requirement]]
kind = "warhammer"
stats = ["STR", "WIS"]
factor = 1.5
base = 8

