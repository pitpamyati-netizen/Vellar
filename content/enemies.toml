# Enemy archetypes. Concrete enemies are generated, never stored: the generator
# picks an archetype that fits the biome and scales it to the location level.
#
# Multipliers are relative to the level baseline in
# mmorpg/domain/procgen/enemies.py. 1.0 is an average opponent.
#
# biomes: which location biomes this archetype can appear in. "*" means anywhere.
# Every biome used in world.toml must have at least three candidates - checked by
# tests/content/test_enemies.py.
#
# element: каким родом урона этот противник бьёт. Физические четыре - piercing,
# slashing, bludgeoning, rending - и магические двенадцать; полный список в
# entities/damage.py. Не объявлено - решает порода: зверь рвёт, гуманоид рубит,
# нежить бьёт скверной, стихия - чарами, тварь - разумом. По роду урона считается
# сопротивление цели, и без него «Рождённый в стуже» был надписью (ADR 0018).

[meta]
kinds = ["beast", "humanoid", "undead", "elemental", "aberration"]
# Titles are adjectives, never nouns: they are glued in front of the archetype
# name ("Матёрый серый волк"). "Владыка кабан" is not Russian - which tier it is
# the combat screen says in its own words.
elite_titles = ["Матёрый", "Свирепый", "Лютый", "Исполинский", "Порченый"]

