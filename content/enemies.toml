# --- прозвища-модификаторы (ADR 0042) ------------------------------------
# adjective приклеивается перед именем породы («Иглистый ползун из штрека»).
# Множители запекаются в числа при сборке, как stakes. modifiers - ключи из
# modifiers.EFFECTIVE_KEYS, вешаются эффектом на весь бой. on_hit_status движок
# вешает на цель после состоявшегося удара породы; on_hit_magnitude в 0 для яда
# значит «от силы удара».

[[affix]]
id = "ironhide"
adjective = "Броненосный"
weight = 5
health = 1.15
armor = 1.6
initiative = 0.9
gold = 1.3
modifiers = { damage_taken_percent = -12.0 }

[[affix]]
id = "thornback"
adjective = "Иглистый"
weight = 4
health = 1.1
gold = 1.4
modifiers = { reflect_percent = 25.0 }

[[affix]]
id = "bloodletter"
adjective = "Жиловатый"
weight = 4
damage = 1.15
gold = 1.4
modifiers = { lifesteal_percent = 30.0 }

[[affix]]
id = "venombite"
