# Породы противников. Конкретные противники собираются и не хранятся никогда:
# сборщик берёт породу, подходящую биому, и растягивает её на уровень локации.
#
# Множители считаются от основания по уровням в
# mmorpg/domain/procgen/enemies.py. 1.0 - это средний противник.
#
# biomes: в каких биомах локаций эта порода может появиться. "*" значит везде.
# У каждого биома, который встречается в world.toml, обязано быть хотя бы три
# кандидата - проверяет tests/content/test_enemies.py.
#
# dungeon = true: порода живёт только под землёй (ADR 0042). Заход в подземелье
# тянет противников из dungeon-пород по dungeon-биому ([[city.dungeon]] в
# world.toml), дорога - из остальных; пулы не пересекаются, у каждого свой "*".
#
# role: как эта порода дерётся (ADR 0066). Пять повадок, и каждая - настоящий
# ход, а не множитель: brute бьёт всегда и раненым сильнее, warrior раненым
# закрывается, rogue добивает наверняка, caster раз в три круга бьёт всю сторону
# своим родом урона, healer раз в три круга поднимает самого раненого в стае.
# Не объявлено - решает порода: зверь давит, гуманоид и нежить держат строй,
# стихия и тварь бьют чарами (entities/location.DEFAULT_ROLES).
#
# element: каким родом урона этот противник бьёт. Физические четыре - piercing,
# slashing, bludgeoning, rending - и магические одиннадцать; полный список в
# entities/damage.py. Не объявлено - решает порода: зверь рвёт, гуманоид рубит,
# нежить бьёт скверной, стихия - чарами, тварь - разумом. По роду урона считается
# сопротивление цели, и без него «Рождённый в стуже» был надписью (ADR 0018).

[meta]
kinds = ["beast", "humanoid", "undead", "elemental", "aberration"]
# Прозвища - прилагательные, и никогда существительные: их приклеивают перед именем
# породы («Матёрый серый волк»). «Владыка кабан» - это не по-русски, а какая это
# ступень, боевой экран говорит своими словами.
elite_titles = ["Матёрый", "Свирепый", "Лютый", "Исполинский", "Порченый"]

