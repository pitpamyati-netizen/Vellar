# Неуловимый заходит в бой незаметным и уходит из виду снова через два своих
# хода после того, как его выдали (ADR 0043). Выбрать его нельзя, пока он сам не
# ударит; удар по всем, дот и световая граната его находят.
[[affix]]
id = "stalking"
adjective = "Неуловимый"
weight = 3
damage = 1.1
initiative = 1.15
gold = 1.4
recloak = 2
