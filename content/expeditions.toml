# Состав встреч фиксирован; числа растут по уровню подземелья и его сложности.
[[expedition]]
id = "pump_house"

[[expedition.encounter]]
id = "gate"
name = "Караул у помпы"
enemies = ["pit_sentinel"]
rank = "normal"
stakes = 1.0
heal_percent = 20
health_per_extra_member = 25
briefing = "Страж держит узкий проход к помпе. Раненым он защищается. Можно добить его ударами, оглушить умением или прикрыть товарища, на которого идут удары. Прикрытие доступно каждому: /прикрыть. Защита себя: /защита."

[[expedition.encounter]]
id = "crew"
name = "Рабочая выработка"
enemies = ["deep_digger", "bone_picker"]
rank = "normal"
stakes = 1.15
heal_percent = 25
health_per_extra_member = 15
briefing = "Рудокоп давит раненых, костоправ поднимает своего. Выберите костоправа командой /цель N, чтобы убрать поддержку, или сначала добейте рудокопа. Запрет лечения мешает костоправу; прикрытие и лечение помогают товарищу выдержать удары."

[[expedition.encounter]]
id = "lamps"
name = "Галерея фонарей"
enemies = ["lantern_wretch"]
rank = "elite"
stakes = 1.0
heal_percent = 30
briefing = "Фонарник раз в три круга бьёт всю сторону. Панель называет круг следующего общего удара. Можно защититься, поставить товарищу барьер, наложить молчание или добить фонарника до его хода. Читать и обсуждать решение можно без ограничения времени."

[[expedition.encounter]]
id = "foreman"
name = "Смотритель нижней помпы"
enemies = ["lantern_wretch", "pit_sentinel"]
rank = "boss"
stakes = 1.0
heal_percent = 0
briefing = "Смотритель бьёт всех раз в три круга, страж принимает отдельные удары. Можно сначала убрать стража или сосредоточить удары на смотрителе. Перед общим ударом помогают защита, прикрытие и молчание. Дно делится между теми, кто действовал во всех четырёх встречах и остался до победы."
