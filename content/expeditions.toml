# Состав встреч фиксирован; числа растут по уровню подземелья и его сложности.
[[expedition]]
id = "pump_house"

[[expedition.encounter]]
id = "gate"
name = "Караул у помпы"
enemies = ["pit_sentinel"]
rank = "normal"
stakes = 1.0
heal_percent = 20
health_per_extra_member = 25
briefing = "Страж перекрыл узкий проход к помпе; при тяжёлых ранах он переходит к защите. Оглушение прервёт его действие, провокация выученным умением поможет отвести удары от товарища. Чтобы защитить себя, используйте /защита."

[[expedition.encounter]]
id = "crew"
name = "Рабочая выработка"
enemies = ["deep_digger", "bone_picker"]
rank = "normal"
stakes = 1.15
heal_percent = 25
health_per_extra_member = 15
briefing = "Рудокоп добивает раненых, а костоправ лечит своего товарища. Выберите костоправа командой /цель N, чтобы сначала убрать лекаря, либо сосредоточьте удары на рудокопе. Запрет лечения мешает костоправу; лечение и провокация выученными умениями помогают вашему отряду."

[[expedition.encounter]]
id = "lamps"
name = "Галерея фонарей"
enemies = ["lantern_wretch"]
rank = "elite"
stakes = 1.0
heal_percent = 30
briefing = "Фонарник раз в 3 круга поражает весь отряд; панель показывает круг следующего общего удара. До его хода можно защититься, применить выученное молчание или закончить бой. Выберите действие, когда будете готовы."

[[expedition.encounter]]
id = "foreman"
name = "Смотритель нижней помпы"
enemies = ["lantern_wretch", "pit_sentinel"]
rank = "boss"
stakes = 1.0
heal_percent = 0
briefing = "Смотритель раз в 3 круга поражает весь отряд, страж прикрывает его от отдельных ударов. Выберите, кого атаковать первым; перед общим ударом помогут защита, лечение и выученное молчание. Награду за полный спуск делят те, кто действовал во всех 4 встречах и остался до победы."
