# Дерево специализации: кем этот класс стал, оставаясь собой (ADR 0074).
#
# Класс - корень дерева, и дерево ветвится трижды: на тридцатом уровне, на
# семьдесят пятом и на сто пятидесятом, каждый раз надвое. Восемь классов,
# шестнадцать первых веток, тридцать две вторых, шестьдесят четыре третьих.
#
# ============================================================================
# КАК ЭТО ЧИТАЕТСЯ
# ============================================================================
#
#   tier 1 - 30 уровень.  Первая развилка: чем этот класс будет заниматься.
#   tier 2 - 75 уровень.  Из чего растёт, написано в `parent`.
#   tier 3 - 150 уровень. Последнее слово, и оно тоже развилка.
#
# ВЕТКА РАСТЁТ ИЗ ВЕТКИ. `parent` называет ту, из которой эта выросла, и на
# развилке предлагаются только дети уже взятой. Псионик приходит из Оккультиста
# и ниоткуда больше: «кем я стал» читается дорогой, а не списком.
#
# ВЗЯТОЕ СКЛАДЫВАЕТСЯ. Иллюзионист - это Оккультист, ставший Псиоником, ставший
# Иллюзионистом, а не кто-то третий. Правки сеток накладываются по возрастанию
# ступени: поздняя договаривает раннюю.
#
# ВЫБОР НЕОБРАТИМ. Ветку берут один раз; обратимый выбор - не выбор, а настройка.
#
# ============================================================================
# ЧЕМ ОПЛАЧЕН ВХОД
# ============================================================================
#
# Уровнем и `trial` - цепочкой из трёх заданий, которые берут и сдают у
# наставника на экране «Ступень». Загрузчик разворачивает шаги в обычные
# задания движка: те же счётчики, тот же журнал, та же сдача. Города у них нет,
# поэтому городская доска их не покажет никогда.
#
# ПОРОГОВ ХАРАКТЕРИСТИК НЕТ ВОВСЕ. На «сколько ты вложил» отвечают вехи
# (ADR 0068); ветка отвечает на «кем ты захотел стать», и ответ на это не должен
# зависеть от раздачи очков.
#
# ============================================================================
# ЧТО ВЕТКА ДАЁТ
# ============================================================================
#
# `skill` - боевое умение ветки (skills.toml, owner = "subclass:<id>"). Взяв
#   ветку, игрок получает его в список изучаемых: ранг стоит очка, как у всякого
#   другого (ADR 0067), и место в панели оно занимает наравне со всеми. Панель не
#   выросла - шесть боевых и один расовый, как было.
#
# `modifiers` - пассивный свёрток прибавок, как техника дома (ADR 0049).
#   Ключи проверяются по EFFECTIVE_KEYS: прибавка, которой никто не считает, -
#   обещание, а не механика (ADR 0018). `text` пишется ПО НИМ и ровно про них.
#
# `[subclass.scaling]` - правка классовой сетки (ADR 0068). Названная
#   характеристика получает НОВЫЙ ВЫХОД ВМЕСТО классового, неназванная остаётся
#   как была. Заменяется целиком, а не сдвигается: подкласс говорит, ЧЕМ ОЧКО
#   СТАЛО.
#
# Идентификаторы заморожены: на них показывают персонажи в базе.

# ==========================================================================
# ВОИН
# ==========================================================================

