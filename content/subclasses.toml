[[subclass]]
id = "rogue_assassin_path"
class_id = "rogue"
tier = 1
level = 30
name = "Убийца"
role = "Один удар, и разговор кончен"
text = "Крит бьёт на 20 процентов сильнее, первый удар сильнее на 12 процентов, здоровья на 6 процентов меньше."
lore = "Убийце платят не за бой, а за то, что боя не было: работа, которую видно, считается сделанной плохо."
skill = "rogue_assassin_path_tihaya_rabota"
power = "executioner"
modifiers = { crit_damage_percent = 20, first_turn_damage_percent = 12, health_percent = -6 }
trial = [
    { name = "Убийца: счёт по людям", objective = "kill", target_kind = "humanoid", count = 12, text = "Наставник не спорит о призвании. Он просит 12 побеждённых из людского рода — и после этого говорит дальше." },
    { name = "Убийца: сильный противник", objective = "elite", count = 3, text = "Сильный противник стоит десятка обычных, и наставник просит 3 победы над сильными противниками." },
    { name = "Убийца: обход тайников", objective = "search", target_kind = "cache", count = 5, text = "Дорога учит не хуже боя: 5 вскрытых тайников, и всё без единой драки." },
]

[subclass.scaling]
AGI = { blow = 2.4, health = 0.35, resource = 1 }

