# Ступени специализации: кем воин становится, оставаясь воином (ADR 0069).
#
# Класс отвечает на вопрос «как ты дерёшься». Подкласс отвечает на вопрос «каким
# именно ты стал», и отвечает трижды за дорогу.
#
# ============================================================================
# ТРИ СТУПЕНИ
# ============================================================================
#
#   tier 0 — 30 уровень, уходов не нужно. Первая развилка: чем этот класс будет
#            заниматься. Берсерк или защитник, элементалист или некромант.
#   tier 1 — 75 уровень и один уход. Гибрид: просит ДВЕ характеристики сразу,
#            и потому его нельзя взять, просто налив в ведущую.
#   tier 3 — 150 уровень и три ухода. Последнее слово. Ступень названа третьей,
#            а не второй, потому что её меряют уходами, а уходов к ней три.
#
# Ступени БЕРУТ ПО ПОРЯДКУ и они СКЛАДЫВАЮТСЯ. Дредноут на сто пятидесятом — это
# берсерк, ставший гибридом, ставший дредноутом, а не кто-то третий. Поэтому
# правки сеток накладываются по возрастанию ступени: поздняя договаривает раннюю.
#
# ВЫБОР НЕОБРАТИМ. Ступень берут один раз; обратимый выбор — не выбор, а настройка.
#
# ============================================================================
# ЧТО ПОДКЛАСС ДЕЛАЕТ
# ============================================================================
#
# Ровно две вещи, и обе движок уже считает.
#
# ``modifiers`` — пассивный свёрток прибавок, как техника дома (ADR 0049) и
#   расовая способность. Ключи из общего словаря traits.toml [meta].modifier_keys
#   и проверяются по EFFECTIVE_KEYS: прибавка, которой никто не считает, —
#   обещание, а не механика (ADR 0018).
#
# ``[subclass.scaling]`` — правка классовой сетки (ADR 0068). Названная
#   характеристика получает НОВЫЙ ВЫХОД ВМЕСТО классового, неназванная остаётся
#   как была. Берсерком берсерка делает именно это — сила у него ведёт удар
#   сильнее, а броню держит хуже, — а не строка в описании.
#
#   Заменяется целиком, а не сдвигается. Подкласс говорит, ЧЕМ ОЧКО СТАЛО:
#   сдвиг пришлось бы читать вместе с тем, от чего он считается, и экран
#   характеристик не смог бы назвать одно честное число.
#
# ЧЕГО ПОДКЛАСС НЕ ДЕЛАЕТ: не даёт ни одной новой кнопки, ни слота, ни экрана.
# Панель остаётся шесть боевых плюс один расовый. Игру слушают целиком, и всякая
# ступень, добавляющая слот, добавляет и то, что игрок обязан удержать в голове.
#
# ``gate`` — чем оплачен вход: уровень, уходы и пороги характеристик. Все три
# условия складываются. Отказ называется целиком и до нажатия.

[meta]
tiers = [
    { tier = 0, name = "Путь", text = "Первая развилка: чем этот класс будет заниматься." },
    { tier = 1, name = "Гибрид", text = "Две характеристики сразу и один уход за плечами." },
    { tier = 3, name = "Венец", text = "Последнее слово: сто пятьдесят уровней и три ухода." },
]

