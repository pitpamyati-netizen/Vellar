stat_points = 50
text = "Характеристики выше на 80 процентов навсегда. Три вехи унесёте с собой, и сверх первого уровня вам дадут 50 очков."
lore = "Третьего имени в книге не пишут — для него заводят отдельный лист и подшивают в конце. Управа делает так с грамотами, которые переживут и писаря, и того, кто их подписал."
unlocks = [
    "warrior_dreadnought",
    "barbarian_stormborn",
    "paladin_hierarch",
    "ranger_windless",
    "rogue_phantom",
    "mage_archivist",
    "cleric_lastword",
    "druid_oldcompact",
]
