# Голосования Дорожной палаты: вопросы, которые решает игра, а не автор.
#
# Перерождение совершают на 300 уровне (`docs/endgame.md`). Закладывают вещь или грань
# умения, получают Печать, и Печать эта — голос: она весит ровно столько
# перерождений, сколько человек их совершил. Палата считает голоса и записывает
# ответ в книгу.
#
# Открыт всегда один вопрос — тот, что назван в [meta].open. Пустое значение
# означает, что Палата сейчас ничего не спрашивает: перерождения совершают, голоса
# копятся, вопроса нет.

[meta]
open = "toll"

[[turning]]
id = "toll"
name = "Пошлина"
question = "Сколько Палата берёт с каждой сделки между приключенцами?"
text = "Весы на заставах стоят те же, что при империи, а сделок стало вчетверо. Города считают, во что им обходится дорога, и спорят о сотых долях."

[[turning.options]]
id = "toll_low"
name = "Брать меньше"
text = "Дешёвая пошлина — больше сделок и меньше обходных троп. Дорогу чинят реже."

[[turning.options]]
id = "toll_keep"
name = "Оставить как есть"
text = "Пять сотых кормят заставы и никого не разоряют. Договор писали не вчера."

[[turning.options]]
id = "toll_high"
name = "Брать больше"
text = "Дорогая пошлина — крепкие мосты и сытая стража. Обозы пойдут в объезд."

[[turning]]
id = "gates"
name = "Ворота"
question = "Какие тракты Палата держит открытыми зимой?"
text = "Содержать все пятнадцать дорог зимой Палате не по деньгам. Половину можно закрыть до весны и охранять одну как следует."

[[turning.options]]
id = "gates_all"
name = "Держать все"
text = "Открытая дорога до последнего города. Стражи на каждый тракт не хватит."

[[turning.options]]
id = "gates_one"
name = "Оставить одну"
text = "Один тракт под настоящей охраной, остальные до весны на свой страх."

[[turning]]
id = "water"
name = "Вода"
question = "По какой цене города продают воду друг другу?"
text = "Колодцы на перевале общие по Договору, а чинят их порознь. Кто платит за починку, тот и назначает цену."

[[turning.options]]
id = "water_common"
name = "Общая, по Договору"
text = "Вода идёт по одной цене всем пятнадцати. Чинят вскладчину и спорят каждый год."

[[turning.options]]
id = "water_owner"
name = "По цене хозяина колодца"
text = "Кто чинил, тот и назначает. Перевал станет дороже, зато колодцы будут целы."
