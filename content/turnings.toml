# Новое имя: три ступени, на которых уровень кончается и начинается заново.
#
# Управа стоит в каждом городе — престольная контора, книга и печать. Дойдя до
# порога, приключенец просит у Престола новое имя (`docs/endgame.md`, ADR 0070).
#
# ============================================================================
# ЧТО ПРОИСХОДИТ ПРИ УХОДЕ
# ============================================================================
#
# Уровень падает до первого, опыт обнуляется, и — главное — РОЗДАННЫЕ ОЧКИ
# ХАРАКТЕРИСТИК ВОЗВРАЩАЮТСЯ НЕРОЗДАННЫМИ. Дорога начинается заново, и раздаёт
# их игрок заново: тот же человек может собраться иначе.
#
# Остаётся при нём: золото и банк, всё снаряжение, дерево умений с рангами,
# черты, ремёсла, задания, счёт арены, дом и взятые ступени специализации.
#
# Прибавляется навсегда:
#   stat_bonus    на сколько процентов выше становятся ВСЕ характеристики. Это и
#                 есть плата за дорогу: второй проход идёт по тем же уровням,
#                 но человеком, который стал больше.
#   stat_points   сколько нераспределённых очков даётся сверх положенных первому
#                 уровню — чтобы начало второй дороги не было голым.
#   legacy_slots  сколько ВЕХ разрешено унести с собой через сброс.
#
# ПРИБАВКИ НЕ СКЛАДЫВАЮТСЯ. У второй ступени написано, каким ты стал ПОСЛЕ неё, а
# не насколько вырос по сравнению с первой. Складывать проценты значило бы, что
# число на экране нельзя проверить, не помня всей дороги.
#
# ============================================================================
# НАСЛЕДИЕ
# ============================================================================
#
# Розданные очки возвращаются — значит характеристики падают, а вместе с ними
# теряются ВЕХИ (ADR 0068): пороги, взятые за сто пятьдесят уровней, разом
# перестают выполняться.
#
# Наследие — это ответ на такую потерю. Перед уходом игрок называет столько вех,
# сколько у него слотов, и названные продолжают работать, чего бы ни показывали
# характеристики. Один слот за первый уход, два за второй, три за третий: к
# третьему проходу с вами идёт уже небольшая, но своя история.
#
# Слот именно НАЗЫВАЮТ, а не получают лучшим по списку. Какая веха была для этой
# сборки главной, знает игрок, а не порядок в файле.
#
# ============================================================================
# ЧТО УХОД ОТКРЫВАЕТ
# ============================================================================
#
# `unlocks` — ступени специализации, которые становятся доступны (ADR 0069).
#
# Список ПОВТОРЯЕТ то, что и так написано у самих подклассов (`gate.remorts` в
# subclasses.toml), и держится здесь ровно затем, чтобы игрок прочитал его ДО
# ухода: цена названа, значит должна быть названа и покупка. Чтобы два места не
# разошлись, загрузчик сверяет их и не принимает содержимое, в котором список
# врёт.
#
# id ступеней заморожены: их держат правки смотрителя (ADR 0046).

[meta]
# Титулы за уходы, по порядку. Больше уходов, чем титулов, — остаётся последний.
titles = ["Вписанный", "Признанный", "Наречённый"]

[[rebirth]]
id = "rebirth_1"
rank = 1
name = "Первое имя"
level = 75
stat_bonus = 20
legacy_slots = 1
stat_points = 15
text = "Характеристики выше на 20 процентов навсегда. Одну веху унесёте с собой, и сверх первого уровня вам дадут 15 очков."
lore = "Первое имя дают буднично: писарь спрашивает, как звать, и не поднимает глаз. Настоящее в этой минуте только одно — что переспросить будет уже некого."
unlocks = [
    "warrior_ironsworn",
    "barbarian_bloodbound",
    "paladin_lightbinder",
    "ranger_pathwarden",
    "rogue_shadowblade",
    "mage_aetherblade",
    "cleric_oathkeeper",
    "druid_stonebound",
]

[[rebirth]]
id = "rebirth_2"
rank = 2
name = "Второе имя"
level = 100
stat_bonus = 45
legacy_slots = 2
stat_points = 30
text = "Характеристики выше на 45 процентов навсегда. Две вехи унесёте с собой, и сверх первого уровня вам дадут 30 очков."
lore = "На втором имени писарь всё-таки поднимает глаза. Не из любопытства: во второй раз в книге переправляют не строчку, а разворот, и он хочет видеть, кто заставит его это делать."
