# Голосования Большого совета: вопросы, которые решает игра, а не автор.
#
# Новое имя берут на 150 уровне (`docs/endgame.md`): уровень падает до первого,
# нажитое остаётся, за уход дают очки и титул. Титул — это голос: в Большом совете
# он весит столько уходов, сколько за ним стоит, до потолка. Совет считает голоса
# и записывает ответ.
#
# Открыт всегда один вопрос — тот, что назван в [meta].open. Пустое значение
# означает, что совет сейчас ничего не спрашивает: новое имя берут, голоса
# копятся, вопроса нет.
#
# id вопросов и id ответов заморожены: их держат правки смотрителя (ADR 0046) и
# [meta].open.

[meta]
open = "toll"

[[turning]]
id = "toll"
name = "Доля в казну"
question = "Сколько Престол берёт с каждой сделки между приключенцами?"
text = "Казна Престола тощает, а сделок между вольными людьми стало вчетверо. Дома считают, что теряют на этом сборе, и спорят о сотых долях."

[[turning.options]]
id = "toll_low"
name = "Брать меньше"
text = "Низкий сбор — больше сделок в открытую и меньше торга в обход. Казна беднее."

[[turning.options]]
id = "toll_keep"
name = "Оставить как есть"
text = "Пять сотых кормят канцелярию и никого не разоряют. Считали не вчера."

[[turning.options]]
id = "toll_high"
name = "Брать больше"
text = "Высокий сбор — полная казна и довольный Престол. Торг уйдёт в тень."

[[turning]]
id = "gates"
name = "Дороги зимой"
question = "Какие тракты держат открытыми зимой?"
text = "Чистить все пятнадцать дорог до весны дома не берутся. Половину можно бросить и охранять одну как следует."

[[turning.options]]
id = "gates_all"
name = "Держать все"
text = "Открытая дорога до последнего города. Стражи на каждый тракт не хватит."

[[turning.options]]
id = "gates_one"
name = "Оставить одну"
text = "Один тракт под настоящей охраной, остальные до весны на свой страх."

[[turning]]
id = "water"
name = "Вода на хребте"
question = "По какой цене продают воду на сухом хребте?"
text = "Колодцы на перевале общие, а чинит их Дом Переправ. Кто платит за починку, тот и хочет назначать цену."

[[turning.options]]
id = "water_common"
name = "Общей ценой"
text = "Вода идёт по одной цене всем. Чинят вскладчину и спорят каждый год."

[[turning.options]]
id = "water_owner"
name = "Ценой Дома Переправ"
text = "Кто чинил, тот и назначает. Перевал станет дороже, зато колодцы будут целы."
