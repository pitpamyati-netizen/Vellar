# ============================================================================
# ЧЕРТЫ ВЕХ ХАРАКТЕРИСТИК (ADR 0068)
# ============================================================================
#
# Их не выбирают. Их берут, собрав характеристику до порога, объявленного у
# класса (classes.toml, [[class.milestone]]). Раздел помечен granted: на экране
# создания персонажа этих черт нет вовсе.
#
# Почему вехи платят именно чертой: черта в Vellar не даёт ни кнопки, ни боевого
# умения, ни экрана — только прибавки (Claude.md, правило 2). Значит целую
# систему порогов удалось завести, ничего не прибавив к тому, что игрок слушает.
#
# Одна веха — это немного: три-восемь процентов. Их пять на класс, и вместе они
# складываются в тот самый разрыв между сосредоточенной сборкой и размазанной,
# ради которого пороги и заведены.

