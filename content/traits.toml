# Черты. При создании персонажа игрок выбирает ровно две.
#
# ЖЁСТКОЕ ПРАВИЛО: черта никогда не даёт ни кнопки, ни боевого умения, ни нового
# экрана. Черты - это только прибавки. Именно это и держит интерфейс достаточно
# маленьким, чтобы играть на слух, - см. docs/skills.md, «Правила против
# разрастания».
#
# Каждый ключ прибавки обязан быть в [meta].modifier_keys; незнакомые ключи
# загрузчик отвергает на старте. Категории берёт фильтр на экране выбора. Черты
# категории "dark" платят за сильную выгоду настоящим штрафом.

[meta]
picks_at_creation = 2
categories = [
    { id = "combat", name = "Боевые" },
    { id = "magic", name = "Магические" },
    { id = "defense", name = "Защитные" },
    { id = "social", name = "Социальные" },
    { id = "crafting", name = "Ремесленные" },
    { id = "survival", name = "Выживание" },
    { id = "fate", name = "Удача и случай" },
    { id = "dark", name = "Тёмные" },
    # Разделы, которые игра ВЫДАЁТ, а не предлагает выбрать (granted, ADR 0068).
    # Черта отсюда - та же черта и тот же свёрток прибавок, но на экране создания
    # её нет: выбрать нельзя то, что зарабатывают. Раздел при этом настоящий -
    # у него есть имя, и экран характеристик умеет его назвать.
    { id = "milestone", name = "Вехи", granted = true },
]
modifier_keys = [
    "stat_STR", "stat_AGI", "stat_END", "stat_INT", "stat_WIS", "stat_CHA", "stat_LCK",
    "damage_percent", "physical_damage_percent", "magic_damage_percent",
    "damage_taken_percent", "armor_percent", "health_percent",
    "accuracy_percent", "dodge_percent", "initiative_percent",
    "crit_chance_percent", "crit_damage_percent",
    "resource_percent", "resource_regen_percent", "cost_reduction_percent",
    "cooldown_reduction_percent", "regen_per_turn_percent",
    "healing_done_percent", "healing_taken_percent",
    # Сопротивления: по одному на каждый род урона (items.toml [meta].weapon_types
    # называет род у оружия, enemies.toml — у противника) плюс два на половины.
    "resist_physical_percent", "resist_magic_percent",
    "resist_piercing_percent", "resist_slashing_percent",
    "resist_bludgeoning_percent", "resist_rending_percent",
    "resist_arcane_percent", "resist_fire_percent", "resist_cold_percent",
    "resist_poison_percent", "resist_acid_percent", "resist_air_percent",
    "resist_holy_percent", "resist_light_percent",
    "resist_mental_percent", "resist_nature_percent", "resist_negative_percent",
    "exp_percent", "gold_percent", "shop_price_percent", "sell_price_percent",
    "drop_rate_percent", "rarity_percent", "quest_reward_percent", "event_reward_percent",
    "craft_quality_percent", "gather_yield_percent", "salvage_yield_percent",
    "reflect_percent", "dot_damage_percent", "flee_chance_percent", "lifesteal_percent",
    "first_turn_damage_percent", "single_target_damage_percent", "aoe_damage_percent",
    "low_health_damage_percent", "wounded_target_damage_percent",
    "elite_damage_percent", "beast_damage_percent",
    "undead_damage_percent", "humanoid_damage_percent", "reputation_percent",
]
# Ключи прибавок, у которых хорошим исходом является меньшее значение. Это нужно
# отрисовке, чтобы сказать «цены ниже на 12 процентов» вместо слепо напечатанного
# минуса, и тестам баланса, чтобы отличить выгоду от штрафа.
lower_is_better = [
    "damage_taken_percent",
    "shop_price_percent",
]

