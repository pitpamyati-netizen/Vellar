# Умения: 20 боевых и 40 пассивных на класс, плюс одно боевое на расу.
#
# Пассивные умения расы живут в races.toml - они всегда при персонаже и слота не
# занимают. Боевое расовое умение отсюда занимает отдельный расовый слот.
#
# Панель не растёт никогда: 6 боевых слотов и 1 расовый. Пассивное умение не
# занимает слота вовсе - изученное работает (ADR 0016). Двадцать боевых на шесть
# слотов - это и есть сборка: выбор, а не список.
#
# Развитие ровное: боевое умение открывается каждые пятнадцать уровней
# (1, 16, 31 ... 286), пассивные - между ними, по два на те же пятнадцать
# (6 и 11, 21 и 26, и так до 296). Шестьдесят умений на триста уровней, по одному
# на пять, и очко за уровень ровно на них и уходит.
#
# Глубина - в рангах с первого по пятый и в грани, выбираемой на третьем ранге,
# и никогда в лишних кнопках. Обе грани каждого умения объявлены здесь; их коды
# выводятся как "<code>_a" и "<code>_b" в порядке появления. См. docs/skills.md.
#
# Грань объявляет, что она *делает*, а не только как называется. Словарь -
# в domain/rules/edges.py, и каждый ключ в нём это проценты или ходы:
#   power / cost      прибавка к силе умения и поправка к стоимости, в процентах
#   cooldown duration ходы: откат и срок действия, со знаком
#   dot_turns         сколько ходов цель горит, истекает кровью или травится
#   stun_turns        сколько ходов цель пропускает
#   hits hit_power    сколько ударов добавилось и какой силы каждый
#   splash            доля урона, достающаяся второй цели
#   aoe               задевает всех
#   pierce crit lifesteal   пробой брони, шанс крита, вампиризм - в процентах
#   cleanse           сколько отрицательных эффектов снимается сверх прежнего
#   heal barrier      лечение и барьер сверх основного, в процентах от максимума
#   self_modifiers    прибавки себе, ключами из traits.toml
#   target_modifiers  то же, но цели
# Грань без единого такого ключа загрузчик не примет: она и была той самой
# поломкой - обещание словами, за которым ничего не стоит. Текст грани обязан
# описывать ровно объявленное, потому что игрок читает текст, а получает числа.
#
# scaling: от какой характеристики считается обычный удар этого умения.
# power: проценты на первом ранге; каждый ранг добавляет rank_step (по умолчанию
#   0.15) от них. Для урона это проценты от обычного удара персонажа, где 100 -
#   одна «Атака». Для лечения и барьера - проценты от максимума здоровья. Для
#   усилений, помех и состояний - размер самой прибавки. Абсолютных чисел здесь
#   нет; см. docs/skills.md и ADR 0007.
# tag: натиск (press), оборона (guard) или точность (precision) - след, который
#   оставляет умение. Не назван - читается по эффекту.
# weapons: рода оружия, без которых умение не сработает - ids из items.toml
#   [meta].weapon_types. Пусто - работает с любым и без оружия вовсе; выстрел без
#   лука и удар в спину без кинжала - нет. Список может быть только уже того, что
#   носит класс (classes.toml, weapons), иначе это кнопка, которая не сработает
#   никогда, и загрузчик её не принимает.

[meta]
max_rank = 5
edge_rank = 3
default_rank_step = 0.15
skill_point_per_level = 1

# Каждое боевое умение называет один из этих эффектов. Движок исполняет каждый,
# и tests/domain/test_combat.py падает, если содержимое называет эффект, которого
# движок не знает. Пассивное умение вместо эффекта называет ключ прибавки из
# traits.toml [meta].modifier_keys - словарь один на особенности, снаряжение и
# пассивные умения.
targets = ["self", "enemy", "all_enemies"]
active_effects = [
    "avoid_combat",
