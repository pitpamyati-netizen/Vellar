# Умения: 24 боевых и 20 пассивных на класс, плюс одно боевое на расу.
#
# Пассивные умения расы живут в races.toml - они всегда при персонаже и слота не
# занимают. Боевое расовое умение отсюда занимает отдельный расовый слот.
#
# Панель не растёт никогда: 6 боевых слотов и 1 расовый. Пассивное умение не
# занимает слота вовсе - изученное работает (ADR 0016).
#
# РАЗВИЛКИ. На четырёх уровнях из двадцати боевое умение приходит парой: два
# умения, одно место, `fork` у обоих один. Взяв одно, второе закрываешь, пока не
# разберёшь взятое у наставника. Поэтому боевых здесь 24, а изучить можно 20.
#
# ЧТО СТОИТ ОЧКО. Очко умений приходит через уровень ([meta].levels_per_skill_point),
# и ранг стоит одно очко ([meta].rank_cost): сорок изучаемых мест по пять рангов -
# это 200 очков против 75, выдаваемых за сто пятьдесят уровней. Выучить всё
# нельзя, и это главное, что отличает двух воинов одного уровня друг от друга
# (ADR 0067).
#
# ЧТО ДАЁТ РАНГ. Не одну прибавку к силе, а четыре вещи сразу
# (domain/rules/skills.rank_gain):
#   сила       + rank_step за ранг, вдвое на пятом против первого;
#   откат      через ранг короче на ход;
#   сроки      через ранг длиннее на ход - кроме того, что отнимает ход;
#   цена       на десятую долю ниже за ранг, до половины на пятом.
# Прежде ранг прибавлял пятнадцатую долю силы и больше ничего, и очко в него
# было потрачено впустую.
#
# ЧТО СТОИТ УМЕНИЕ В БОЮ. `cost` - это ПРОЦЕНТЫ от максимума запаса, а не число
# (ADR 0058). Числом цена держалась ровно один уровень: Отвага, Чары и Прыть
# растут с уровнем и характеристикой, а «стоит 8» не росло ни с чем. Проценты
# значат одно и то же на всей полосе; игроку на боевом экране называется число.
#
# Развитие ровное: боевое умение каждые семь-восемь уровней, пассивное между
# ними.
#
# ПОЗДНЕЕ УМЕНИЕ НЕ БЬЁТ СИЛЬНЕЕ - ОНО ДЕЛАЕТ БОЛЬШЕ. Проценты урона у одной и
# той же формы удара одинаковы на всех ступенях, и это не лень, а замер:
# обычный бой на сто пятидесятом уровне и так укладывается в два хода
# (tests/domain/test_combat_balance.py), и лишние четыре процента урона съедают
# целый ход - бой становится бесплатным. Ступень платит не числом, а тем, что
# умение делает: барьером, оглушением всех сразу, меткой, «не пасть».
#
# Глубина - в рангах с первого по пятый, и никогда в лишних кнопках. Граней у
# умений нет: 256 подписей полгода обещали словами то, чего движок не делал
# (ADR 0067). Ветвей тоже нет - они вернутся талантами. См. docs/skills.md.
#
# scaling: от какой характеристики считается обычный удар этого умения.
# power: проценты на первом ранге; каждый ранг добавляет rank_step (по умолчанию
#   0.25) от них. Для урона это проценты от обычного удара персонажа, где 100 -
#   одна «Атака». Для лечения и барьера - проценты от максимума здоровья. Для
#   усилений, помех и состояний - размер самой прибавки. Абсолютных чисел здесь
#   нет; см. docs/skills.md и ADR 0007.
# requires_stealth: умение бьёт только из незаметности (StatusKind.UNSEEN).
#   Отказ до хода, как не то оружие: ход не тратится.
# fork: развилка, в которой стоит умение. У пары один и тот же код развилки и
#   один уровень.
# weapons: рода оружия, без которых умение не сработает - ids из items.toml
#   [meta].weapon_types. Пусто - работает с любым и без оружия вовсе; выстрел без
#   лука и удар в спину без кинжала - нет. Список может быть только уже того, что
#   носит класс (classes.toml, weapons), иначе это кнопка, которая не сработает
#   никогда, и загрузчик её не принимает.

[meta]
max_rank = 5
# Ранг прибавляет к силе четверть написанного: пятый ранг вдвое сильнее первого.
default_rank_step = 0.25
# Через сколько уровней приходит очко умений (ADR 0067).
levels_per_skill_point = 2
# Чего стоит ранг умения. Одно очко - любой, с первого по пятый.
rank_cost = 1

# Каждое боевое умение называет один из этих эффектов. Движок исполняет каждый,
# и tests/domain/test_combat.py падает, если содержимое называет эффект, которого
# движок не знает. Пассивное умение вместо эффекта называет ключ прибавки из
# traits.toml [meta].modifier_keys - словарь один на особенности, снаряжение и
# пассивные умения.
targets = ["self", "enemy", "all_enemies"]
active_effects = [
    "avoid_combat",
    "barrier",
