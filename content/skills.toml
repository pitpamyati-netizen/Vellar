# Skills: 8 active + 6 passive per class, plus one active per race.
#
# Race passives are inherent and live in races.toml - they are always on and never
# occupy a slot. The racial active listed here occupies the separate racial slot.
#
# The panel is fixed forever: 6 active slots and 1 racial. A passive takes no slot
# at all - what is learned works (ADR 0016).
# Depth comes from ranks 1-5 and from the edge chosen at rank 3, never from extra
# buttons. Both edges of every skill are declared here; their codes are derived as
# "<code>_a" and "<code>_b" in the order they appear. See docs/skills.md.
#
# An edge declares what it *does*, not only what it is called. The vocabulary is
# in domain/rules/edges.py and every key is a percentage or a number of turns:
#   power / cost      прибавка к силе умения и поправка к стоимости, в процентах
#   cooldown duration ходы: откат и срок действия, со знаком
#   dot_turns         сколько ходов цель истекает кровью или горит
#   stun_turns        сколько ходов цель пропускает
#   hits hit_power    сколько ударов добавилось и какой силы каждый
#   splash            доля урона, достающаяся второй цели
#   aoe               задевает всех
#   pierce crit lifesteal   пробой брони, шанс крита, вампиризм - в процентах
#   cleanse           сколько отрицательных эффектов снимается сверх прежнего
#   heal shield       лечение и щит сверх основного, в процентах от максимума
#   self_modifiers    прибавки себе, ключами из traits.toml
#   target_modifiers  то же, но цели
# Грань без единого такого ключа загрузчик не примет: она и была той самой
# поломкой - обещание словами, за которым ничего не стоит. Текст грани обязан
# описывать ровно объявленное, потому что игрок читает текст, а получает числа.
#
# scaling: which primary stat the standard blow is measured on.
# power: a percentage, at rank 1; each rank adds rank_step (default 0.15) of it.
#   For damage it is a percentage of the character's standard blow, where 100 is
#   one plain "Атака" - so 135 means "a third again as hard as an attack", at
#   every level. For healing and shields it is a percentage of maximum health.
#   For buffs and debuffs it is the size of the modifier, as before.
#   Nothing here is an absolute number; see docs/skills.md and ADR 0007.
# tag: натиск (press), оборона (guard) or точность (precision) - the trace this
#   skill leaves. Omitted, it is read off the effect; state it where the effect
#   would say the wrong thing.
# weapons: рода оружия, без которых умение не сработает - ids из items.toml
#   [meta].weapon_types. Пусто - работает с любым и без оружия вовсе; выстрел без
#   лука и удар в спину без кинжала - нет. Список может быть только уже того, что
#   носит класс (classes.toml, weapons), иначе это кнопка, которая не сработает
#   никогда, и загрузчик её не принимает.

[meta]
max_rank = 5
edge_rank = 3
default_rank_step = 0.15
skill_point_per_level = 1

# Every active skill declares one of these effects. The combat engine implements
# each of them, and tests/domain/test_combat.py fails if content introduces an
# effect the engine does not handle. Passive skills instead declare a modifier key
# from traits.toml [meta].modifier_keys - one vocabulary for traits, equipment and
# passives.
targets = ["self", "enemy", "all_enemies"]
active_effects = [
    "avoid_combat",
    "buff_all_stats",
    "buff_armor",
    "buff_avatar",
    "buff_cooldown_reset",
    "buff_counter",
    "buff_damage",
    "buff_damage_taken",
    "buff_dodge",
    "buff_evade_full",
    "buff_form_bear",
    "buff_form_wolf",
    "buff_free_cast",
    "buff_frenzy",
    "buff_lifesteal",
    "cleanse",
    "cleanse_dodge",
    "cleanse_shield",
    "damage",
    "damage_and_heal",
    "damage_aoe",
    "damage_aoe_arcane",
    "damage_aoe_elemental",
    "damage_aoe_fire",
    "damage_aoe_holy",
    "damage_aoe_nature",
    "damage_aoe_slow",
    "damage_aoe_stun",
    "damage_chain",
    "damage_companion",
    "damage_crit",
    "damage_dot",
    "damage_execute",
    "damage_feint",
    "damage_fire",
    "damage_guaranteed_crit",
    "damage_holy",
    "damage_initiative",
    "damage_multi",
    "damage_nature",
    "damage_pierce",
    "damage_reckless",
    "damage_savage",
    "damage_slow",
    "damage_steal",
    "damage_stun",
    "debuff_accuracy",
    "debuff_damage",
    "debuff_death_mark",
    "debuff_root",
    "debuff_vulnerable",
    "heal",
    "heal_big",
    "heal_over_time",
    "shield",
    "shield_undying",
    "taunt",
]

