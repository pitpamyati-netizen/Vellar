# Skills: 8 active + 6 passive per class, plus one active per race.
#
# Race passives are inherent and live in races.toml - they are always on and never
# occupy a slot. The racial active listed here occupies the separate racial slot.
#
# The panel is fixed forever: 6 active slots, 3 passive slots, 1 racial slot.
# Depth comes from ranks 1-5 and from the edge chosen at rank 3, never from extra
# buttons. Both edges of every skill are declared here; their codes are derived as
# "<code>_a" and "<code>_b" in the order they appear. See docs/skills.md.
#
# scaling: which primary stat multiplies the power.
# power: base value at rank 1; each rank adds rank_step (default 0.15) of it.

[meta]
max_rank = 5
edge_rank = 3
default_rank_step = 0.15
skill_point_per_level = 1

# Every active skill declares one of these effects. The combat engine implements
# each of them, and tests/domain/test_combat.py fails if content introduces an
# effect the engine does not handle. Passive skills instead declare a modifier key
# from traits.toml [meta].modifier_keys - one vocabulary for traits, equipment and
# passives.
targets = ["self", "enemy", "all_enemies"]
active_effects = [
    "avoid_combat",
    "buff_all_stats",
    "buff_armor",
    "buff_avatar",
    "buff_cooldown_reset",
    "buff_counter",
    "buff_damage",
    "buff_damage_taken",
    "buff_dodge",
    "buff_evade_full",
    "buff_form_bear",
    "buff_form_wolf",
    "buff_free_cast",
    "buff_lifesteal",
    "cleanse",
    "cleanse_dodge",
    "cleanse_shield",
    "damage",
    "damage_and_heal",
    "damage_aoe",
    "damage_aoe_arcane",
    "damage_aoe_elemental",
    "damage_aoe_fire",
    "damage_aoe_holy",
    "damage_aoe_nature",
    "damage_aoe_slow",
    "damage_aoe_stun",
    "damage_chain",
    "damage_companion",
    "damage_crit",
    "damage_dot",
    "damage_execute",
    "damage_fire",
    "damage_guaranteed_crit",
    "damage_holy",
    "damage_initiative",
    "damage_multi",
    "damage_nature",
    "damage_pierce",
    "damage_reckless",
    "damage_savage",
    "damage_slow",
    "damage_steal",
    "damage_stun",
    "debuff_accuracy",
    "debuff_damage",
    "debuff_death_mark",
    "debuff_root",
    "debuff_vulnerable",
    "heal",
    "heal_big",
    "heal_over_time",
    "heal_percent",
    "shield",
    "taunt",
]

