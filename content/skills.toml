# УМЕНИЯ ВЕТОК СПЕЦИАЛИЗАЦИИ (ADR 0074)
#
# По одному боевому умению на каждую из ста двенадцати веток дерева
# (subclasses.toml). owner = "subclass:<id>": такое умение приходит не с
# уровнем, а с выбором, и до выбора его в списке изучаемых нет вовсе.
#
# Дальше всё как у классового: ранг стоит очка, место в панели - одно из
# шести, откат и цена считаются теми же правилами. Три ветки за дорогу -
# три умения, которых у соседа по классу не будет.

