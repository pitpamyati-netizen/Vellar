# Карта мира: 15 городов, по 5 локаций, уровни 1-150.
#
# Инварианты, которые проверяет tests/content/test_world.py:
#   - ровно 15 городов, ровно 5 локаций на город
#   - каждый уровень от 1 до 150 покрыт хотя бы одной локацией
#   - внутри города границы растут монотонно, между локациями нет пробелов
#   - полосы городов перекрываются, поэтому всегда есть и где подкопить, и куда
#     рваться
#   - у каждого города список [[city.dungeon]]: не меньше четырёх обычных
#     вразброс по его полосе и ровно одно "deep = true" на level_max (ADR 0041);
#     id подземелья - замороженный ключ, кормит сид захода
#
# Четвёртая локация каждого города - спорная: это межа между уделами домов, и там
# игроки могут нападать друг на друга ("pvp = true"), а правила этого лежат в
# domain/rules/pvp.py. Всякая другая локация на дороге мирная, поэтому всегда есть
# где работать, не оглядываясь.
#
# Идентификаторы - замороженные ключи: city_id кормит сид сборки и хранится на
# персонажах, поэтому переименовать его значит переписать мир и осиротить
# сохранённых героев. Видимые игроку имена, описания и биомы менять можно; загляните
# в Narrative.md, прежде чем их трогать.
#
# Перед правкой см. docs/content-guide.md.

