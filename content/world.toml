# World map: 15 cities, 5 locations each, levels 1-300.
#
# Invariants enforced by tests/content/test_world.py:
#   - exactly 15 cities, exactly 5 locations per city
#   - every level from 1 to 300 is covered by at least one location
#   - bounds increase monotonically inside a city, no gaps between locations
#   - city bands overlap so there is always somewhere to farm and somewhere to push
#
# The fourth location of every city is a free one: players may attack each other
# there ("pvp = true"), and the rules of that are in domain/rules/pvp.py. Every
# other location on the road is peaceful, so there is always somewhere to work
# without watching your back.
#
# Ids are frozen keys: city_id feeds the procgen seed and is stored on characters,
# so renaming one rewrites the world and orphans saved heroes. Player-facing names,
# descriptions and biomes are free to change; see Narrative.md before touching them.
#
# See docs/content-guide.md before editing.

[meta]
max_character_level = 300
cities_expected = 15
locations_per_city = 5

