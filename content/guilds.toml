# Ступени гильдии: во что она вырастает от того, что делают её люди (ADR 0076).
#
# Гильдия растёт деяниями: выигранный бой её человека — деяние, внесённое в казну
# золото — столько деяний, сколько это боёв его уровня (`domain/rules/guild.py`).
# Набранные деяния поднимают гильдию на следующую ступень, и ступень — это всё,
# что гильдия даёт: сколько в неё помещается людей, сколько вещей держит её
# хранилище и что она добавляет своим.
#
# `deeds` — с какого числа деяний стоит ступень; первая всегда с нуля.
# `seats` — сколько человек помещается (не больше `guild.MAX_MEMBERS`).
# `store_slots` — сколько разных вещей держит хранилище гильдии (ADR 0077):
# место считается видами, а не штуками, как и в сумке игрока.
# `exp_percent` и `gold_percent` — надбавка своим за выигранный бой с миром;
# считает её `handlers/combat._settle_world`, и больше её не читает никто.
# Ключей прибавок здесь нет нарочно: гильдейская надбавка ложится там, где
# платят за бой, а не в общий свёрток (`Claude.md`, правило 7).
#
# Числа — первый набросок: правятся по gold_flow и разыгранным боям, как всё в
# игре. Проверяет tests/content/test_guilds.py.

