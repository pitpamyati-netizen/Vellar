[[outcome]]
id = "archive"
name = "Архив смотрителей"
text = "У основания маяка открыт архив Дома Курганов. Путники сверяют старые письма и дорожные книги, а перевозчики берут меньше за поездки из Колвы."
travel_discount = 5

[[outcome]]
id = "signal"
name = "Сигнальный двор"
text = "При маяке открыт сигнальный двор Дома Курганов. Смотрители передают вести на береговые посты; перевозчики заранее готовят обозы и берут меньше за поездки из Колвы."
travel_discount = 10

[[fragment]]
quest_id = "last_beacon_signal_watch"
title = "Три поста на Мысе"
text = "Веденей сверил сведения с Мыса с расходными книгами. За часть постов Дом Курганов продолжал платить после того, как там перестали зажигать фонари. Эти строки смотритель отметил для нового расчёта."

[[fragment]]
quest_id = "last_beacon_last_couriers"
title = "Письма мимо Престола"
text = "Веденей связал перехваченные письма и приложил печать маяка. Дома договаривались с южными капитанами без дьяка Престола. Смотритель сохранил переписку вместе с именами посыльных."

[[fragment]]
quest_id = "last_beacon_far_claim"
title = "Погашенный чужой сигнал"
text = "На Вершине погашен посторонний сигнал. Дом Курганов собрал сведения о тех, кто направлял корабли в обход маяка. Эти записи пригодятся открытому архиву или новой службе сигнального двора; решение предстоит принять сообща."
