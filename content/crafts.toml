# Ремёсла: что приключенец собирает и что он из этого делает за плату.
#
# Ремесло - это не класс и не раса: это работа, которой может выучиться всякий, кто
# на дороге (Narrative.md, раздел 2). Собирающие ремёсла приносят сырьё, делающие
# превращают его в вещи, которые уже есть в items.toml: здесь не выдумывают новых
# вещей, поэтому лавка, сумка и таблицы добычи остаются одним списком.
#
# У каждого делающего ремесла свой цех, и цеха не пересекаются (ADR 0062):
# кузнец кует железо - тяжёлый и кольчужный доспех, клинки, украшения из металла;
# кожевник выделывает шкуры и шьёт кожаное - то, в чём ходят разбойник и следопыт;
# портной прядёт и ткёт тканое - то, в чём ходят чародеи;
# древодел точит древки, луки и посохи; алхимик варит; стряпуха кормит.
# Собирают руду, травы, шкуры, рыбу и лес, и у каждого сбора свой инструмент.
#
# Ранги зарабатывают работой, и каждый следующий дороже прошлого:
# ранг r -> r+1 стоит `experience_per_rank * r` работы, всего рангов `max_rank`.
# Ранг никогда не запирает экран, только рецепты: панель и кнопки держат ту же
# форму и на первом ранге, и на десятом.
#
# Сырьё берут не отсюда: в узлах локации и только инструментом, надетым в слот
# «Инструмент» (docs/crafts.md, ADR 0056). Ремесло отвечает за то, сколько сырья
# вынесли и что вообще лежит в этой земле; у каждого собирающего ремесла есть
# свой инструмент (items.toml, tool_types), иначе в нём нельзя работать.
#
# Где лежит сырьё, говорит `biomes` - биомы локаций вокруг города
# (content/world.toml). Одна кнопка когда-то приносила одни и те же две вещи во всех
# пятнадцати городах, и это делало весь материк одним местом; теперь Дубно даёт
# травы и дорожное железо, Мезень - лишайник с камня, а Мглин - то, что лежит под
# склепами. Находка без `biomes` встречается везде, и такая есть у каждого города:
# tests/content/test_crafts_content.py не пропустит карту, где кто-то стоит там, где
# не работает ни одно ремесло.

[meta]
max_rank = 10
# Столько работы стоит первый шаг вверх; каждый следующий ранг стоит во столько же
# раз больше своего номера. Всего до гранд-мастера - 2700 работы: ремесло идёт
# рядом с полосой уровней, а не обгоняет её за вечер.
experience_per_rank = 60
rank_names = [
    "Ученик",
    "Подручный",
    "Подмастерье",
    "Мастеровой",
    "Умелец",
    "Мастер",
    "Старший мастер",
    "Знатный мастер",
    "Великий мастер",
    "Гранд мастер",
]

# Ступень снаряжения, которую делает ранг: `rank_tiers[ранг - 1]` - уровень
# ступени из items.toml. Это и есть то, чем ремесло покрывает всю игру, а не пару
# первых уровней: рецепт один, а вещь из-под рук выходит той ступени, до которой
# мастер дорос (ADR 0062). Ступени, которых здесь нет, берут добычей и в лавке.
rank_tiers = [5, 12, 24, 35, 46, 57, 76, 95, 113, 140]

# Сбор: сколько приносит одна отработанная жила, до всяких прибавок.
gather_base = 2
gather_per_rank = 1
# Работа за одну жилу растёт с рангом, как и всё прочее: восемь единиц за горсть
# лома не двигали бы ранг мастера вовсе.
gather_experience = 8

# Качество сделанной вещи. Хорошая работа платит прежде всего самой вещью:
# `rarity_step` - на сколько ступеней редкости изделие вышло выше рецепта
# (ADR 0060). Ладная работа поднимает его на ступень, отменная на две; выше
# легендарного не поднимается никто - реликтовое не куют.
#
# Тому, у чего редкости нет вовсе - зельям, точильным камням, сырью, - качество
# платит по-старому, лишней штукой (`extra`), а `refund_percent` оставляет часть
# сырья неистраченной и работает одинаково для всего.
qualities = [
    { id = "plain", name = "Обычное", extra = 0, refund_percent = 0, rarity_step = 0 },
    { id = "good", name = "Ладное", extra = 1, refund_percent = 0, rarity_step = 1 },
    { id = "fine", name = "Отменное", extra = 1, refund_percent = 50, rarity_step = 2 },
]
good_chance_base = 12.0
good_chance_per_rank = 4.0
fine_chance_base = 4.0
fine_chance_per_rank = 2.0

# --- Лестницы сырья и изделий -----------------------------------------------
#
# `[[family]]` - лестница из пяти ступеней, по одной на каждые два ранга. Ступень
# знает свой ранг: рецепт, написанный один раз, на первом ранге берёт железный лом,
# а на девятом - небесное железо, и выпускает вещь своей ступени. Так и получается,
# что рецептов немного, а покрывают они всю полосу (ADR 0062).
#
# `gathered_by` - собирающее ремесло, которому эта лестница принадлежит; у него
# ступени становятся находками, а `level` и `biomes` говорят, с какого уровня и в
# какой земле их берут. Лестница без `gathered_by` руками не берётся: её делают.

[[family]]
id = "ore"
name = "руда"
gathered_by = "mining"
# Лом и то, что лежит глубже всего, берут везде: камень есть под всякой дорогой.
grades = [
    { item = "iron_scrap", rank = 1, level = 1 },
    # Средние ступени руды разборчивее прочих: болотную берут у воды, горную - в
    # камне. Кто стоит не на своей земле, кует ступенью ниже или едет дальше.
    { item = "bog_iron", rank = 3, level = 24, biomes = [
        "болото", "река", "берег", "море", "разлом", "кратер", "порт",
        "корабли", "овраги", "тундра",
    ] },
    { item = "mountain_ore", rank = 5, level = 46, biomes = [
        "горы", "скалы", "холмы", "ущелье", "карьер", "шахта", "плато",
        "вершина", "вулкан", "пепел", "утёсы", "край", "кузни", "крепость",
    ] },
    { item = "cave_crystal", rank = 7, level = 76 },
    { item = "sky_iron", rank = 9, level = 113 },
]

