# Crafts: what an adventurer gathers and what they make out of it for pay.
#
# A craft is not a class and not a race - it is work anybody on the road can
# learn (Narrative.md, section 2). Gathering crafts bring raw stuff in, making
# crafts turn it into items that already exist in items.toml: nothing here
# invents a new item, so the shop, the bag and the loot tables stay one list.
#
# Ranks are earned by working: `experience_per_rank` of work is one rank, up to
# `max_rank`. A rank never gates a screen, only recipes - the panel and the
# buttons stay the same shape at rank one and at rank five.
#
# Gathering is allowed once per watch per craft (docs/procgen.md, GATHER_COOLDOWN_
# SECONDS): the road refills whether or not anybody is playing.
#
# Where a material lies is `biomes` - the biomes of the locations around a city
# (content/world.toml). One button used to bring back the same two things in all
# fifteen cities, which made the whole mainland one place; now Дубно gives grass
# and road iron, Мезень gives lichen off the rock, and Мглин gives what is under
# the crypts. A yield without `biomes` is found everywhere, and every city has at
# least one - tests/content/test_crafts_content.py refuses a map where somebody
# is standing where no craft can work at all.

[meta]
max_rank = 5
experience_per_rank = 100
rank_names = ["Ученик", "Подручный", "Мастеровой", "Мастер", "Старшина"]

# Gathering: how much one watch of work brings back, before modifiers.
gather_base = 2
gather_per_rank = 1
gather_experience = 8

# Quality of a made thing. Vellar has no item instances - a bag holds ids and
# counts - so quality pays in what comes out of the work, not in a label on the
# item: a good batch yields one extra, an excellent one also leaves half the
# materials unspent.
qualities = [
    { id = "plain", name = "Обычное", extra = 0, refund_percent = 0 },
    { id = "good", name = "Ладное", extra = 1, refund_percent = 0 },
    { id = "fine", name = "Отменное", extra = 1, refund_percent = 50 },
]
good_chance_base = 12.0
good_chance_per_rank = 6.0
fine_chance_base = 4.0
fine_chance_per_rank = 3.0

# --- Gathering ---

[[craft]]
id = "mining"
name = "Горное дело"
kind = "gathering"
stat = "END"
description = "Бьёте породу в осыпях и старых выработках у дороги."
yields = [
    { item = "iron_scrap", level = 1, biomes = [
        "дорога", "руины", "шахта", "карьер", "крепость", "кузни", "тоннели",
        "склепы", "город мёртвых", "порт", "корабли", "башня", "чертоги",
        "тронный зал", "подземелье",
    ] },
    { item = "bog_iron", level = 5, biomes = [
        "болото", "река", "берег", "море", "разлом", "кратер",
    ] },
    { item = "mountain_ore", level = 8, biomes = [
        "горы", "скалы", "холмы", "ущелье", "карьер", "шахта", "плато",
        "вершина", "вулкан", "пепел", "утёсы", "край",
    ] },
    { item = "cave_crystal", level = 12, biomes = [
        "пещеры", "подземелье", "тоннели", "склепы", "разлом", "курганы",
    ] },
]

[[craft]]
id = "herbalism"
name = "Травничество"
kind = "gathering"
stat = "WIS"
description = "Берёте траву и смолу там, где другие проходят мимо."
yields = [
    { item = "meadow_herbs", level = 1, biomes = [
        "луга", "лес", "сады", "река", "холмы", "дорога", "берег", "плато",
        "овраги", "тундра", "небо",
    ] },
    { item = "grove_resin", level = 6, biomes = [
        "лес", "сады", "болото", "курганы", "роща", "чертоги",
    ] },
    { item = "frost_lichen", level = 14, biomes = [
        "снега", "тундра", "горы", "скалы", "вершина", "утёсы", "ущелье",
    ] },
]

