# --- Recipes ---
#
# A batch is worth more than the materials that went into it, always: work that
# pays less than selling the raw stuff is a trap, and tests/content refuses it.

[[recipe]]
id = "smith_whetstone"
craft = "smithing"
rank = 1
inputs = [{ item = "iron_scrap", count = 2 }]
output = { item = "whetstone", count = 1 }
