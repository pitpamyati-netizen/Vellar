# --- Работы ---
#
# `[[line]]` - одна работа, написанная один раз и открытая на каждом ранге:
# ступень изделия берётся из `rank_tiers`, а сырьё - из той ступени лестницы,
# что этому рангу под руку. `gear` - вид снаряжения из items.toml,
# `output_family` - лестница расходников или делаемого сырья.
#
# Партия всегда стоит больше того сырья, что в неё ушло: работа, платящая меньше,
# чем продажа сырья, - ловушка, и tests/content её не пропускает.

