# Ремёсла: что приключенец собирает и что он из этого делает за плату.
#
# Ремесло - это не класс и не раса: это работа, которой может выучиться всякий, кто
# на дороге (Narrative.md, раздел 2). Собирающие ремёсла приносят сырьё, делающие
# превращают его в вещи, которые уже есть в items.toml: здесь не выдумывают новых
# вещей, поэтому лавка, сумка и таблицы добычи остаются одним списком.
#
# Ранги зарабатывают работой: `experience_per_rank` работы - это один ранг, вплоть
# до `max_rank`. Ранг никогда не запирает экран, только рецепты: панель и кнопки
# держат ту же форму и на первом ранге, и на пятом.
#
# Сырьё берут не отсюда: в узлах локации и только инструментом, надетым в слот
# «Инструмент» (docs/crafts.md, ADR 0056). Ремесло отвечает за то, сколько сырья
# вынесли и что вообще лежит в этой земле; у каждого собирающего ремесла есть
# свой инструмент (items.toml, tool_types), иначе в нём нельзя работать.
#
# Где лежит сырьё, говорит `biomes` - биомы локаций вокруг города
# (content/world.toml). Одна кнопка когда-то приносила одни и те же две вещи во всех
# пятнадцати городах, и это делало весь материк одним местом; теперь Дубно даёт
# травы и дорожное железо, Мезень - лишайник с камня, а Мглин - то, что лежит под
# склепами. Находка без `biomes` встречается везде, и такая есть у каждого города:
# tests/content/test_crafts_content.py не пропустит карту, где кто-то стоит там, где
# не работает ни одно ремесло.

[meta]
max_rank = 5
experience_per_rank = 100
rank_names = ["Ученик", "Подручный", "Мастеровой", "Мастер", "Гранд мастер"]

# Сбор: сколько приносит одна стража работы, до всяких прибавок.
gather_base = 2
gather_per_rank = 1
gather_experience = 8

# Качество сделанной вещи. Хорошая работа платит прежде всего самой вещью:
# `rarity_step` - на сколько ступеней редкости изделие вышло выше рецепта
# (ADR 0060). Ладная работа поднимает его на ступень, отменная на две; выше
# легендарного не поднимается никто - реликтовое не куют.
#
# Тому, у чего редкости нет вовсе - зельям, точильным камням, сырью, - качество
# платит по-старому, лишней штукой (`extra`), а `refund_percent` оставляет часть
# сырья неистраченной и работает одинаково для всего.
qualities = [
    { id = "plain", name = "Обычное", extra = 0, refund_percent = 0, rarity_step = 0 },
    { id = "good", name = "Ладное", extra = 1, refund_percent = 0, rarity_step = 1 },
    { id = "fine", name = "Отменное", extra = 1, refund_percent = 50, rarity_step = 2 },
]
good_chance_base = 12.0
good_chance_per_rank = 6.0
fine_chance_base = 4.0
fine_chance_per_rank = 3.0

