# Один образец. Идентификаторы и порядок этапов сохраняются после начала дела.
[[event]]
id = "farhold_crossing"
city_id = "farhold"
name = "Переправа у Дубно"

[[event.stage]]
id = "crossing"
name = "Вернуть переправу"
text = "Паводок унёс настил у заставы. Стража собирает сведения о берегах, отгоняет зверей и принимает крепёж для новых мостков."
target = 4
cap = 2
reward_gold = 20
location_slot = 1
recipe_id = "smith_ingot@1"

[[event.stage]]
id = "supply"
name = "Снабдить переправу"
text = "Мостки уложены. Для первого обоза нужны безопасный подход, проверенные тропы и запас крепежа. После снабжения проезд из Дубно станет дешевле для всех."
target = 4
cap = 2
reward_gold = 20
location_slot = 1
recipe_id = "smith_ingot@1"

[[event.outcome]]
kind = "battle"
text = "Стража закрепилась у переправы. Обозам хватает меньшего сопровождения."
travel_discount = 10

[[event.outcome]]
kind = "scout"
text = "Разведчики нашли сухой подход к берегу. Обозы проходят короткой дорогой."
travel_discount = 15

[[event.outcome]]
kind = "craft"
text = "Мастера укрепили настил и опоры. Перевозчики тратят меньше на починку переправы."
travel_discount = 20

[[event.outcome]]
kind = "balanced"
text = "Стража, разведчики и мастера подготовили переправу вместе. Обозы снова идут через заставу."
travel_discount = 10
