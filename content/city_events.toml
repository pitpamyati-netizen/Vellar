# Один образец. Идентификаторы и порядок этапов сохраняются после начала дела.
[[event]]
id = "farhold_crossing"
city_id = "farhold"
name = "Переправа у Дубно"

[[event.stage]]
id = "crossing"
name = "Вернуть переправу"
text = "Паводок сорвал настил у заставы. Для новой переправы стража расчищает берег, разведчики проверяют подходы, мастера готовят металл для крепежа."
target = 4
cap = 2
reward_gold = 20
location_slot = 1
recipe_id = "smith_ingot@1"

[[event.stage]]
id = "supply"
name = "Снабдить переправу"
text = "Мостки уложены, но обоз ещё не прошёл. Закрепите подход к берегу, проверьте тропы и подготовьте запас металла; завершённая работа снизит цену поездок из Дубно для всех."
target = 4
cap = 2
reward_gold = 20
location_slot = 1
recipe_id = "smith_ingot@1"

[[event.outcome]]
kind = "battle"
text = "Стража заняла подходы к переправе. Перевозчики сократили расходы на охрану и снизили цену поездок из Дубно."
travel_discount = 10

[[event.outcome]]
kind = "scout"
text = "Разведчики отметили сухую дорогу к берегу. Обозам больше не нужен обход; поездки из Дубно подешевели."
travel_discount = 15

[[event.outcome]]
kind = "craft"
text = "Мастера укрепили опоры и настил. Перевозчики снизили цену поездок из Дубно: на починку переправы теперь уходит меньше денег."
travel_discount = 20

[[event.outcome]]
kind = "balanced"
text = "Стража расчистила берег, разведчики проложили подход, мастера укрепили настил. Обозы снова проходят через заставу; поездки из Дубно подешевели."
travel_discount = 10
