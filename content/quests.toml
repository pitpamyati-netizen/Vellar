# --- Каркас актов II–V (ADR 0047) ------------------------------------------
#
# Пишутся отдельными заходами вместе с содержимым городов. Города по актам — по
# Narrative.md, раздел 5.
#
# II. «Межа» (24–98). Сурож, Кремно, Стрешин. Дом Порубежья и Дом Камня спорят
#     за досмотр на крестовье четырёх трактов. Спор оседает в тихую войну:
#     перехваченные обозы, наёмные отряды, сожжённые весы. Безродный работает то
#     на одну сторону, то на другую.
#
# III. «Выморочный дом» (92–157). Полота, Ирень, Вырь. У Дома Переправ нет
#      наследника по прямой. На удел — броды и подвоз воды — заявляются дальняя
#      ветвь, признанный бастард и Дом Вольной Гавани, скупивший долги дома.
#
# IV. «Местничество» (133–230). Оскол, Мезень, Горынь, Крев. Престол слабеет,
#     дома тягаются за должности при дворе. Дом Заставы двигает войско к Гнездну
#     «для порядка».
#
# V. «Порожний престол» (230–300). Вельск, Мглин, Гнездно, Колва. Наследник не
#    назван. Большой совет решает, кто сядет на Престол; решение принимают
#    игроки, и его видит весь сервер.
