# Задания: оплаченная работа, которую выдают города. Пять актов по Narrative.md,
# раздел 5: «Задний двор» (1-15), «Межа» (12-49), «Выморочный дом» (46-79),
# «Местничество» (67-115), «Порожний престол» (115-150).
#
# Задание - это сделка, а не призвание: тот, кто его даёт, называет цену в первых
# двух фразах, отказаться можно всегда, и отказ никогда не закрывает работу
# насовсем (Narrative.md, раздел 4).
#
# objective:
#   kill   - победить N противников; target_kind сужает до одной породы
#   elite  - победить N сильных противников (узел с сильным противником)
#   search - отработать N узлов без боя; target_kind сужает до одного вида узла:
#            gather, cache, shrine, event
#   craft  - сделать N вещей своими руками; target_kind - идентификатор вещи из
#            items.toml. Счётчик двигается, когда партия выходит из работы, поэтому
#            ремесло становится способом взять работу, а не только способом продать
#
# location: в какой локации того же города делается работа, по месту.
# Необязательно, и никогда не ставится на craft - ремесло случается за верстаком, а
# не в дороге. Без него экран заданий может сказать только «обойдите три места», а
# это самая громкая жалоба, которую получил первый акт: игроки не знали, куда идти.
# Проверяется загрузчиком по world.toml.
#
# follows сшивает акт: задание с предшественником не появляется на доске, пока тот
# не оплачен.
#
# Идентификаторы - замороженные ключи: они лежат в журнале персонажа. Проверяет
# tests/content/test_quests.py.

