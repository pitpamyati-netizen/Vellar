# Contracts: paid jobs the cities hand out. Act I, "Подорожная" (levels 1-30).
#
# A contract is a deal, not a calling: the giver names the price in the first two
# sentences, refusing is always allowed and never closes the job forever
# (Narrative.md, section 4).
#
# objective:
#   kill   - defeat N opponents; target_kind narrows it to one enemy kind
#   elite  - defeat N strong opponents (an elite node)
#   search - work through N nodes without a fight; target_kind narrows it to one
#            node kind: gather, cache, shrine, event
#   craft  - make N things with your own hands; target_kind is the item id from
#            items.toml. The counter moves when the batch comes out of the work,
#            so a craft is a way of taking a job and not only a way of selling
#
# location: which location of the same city the job is done in, by slot. Optional,
# and never set on a craft - a craft happens at the workbench, not on the road.
# Without it the contract screen can only say "обойдите три места", which is the
# single loudest complaint the first act ever got: players did not know where to
# go. Validated against world.toml by the loader.
#
# follows chains the act: a contract with a predecessor stays off the board until
# that one is paid out. Ids are frozen keys - they live in the character's ledger.
# Validated by tests/content/test_quests.py.

