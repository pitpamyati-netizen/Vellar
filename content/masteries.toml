# Выучки: чему научилось КАЖДОЕ умение, взяв третий ранг и пятый (ADR 0083).
#
# Общего списка выучек в игре нет. У каждого боевого умения свои четыре - две на
# третьем ранге и две на пятом, - и написаны они под класс, под ветку и под то,
# чем это умение в бою занимается. Два разных умения никогда не покажут один и
# тот же выбор, и потому «поднять ранг» - это вопрос, а не прибавка.
#
# ============================================================================
# КАК ЭТО ЧИТАЕТСЯ
# ============================================================================
#
#   [[skill]] code   - умение, которому это написано (skills.toml).
#   third            - две выучки, из которых выбирают на ТРЕТЬЕМ ранге.
#   fifth            - две выучки, из которых выбирают на ПЯТОМ.
#
# У каждой две вещи:
#   name   - как выучка зовётся. Имя своё у каждой на всю игру: две выучки под
#            одним именем - это тот самый общий список, от которого игра ушла.
#   way    - ПРИЁМ: механика из domain/rules/skill_mastery.WAYS. Это правка
#            EffectSpec - того самого описания, по которому бой и считает.
#   amount - размер приёма. У приёма, которому размер не нужен («удар всегда
#            критический»), его не пишут вовсе.
#
# ТЕКСТА У ВЫУЧКИ НЕТ. Его складывает сам приём по своим же числам, и другого
# текста игроку не показывают. Это единственное, чем выучки отличаются от
# отменённых граней: грань была подписью, обещавшей словами то, чего движок не
# делал (ADR 0067), а здесь слова берутся ИЗ механики и разойтись с ней не могут.
#
# ЧТО ПРОВЕРЯЕТСЯ НА СТАРТЕ (infrastructure/content/loader._with_masteries):
#   - у каждого боевого умения ровно две выучки на ступень, у пассивного - ни
#     одной: у пассивки нет ни хода, ни цели (ADR 0073);
#   - приём существует и стоит на своей ступени;
#   - приём подходит ФОРМЕ умения: «Пробой» не ляжет на лечение, «Разлив» - на
#     удар;
#   - размер в границах приёма;
#   - правка ЧТО-ТО МЕНЯЕТ в описании эффекта. Вторая «Немота» на умении,
#     которое и так затыкает, - это подпись, и игра с ней не заведётся;
#   - имя выучки не занято другим умением.
#
# СТУПЕНЬ ПЕРВАЯ ПРАВИТ ЧИСЛА, ВТОРАЯ - ФОРМУ. На третьем ранге умение бьёт
# глубже, держит дольше, стоит дешевле; на пятом одноцелевой удар становится
# ударом по всем, лечение ложится на отряд, помеха расходится по стае.
#
# Идентификаторы умений заморожены: на них показывают персонажи в базе. Коды
# самих выучек не пишут - их даёт загрузчик по ранту и месту в списке (3a, 3b,
# 5a, 5b), и переставлять написанное местами нельзя: у игроков в базе лежит
# выбор.

# ==========================================================================
# ВОИН. Напор - размен ударами и добивание; заслон - строй, латы и то, что
# позволяет стоять; финт - раны, которые не заживают.
# ==========================================================================

