# Вещи: снаряжение, расходники и сырьё.
#
# ЖЁСТКОЕ ПРАВИЛО: снаряжение не даёт боевых умений. Оно даёт числа - урон, броню,
# характеристики - и ничего, что добавляет кнопку. См. docs/skills.md.
#
# ЖЁСТКОЕ ПРАВИЛО: у вещи нет описания. Вещей собираются тысячи; что вещь такое,
# отвечают её род, ступень и числа.
#
# СНАРЯЖЕНИЕ ЗДЕСЬ НЕ ПИШУТ, ПИШУТ ТОЛЬКО ЕГО ВИДЫ. Меч существует на каждой
# ступени в пяти редкостях, и так же - любой другой вид: выписать их значило бы
# завести тысячи записей, которые никто никогда не станет править.
# Пишется *вид*, а вещь собирается из вида, ступени и редкости так же, как
# противник собирается из породы и уровня (domain/procgen/items.py, ADR 0015).
#
# Расходники и сырьё по-прежнему пишут руками: их немного, и каждое - само по себе.
#
# Ключи прибавок берутся из общего словаря, объявленного в traits.toml
# [meta].modifier_keys, и только те, которые движок действительно читает.

[meta]

# Редкость решает, что вещь даёт сверх урона и брони.
#   stats    сколько характеристик прибавляет
#   special  есть ли особое свойство сверх них
#   scaling  считать числа от уровня героя, а не от уровня вещи
#   weight   как часто попадается; ноль - не попадается вовсе
#   mark     чем имя отличается от обычного: две вещи одного вида должны
#            называться по-разному, иначе в списке будут две одинаковые кнопки
#   durability сколько сборов держит инструмент этой редкости. Инструменту
#            редкость больше не даёт ничего: он не бьёт, не прикрывает и не
#            прибавляет характеристик, и потому редкая кирка отличается от
#            обычной одним числом - тем, на сколько её хватит (ADR 0056).
#   toughness во сколько раз прочнее обычного снаряжение этой редкости. Сама
#            прочность считается от уровня вещи (domain/procgen/items.py), а
#            редкость её только множит: чинить редкий доспех приходится реже,
#            но и дороже - цена починки идёт от цены вещи (ADR 0057).
rarities = [
    { id = "common", name = "Обычный", weight = 100, price_factor = 1.0, stats = 0, mark = "", durability = 25, toughness = 1.0 },
    { id = "uncommon", name = "Необычный", weight = 42, price_factor = 2.4, stats = 1, mark = "доброй ковки", durability = 60, toughness = 1.2 },
    { id = "rare", name = "Редкий", weight = 14, price_factor = 6.0, stats = 2, mark = "редкой работы", durability = 150, toughness = 1.5 },
    { id = "legendary", name = "Легендарный", weight = 3, price_factor = 16.0, stats = 2, special = true, mark = "именной славы", durability = 400, toughness = 1.9 },
    { id = "relic", name = "Реликтовый", weight = 0, price_factor = 45.0, stats = 2, special = true, scaling = true, mark = "давних времён", durability = 1000, toughness = 2.4 },
]

# Ступени снаряжения: с какого уровня и каким словом её называют. Вещь бывает
# только на ступени - промежуточных уровней у снаряжения нет, и потому «Крепкий
# меч» это один и тот же меч у всех, а не одно имя на двадцать разных мечей.
# Прилагательное нужно в четырёх родах: меч (m), кольчуга (f), копьё (n),
# поножи (p).
#
# Ступени привязаны к городам: почти у каждого города есть своя ступень на
# уровне входа (world.toml, level_min), плюс четыре ранние в стартовом городе,
# где уровни берутся быстро. Пересёк границу города - в лавке и добыче новая
# ступень: новое прилагательное и числа выше. Так игрок видит, что стал сильнее,
# и меняет вещи (ADR 0052).
