# Items: gear, consumables and materials.
#
# HARD RULE: equipment never grants an active skill. It grants numbers - damage,
# armour, stats - and nothing that adds a button. See docs/skills.md.
#
# HARD RULE: an item has no description. Items are generated in their thousands;
# what a thing is, its kind, its grade and its numbers answer.
#
# GEAR IS NOT WRITTEN HERE, ONLY ITS KINDS. A sword exists on twelve grades in
# five rarities, and so does every other kind: writing them out would be about two
# thousand entries nobody would ever edit. What is written is the *kind*, and the
# thing is assembled from kind, grade and rarity the same way an opponent is
# assembled from an archetype and a level (domain/procgen/items.py, ADR 0015).
#
# Consumables and materials are still written by hand: there are few of them and
# each is its own thing.
# Modifier keys share the vocabulary declared in traits.toml [meta].modifier_keys,
# and only keys the engine actually reads.

[meta]

# Редкость решает, что вещь даёт сверх урона и брони.
#   stats    сколько характеристик прибавляет
#   special  есть ли особое свойство сверх них
#   scaling  считать числа от уровня героя, а не от уровня вещи
#   weight   как часто попадается; ноль - не попадается вовсе
#   mark     чем имя отличается от обычного: две вещи одного вида должны
#            называться по-разному, иначе в списке будут две одинаковые кнопки
rarities = [
    { id = "common", name = "Обычный", weight = 100, price_factor = 1.0, stats = 0, mark = "" },
    { id = "uncommon", name = "Необычный", weight = 42, price_factor = 2.4, stats = 1, mark = "доброй ковки" },
    { id = "rare", name = "Редкий", weight = 14, price_factor = 6.0, stats = 2, mark = "редкой работы" },
    { id = "legendary", name = "Легендарный", weight = 3, price_factor = 16.0, stats = 2, special = true, mark = "именной славы" },
    { id = "relic", name = "Реликтовый", weight = 0, price_factor = 45.0, stats = 2, special = true, scaling = true, mark = "давних времён" },
]

# Ступени снаряжения: с какого уровня и каким словом её называют. Вещь бывает
# только на ступени - промежуточных уровней у снаряжения нет, и потому «Крепкий
# меч» это один и тот же меч у всех, а не одно имя на двадцать разных мечей.
# Прилагательное нужно в четырёх родах: меч (m), кольчуга (f), копьё (n),
# поножи (p).
tiers = [
    { level = 1, m = "Ветхий", f = "Ветхая", n = "Ветхое", p = "Ветхие" },
    { level = 6, m = "Простой", f = "Простая", n = "Простое", p = "Простые" },
    { level = 14, m = "Крепкий", f = "Крепкая", n = "Крепкое", p = "Крепкие" },
    { level = 26, m = "Добрый", f = "Добрая", n = "Доброе", p = "Добрые" },
    { level = 45, m = "Отменный", f = "Отменная", n = "Отменное", p = "Отменные" },
    { level = 70, m = "Ладный", f = "Ладная", n = "Ладное", p = "Ладные" },
    { level = 100, m = "Дивный", f = "Дивная", n = "Дивное", p = "Дивные" },
    { level = 135, m = "Славный", f = "Славная", n = "Славное", p = "Славные" },
    { level = 175, m = "Гордый", f = "Гордая", n = "Гордое", p = "Гордые" },
    { level = 215, m = "Царский", f = "Царская", n = "Царское", p = "Царские" },
    { level = 255, m = "Звёздный", f = "Звёздная", n = "Звёздное", p = "Звёздные" },
    { level = 290, m = "Немеркнущий", f = "Немеркнущая", n = "Немеркнущее", p = "Немеркнущие" },
]

# armor_share: сколько брони держит это место - долей от нагрудника. Без неё
# четыре мелочи одевали бы лучше, чем латный доспех. Оружие и украшение не
# прикрывают ничего и брони не дают.
slots = [
    { id = "weapon", name = "Оружие", armor_share = 0.0 },
    { id = "head", name = "Голова", armor_share = 0.45 },
    { id = "body", name = "Тело", armor_share = 1.0 },
    { id = "hands", name = "Руки", armor_share = 0.3 },
    { id = "feet", name = "Ноги", armor_share = 0.3 },
    { id = "trinket", name = "Украшение", armor_share = 0.0 },
]

# Рода оружия. Род решает, чем игрок бьёт: dice - кости этого рода на первой
# ступени, дальше растут грани, а не число костей. Размах это характер рода:
# булава «1d16» бьёт вразброс, меч «2d6» ровно, и в среднем они близки - ни один
# род не должен быть выбором «за неимением лучшего».
#
# Класс носит своё (classes.toml), но чужое не запрещено: за чужое оружие платят
# точностью и инициативой, а не отказом (ADR 0015).
weapon_types = [
    { id = "dagger", name = "Кинжал", gender = "m", dice = "1d11", modifiers = { crit_chance_percent = 4, initiative_percent = 8 } },
    { id = "short_sword", name = "Короткий меч", gender = "m", dice = "1d13", modifiers = { initiative_percent = 4, accuracy_percent = 3 } },
    { id = "sword", name = "Меч", gender = "m", dice = "2d6", modifiers = { accuracy_percent = 4 } },
    { id = "greatsword", name = "Двуручный меч", gender = "m", dice = "2d8", modifiers = { initiative_percent = -10, dodge_percent = -3 } },
    { id = "axe", name = "Топор", gender = "m", dice = "2d7", modifiers = { crit_damage_percent = 10, accuracy_percent = -4 } },
    { id = "mace", name = "Булава", gender = "f", dice = "1d16", modifiers = { initiative_percent = -4, damage_percent = 4 } },
    { id = "spear", name = "Копьё", gender = "n", dice = "1d14", modifiers = { accuracy_percent = 5, initiative_percent = -3 } },
    { id = "bow", name = "Лук", gender = "m", dice = "1d13", modifiers = { initiative_percent = 6, accuracy_percent = 4 } },
    { id = "staff", name = "Посох", gender = "m", dice = "2d5", modifiers = { damage_percent = 4, resource_percent = 5 } },
    { id = "wand", name = "Жезл", gender = "m", dice = "1d12", modifiers = { damage_percent = 6, resource_regen_percent = 8 } },
    { id = "symbol", name = "Символ веры", gender = "m", dice = "1d11", modifiers = { healing_done_percent = 10, resource_percent = 8 } },
]

# Рода доспеха. armor - доля брони относительно лёгкого доспеха той же ступени.
# modifiers берутся с каждой надетой вещи этого рода, поэтому полный тяжёлый
# доспех отнимает инициативу вчетверо: это и есть его цена.
armor_types = [
    { id = "cloth", name = "Тканый доспех", armor = 0.5, modifiers = { resource_percent = 3 } },
    { id = "light", name = "Лёгкий доспех", armor = 1.0, modifiers = { dodge_percent = 1 } },
    { id = "medium", name = "Средний доспех", armor = 1.7, modifiers = {} },
    { id = "heavy", name = "Тяжёлый доспех", armor = 2.6, modifiers = { initiative_percent = -3, dodge_percent = -1 } },
]

# Особое свойство легендарной и реликтовой вещи. Одно на вещь, выбирается по её
# же имени - и потому всегда одно и то же. Каждый ключ здесь движок читает:
# прибавка, которой никто не считает, это не свойство, а обещание.
special_properties = [
    { key = "damage_percent", value = 8 },
    { key = "crit_chance_percent", value = 6 },
    { key = "crit_damage_percent", value = 20 },
    { key = "health_percent", value = 8 },
    { key = "armor_percent", value = 12 },
    { key = "dodge_percent", value = 5 },
    { key = "accuracy_percent", value = 8 },
