# --- Materials ---
#
# source: что это за сырьё. По нему узел решает, что в нём может лежать, а
# tool_types выше - каким инструментом это берут: из зарослей не выкапывают руду, а
# с останков не срезают травы. Роды сырья - руда, травы, волокно, шкуры, древесина,
# рыба. Материал без source руками не берут вовсе: слитки, кожу, сукно и брус
# делают из сырого, и лежат они только в сумке.
#
# Сырьё идёт лестницами по пять ступеней (content/crafts.toml, [[family]]): по
# одной на каждые два ранга ремесла. Ступень решает, с какого уровня её берут и в
# какой земле она лежит, - потому кольчуга сотого уровня и кольчуга первого куются
# из разного, а не из одного и того же лома.


