# Слово, которым вещь называет прибавку к характеристике: «меч силача», «латы
# выносливости». Слово входит в имя вещи, у которой этот аффикс ведущий, и потому
# должно быть у каждого аффикса своё: два одинаковых слова - две одинаковые
# кнопки в списке (ADR 0059, правила доступности 5-7).
stat_words = { STR = "силача", AGI = "ловкача", END = "выносливости", INT = "премудрости", WIS = "прозорливости", CHA = "доброго слова", LCK = "удачи" }

# Процентные аффиксы. Из них же берётся особое свойство легендарной и реликтовой
# вещи - то, что бьёт в полную силу; выпавшие обычными идут долей от неё
# (procgen/items.ORDINARY_AFFIX_SCALE). Каждый ключ здесь движок читает:
# прибавка, которой никто не считает, это не свойство, а обещание. Список широк
# нарочно: чем он длиннее, тем реже две находки одного вида несут одно и то же,
# и тем больше поводов присмотреться к находке (ADR 0052, 0059).
#
# value - опорная величина: столько аффикс даёт на последнем уровне при среднем
# броске. На первом уровне вещи от неё остаётся половина (AFFIX_TIER_FLOOR), сам
# бросок гуляет на четверть в обе стороны, а изредка выпадает великим - в
# полтора раза выше потолка.
