# Рода инструмента. Инструментом не дерутся: он решает, что игрок вообще может
# взять руками в узле локации, - и без него сырьё не берут вовсе (ADR 0056).
#
# sources - какое сырьё берут этим инструментом (`source` у материала ниже),
# craft - в каком ремесле записывается эта работа. Жила, назвавшая своё сырьё,
# требует своего инструмента; жила, не назвавшая ничего, отдаёт то, что берёт
# инструмент в руках.
#
# Сколько инструмент выдержит, решает его редкость (`durability` выше), и
# больше редкость ему не даёт ничего.
tool_types = [
    { id = "pick", name = "Кирка", craft = "mining", sources = ["руда"] },
    { id = "sickle", name = "Серп", craft = "herbalism", sources = ["травы", "волокно"] },
