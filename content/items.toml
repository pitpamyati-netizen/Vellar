# Рода доспеха. armor - доля брони относительно кожаного доспеха той же ступени.
# Имя рода называет то, из чего он сделан, а не то, сколько весит: тканое шьёт
# портной, кожаное кожевник, кольчужное и латное кует кузнец (ADR 0062).
# modifiers берутся с каждой надетой вещи этого рода, поэтому полный тяжёлый
# доспех отнимает инициативу вчетверо: это и есть его цена.
