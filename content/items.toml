# Рода инструмента. Инструментом не дерутся: он решает, что игрок вообще может
# взять руками в узле локации, - и без него сырьё не берут вовсе (ADR 0056).
#
# sources - какое сырьё берут этим инструментом (`source` у материала ниже),
# craft - в каком ремесле записывается эта работа. Жила, назвавшая своё сырьё,
# требует своего инструмента; жила, не назвавшая ничего, отдаёт то, что берёт
# инструмент в руках.
#
# Сколько инструмент выдержит, решает его редкость (`durability` выше), и
# больше редкость ему не даёт ничего.
tool_types = [
    { id = "pick", name = "Кирка", craft = "mining", sources = ["руда", "обломки"] },
    { id = "sickle", name = "Серп", craft = "herbalism", sources = ["травы"] },
    { id = "skinning_knife", name = "Нож свежевателя", craft = "skinning", sources = ["шкуры"] },
]

# Рода оружия. Род решает, чем игрок бьёт, и говорит о себе двумя числами.
#
# damage_type - каким родом урона это оружие бьёт: копьё колет, меч рубит,
# булава дробит, жезл бьёт чарами. Отсюда его берёт обычный удар героя, и по нему
# считается сопротивление цели (docs/skills.md, entities/damage.py). Объявить
# обязательно: оружие, о котором не сказано, чем оно бьёт, - это удар без рода.
#
# dice - среднее удара на первой ступени и форма броска: чем костей больше, тем
# чаще выпадает середина. Дальше среднее растёт вместе со ступенью вещи.
#
# spread - РАЗМАХ: во сколько раз верхняя граница удара выше нижней. Это и есть
# характер рода: меч бьёт ровно (1,2), булава вразброс (1,5). Выше полутора не
# поднимается никто - это потолок всей игры (``domain/entities/dice.py``,
# MAX_SPREAD), и обойти его содержимым нельзя: объявленное сверх потолка
# зажимается. Прибавка при этом не пишется вовсе - её считают из среднего и
# размаха, потому что руками её не удержать: «1d16+3» обещало полтора раза на
# первой ступени и девять с половиной на последней, и «от 146 до 1404» было уже
# не решением игрока, а подбрасыванием монеты.
#
# Класс носит своё (classes.toml), но чужое не запрещено: за чужое оружие платят
# точностью и инициативой, а не отказом (ADR 0015).
weapon_types = [
