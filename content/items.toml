# Items: equipment, consumables and materials.
#
# HARD RULE: equipment never grants an active skill. It grants modifiers and skill
# variations (skill_modifiers), which change the numbers of a skill the player
# already has. See docs/skills.md, "Anti-bloat rules".
#
# HARD RULE: an item has no description. Items drop, are forged and sit on shelves
# by the hundred; a phrase written for each of them is either invented on the spot
# or the same phrase a hundred times over. What a thing is, its kind, its slot and
# its numbers answer - and they answer with numbers.
#
# Consumables live in the combat Bag tab, never in a skill slot.
# Modifier keys share the vocabulary declared in traits.toml [meta].modifier_keys -
# and only keys the engine actually reads. ``physical_damage_percent`` and
# ``magic_damage_percent`` are not among them: fourteen items promised damage
# through keys nothing counts, which is the same bug as a wrong number (Claude.md,
# rule 7). Damage is ``damage_percent``, here and everywhere.

[meta]
rarities = [
    { id = "common", name = "Обычный", weight = 100, price_factor = 1.0 },
    { id = "uncommon", name = "Необычный", weight = 45, price_factor = 2.2 },
    { id = "rare", name = "Редкий", weight = 18, price_factor = 5.0 },
    { id = "epic", name = "Эпический", weight = 5, price_factor = 12.0 },
    { id = "legendary", name = "Именной", weight = 1, price_factor = 30.0 },
]

# armor_share: сколько брони держит это место - долей от нагрудника. Без неё
# четыре мелочи одевали бы лучше, чем латный доспех. Оружие и украшение не
# прикрывают ничего и брони не дают.
slots = [
    { id = "weapon", name = "Оружие", armor_share = 0.0 },
    { id = "head", name = "Голова", armor_share = 0.45 },
    { id = "body", name = "Тело", armor_share = 1.0 },
    { id = "hands", name = "Руки", armor_share = 0.3 },
    { id = "feet", name = "Ноги", armor_share = 0.3 },
    { id = "trinket", name = "Украшение", armor_share = 0.0 },
]

# Рода оружия. Род решает три вещи: кому оружие даётся (classes.toml, weapons),
# какие умения с ним работают (skills.toml, weapons) и насколько тяжёл удар.
#
# damage - доля от стандартного удара. Единица это голые руки: оружие бывает
# лучше кулака и не бывает хуже, иначе кинжал был бы обузой. Загрузчик отказывает
# роду, который бьёт слабее единицы. Всё остальное, чем один род отличается от
# другого, - modifiers: кинжал даёт прыть, топор вес удара, латы отнимают и то и
# другое. Это свойство рода, а не конкретного клинка, поэтому написано один раз.
weapon_types = [
    { id = "dagger", name = "Кинжал", damage = 1.0, modifiers = { crit_chance_percent = 4, initiative_percent = 8 } },
    { id = "short_sword", name = "Короткий меч", damage = 1.05, modifiers = { initiative_percent = 4, accuracy_percent = 3 } },
    { id = "sword", name = "Меч", damage = 1.12, modifiers = { accuracy_percent = 4 } },
    { id = "greatsword", name = "Двуручный меч", damage = 1.3, modifiers = { initiative_percent = -10, dodge_percent = -3 } },
    { id = "axe", name = "Топор", damage = 1.22, modifiers = { crit_damage_percent = 10, accuracy_percent = -4 } },
    { id = "mace", name = "Булава", damage = 1.18, modifiers = { initiative_percent = -4, damage_percent = 4 } },
    { id = "spear", name = "Копьё", damage = 1.15, modifiers = { accuracy_percent = 5, initiative_percent = -3 } },
    { id = "bow", name = "Лук", damage = 1.1, modifiers = { initiative_percent = 6, accuracy_percent = 4 } },
    { id = "staff", name = "Посох", damage = 1.08, modifiers = { damage_percent = 6, resource_percent = 5 } },
    { id = "wand", name = "Жезл", damage = 1.0, modifiers = { damage_percent = 10, resource_regen_percent = 8 } },
    { id = "symbol", name = "Символ веры", damage = 1.0, modifiers = { healing_done_percent = 10, resource_percent = 8 } },
]

# Рода доспеха. armor - доля брони относительно лёгкого доспеха того же уровня.
# Именно она и делает броню бронёй: до неё вся защита росла из одной выносливости,
# а надетое меняло её на проценты от почти нуля - латы ощущались как стёганка.
#
# modifiers здесь берутся с каждой надетой вещи этого рода, поэтому полный
# тяжёлый доспех отнимает прыть вчетверо: это и есть его цена.
armor_types = [
    { id = "cloth", name = "Тканый доспех", armor = 0.5, modifiers = { resource_percent = 3 } },
    { id = "light", name = "Лёгкий доспех", armor = 1.0, modifiers = { dodge_percent = 1 } },
    { id = "medium", name = "Средний доспех", armor = 1.7, modifiers = {} },
    { id = "heavy", name = "Тяжёлый доспех", armor = 2.6, modifiers = { initiative_percent = -3, dodge_percent = -1 } },
]

