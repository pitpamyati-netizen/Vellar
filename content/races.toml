# Шестнадцать играбельных рас.
#
# Раса говорит, кто такой приключенец, и никогда - где ему полагается жить: Vellar
# это дорога, и всякий на ней пришёл откуда-то ещё (Narrative.md, раздел 2).
# Идентификаторы заморожены: на них показывают персонажи в базе.
#
# Правило бюджета характеристик: сумма положительных прибавок не больше 3 плюс
# сумма взятых штрафов, а чистая сумма не больше +3. Проверяет
# tests/content/test_races.py.
#
# Коды характеристик: STR сила, AGI ловкость, END выносливость, INT интеллект,
# WIS мудрость, CHA харизма, LCK удача.
#
# У каждой расы ровно одна пассивная способность и ровно одно боевое умение. Боевое
# живёт в skills.toml с owner = "race:<id>" и занимает отдельный расовый слот,
# поэтому оно никогда не спорит с умениями класса.
#
# `description` — одна строка о том, что раса делает; `lore` — несколько строк о
# том, кто это. Разведены нарочно: список рас читают все, а карточку открывают
# те, кто выбирает всерьёз, и второму читателю есть что сказать сверх строки.

[[race]]
id = "human"
name = "Человек"
description = "Быстро осваивают новое дело и легко привыкают к жизни в дороге."
lore = "Люди составляют большую часть обозных артелей Веллара. На заставе человек может за один сезон сменить работу грузчика на службу в досмотре, а затем уйти с обозом в другой город. Новое дело он обычно начинает без долгого ученичества, набираясь опыта по дороге."
bonuses = { STR = 1, INT = 1, CHA = 1 }
passive = { id = "adaptability", name = "Приспособляемость", text = "Вы получаете на 5 процентов больше опыта.", modifiers = { exp_percent = 5 } }
active = "race_human_second_wind"

[[race]]
id = "high_elf"
name = "Высший эльф"
description = "Помнят долгие годы учения и бережно расходуют запас сил."
lore = "Высшие эльфы приезжают в Веллар с выучкой, на которую у других уходила бы целая жизнь. Они хранят записи об учителях, сделках и долгах; споря о старой грамоте, эльф порой помнит человека, который её подписал. На службе ценят их знания и привычку проверять подробности."
bonuses = { INT = 2, WIS = 1, END = -1 }
passive = { id = "arcane_legacy", name = "Наследие чар", text = "Ваш запас боевого ресурса больше на 10 процентов.", modifiers = { resource_percent = 10 } }
active = "race_high_elf_mana_surge"

[[race]]
id = "wood_elf"
name = "Лесной эльф"
description = "Привычны к лесным тропам и быстро замечают движение впереди."
lore = "Лесные эльфы работают проводниками, охотниками и сторожами дальних вырубок. Они судят о дороге по следам и состоянию подлеска. Принимая обоз, проводник сначала осматривает упряжь и груз: от них зависит, по какой тропе удастся пройти."
bonuses = { AGI = 2, WIS = 1 }
passive = { id = "forest_paths", name = "Тропы леса", text = "Ваша инициатива выше на 8 процентов.", modifiers = { initiative_percent = 8 } }
active = "race_wood_elf_true_shot"

[[race]]
id = "dark_elf"
name = "Тёмный эльф"
description = "Уверенно держатся в сумраке и внимательно выбирают место для удара."
lore = "Тёмные эльфы привыкли к тесным подземным переходам и слабому свету. В Велларе их нанимают в выработки и на ночные причалы. За столом они выбирают место, откуда виден вход, а в дорогу берут собственную лампу и запасное огниво."
bonuses = { AGI = 2, INT = 1, CHA = -1 }
passive = { id = "darkvision", name = "Взор во тьме", text = "Ваша точность выше на 5 процентов.", modifiers = { accuracy_percent = 5 } }
active = "race_dark_elf_gloom_cloud"

[[race]]
id = "half_elf"
name = "Полуэльф"
description = "Легко заводят знакомства и умеют договариваться о цене."
lore = "Полуэльфы растут среди разных обычаев и рано учатся понимать, чего ждёт собеседник. В Велларе они ведут торговые переговоры, устраивают обозы и берутся за посредничество между домами. Знакомства приходится поддерживать в каждом городе заново."
bonuses = { AGI = 1, WIS = 1, CHA = 1 }
passive = { id = "diplomat", name = "Торговый язык", text = "Цены в лавках для вас ниже на 10 процентов.", modifiers = { shop_price_percent = -10 } }
active = "race_half_elf_charm"

[[race]]
id = "dwarf"
name = "Дварф"
description = "Выносливы, крепко стоят на ногах и привыкли к тяжёлой работе."
lore = "Дварфы приходят в Веллар с каменщиками, кузнецами и охраной рудных обозов. Прежде чем принять работу, дварф осмотрит инструмент и проверит меру материала. Готовую вещь он охотнее покажет в деле, чем станет долго расхваливать."
bonuses = { END = 2, STR = 1 }
passive = { id = "stone_skin", name = "Каменная кожа", text = "Ваша броня выше на 10 процентов.", modifiers = { armor_percent = 10 } }
active = "race_dwarf_ancestral_stance"

[[race]]
id = "gnome"
name = "Гном"
description = "Точно работают с инструментом и берегут пригодный материал."
lore = "Гномы чинят замки, собирают весы и берутся за мелкую работу в обозных мастерских. На их верстаках рядом с новым железом лежат разобранные детали. Даже сломанный механизм сначала осматривают: часть его ещё пригодится для следующего заказа."
bonuses = { INT = 2, AGI = 1, STR = -1 }
passive = { id = "tinkerer", name = "Мастеровые руки", text = "Шансы ладной и отменной работы выше на 15 процентов; возврат материалов при работе и выход сырья при разборе повышены на 15 процентов.", modifiers = { craft_quality_percent = 15, salvage_yield_percent = 15 } }
active = "race_gnome_cunning_trap"

[[race]]
id = "halfling"
name = "Полурослик"
description = "Проворны и внимательны к мелочам, которые помогают уцелеть в схватке."
lore = "Полурослики держат постоялые дворы и небольшие торговые дела вдоль трактов. Хозяин может помнить давнего гостя по починенной пряжке или способу вязать узел на мешке. Эта наблюдательность помогает им и за столом переговоров, и в дорожной драке."
bonuses = { LCK = 2, AGI = 1 }
passive = { id = "lucky", name = "Везунчик", text = "К вашему шансу критического удара добавлено 4 процентных пункта; к уклонению добавлено 3 процентных пункта.", modifiers = { crit_chance_percent = 4, dodge_percent = 3 } }
active = "race_halfling_nimbleness"

[[race]]
id = "orc"
name = "Орк"
description = "Сильны, прямы в разговоре и опасны даже после тяжёлых ран."
lore = "Орков охотно берут в тяжёлую обозную охрану и на работы, где приходится двигать камень. При найме они сразу выясняют плату, долю добычи и порядок отхода. За своей частью договора орк следит столь же внимательно, как за чужой."
bonuses = { STR = 3, END = 1, INT = -1 }
passive = { id = "fury", name = "Отчаянность", text = "Если у вас осталось 35 процентов здоровья или меньше, ваш урон выше на 30 процентов.", modifiers = { low_health_damage_percent = 30 } }
active = "race_orc_war_cry"

[[race]]
id = "half_orc"
name = "Полуорк"
description = "Выносят тяжёлые удары и умеют долго держаться в бою."
lore = "Полуорки нередко вырастают среди наёмных артелей, где людей узнают по работе. В Велларе они служат в дозоре, грузят суда и сопровождают обозы. Вернувшийся с дороги полуорк прежде всего проверяет снаряжение: следующая работа может найтись уже у ворот."
bonuses = { STR = 2, END = 1 }
passive = { id = "unbreakable", name = "Несгибаемость", text = "Ваш запас здоровья больше на 6 процентов; получаемый урон ниже на 3 процента.", modifiers = { health_percent = 6, damage_taken_percent = -3 } }
active = "race_half_orc_savage_blow"

[[race]]
id = "goblin"
name = "Гоблин"
description = "Ловко обращаются с мелочью и тщательно собирают добычу после боя."
lore = "Гоблины обживают дешёвые дворы у рынков и придорожные мастерские. Они умеют найти покупателя на вещь, которую другой оставил бы у обочины. После драки гоблин осматривает поле вместе с сумкой: разболтавшаяся застёжка может стоить всей выручки."
bonuses = { AGI = 2, LCK = 1, STR = -1 }
passive = { id = "scavenger", name = "Цепкие руки", text = "С противников вы получаете на 20 процентов больше золота.", modifiers = { gold_percent = 20 } }
active = "race_goblin_dirty_trick"

[[race]]
id = "troll"
name = "Тролль"
description = "Крупны, терпеливы и быстро оправляются от ран."
lore = "Троллям подходит тяжёлая работа у причалов и выработок. Их раны затягиваются быстро, поэтому в дороге они чаще жалуются на испорченную одежду и сломанную упряжь. В обозе тролль заранее выбирает место на привале, где хватит пространства лечь."
bonuses = { STR = 2, END = 2, INT = -2 }
passive = { id = "regeneration", name = "Живучесть", text = "В конце вашего хода вы восстанавливаете 2 процента здоровья.", modifiers = { regen_per_turn_percent = 2 } }
active = "race_troll_crushing_swing"

[[race]]
id = "dragonborn"
name = "Драконорождённый"
description = "Покрыты чешуёй и умеют поражать противника горячим дыханием."
lore = "Драконорождённых узнают по чешуе и низкому голосу. В Велларе они служат в дружинах и работают у горячих печей. Рассказ о своём происхождении у каждой семьи собственный; при найме записывают имя, умение и поручителя, как у остальных путников."
bonuses = { STR = 2, CHA = 1 }
passive = { id = "scales", name = "Чешуя", text = "Вы получаете на 25 процентов меньше урона огнём.", modifiers = { resist_fire_percent = 25 } }
active = "race_dragonborn_breath"

[[race]]
id = "tiefling"
name = "Тифлинг"
description = "Рога и жаркая кожа выделяют их среди других путников."
lore = "Тифлинги привыкли к расспросам о рогах ещё до того, как назовут цену за работу. На заставах Веллара их записывают в те же списки наёмников и мастеров. Многие предпочитают заранее обзавестись знакомым поручителем в городе, куда идут с обозом."
bonuses = { CHA = 2, INT = 1 }
passive = { id = "infernal_legacy", name = "Адское наследие", text = "Вы получаете на 20 процентов меньше урона огнём; ваш магический урон выше на 5 процентов.", modifiers = { resist_fire_percent = 20, magic_damage_percent = 5 } }
active = "race_tiefling_curse_seal"

[[race]]
id = "aasimar"
name = "Аасимар"
description = "Отличаются светлой кожей и бережными, уверенными движениями."
lore = "Аасимарам часто приписывают доброе предзнаменование. В Велларе эта молва приводит к ним и больных, и нанимателей, рассчитывающих на удачу. Самому путнику всё равно приходится учиться выбранному делу и договариваться о плате."
bonuses = { WIS = 2, CHA = 1 }
passive = { id = "heavens_light", name = "Свет небес", text = "Получаемое вами лечение выше на 15 процентов.", modifiers = { healing_taken_percent = 15 } }
active = "race_aasimar_healing_hand"

[[race]]
id = "lizardfolk"
name = "Ящеролюд"
description = "Покрыты плотной чешуёй, выносливы и хорошо переносят холод."
lore = "Ящеролюды встречаются в речных артелях, среди охотников и обозной стражи. Они терпеливо проверяют снасти и редко ускоряют сборы ради чужого нетерпения. На остановке ящеролюд сперва устраивает место для отдыха и лишь потом принимается за дорожный разговор."
bonuses = { END = 2, LCK = 1, CHA = -1 }
passive = { id = "cold_blood", name = "Хладнокровие", text = "Вы получаете на 25 процентов меньше урона холодом.", modifiers = { resist_cold_percent = 25 } }
active = "race_lizardfolk_tail_drop"
