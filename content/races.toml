# Sixteen playable peoples of Vellar.
#
# A race says where a person is from, never what they are: every one of these is
# a человек, born somewhere along the road (Narrative.md, section 2). Ids are
# frozen - characters in the database point at them.
#
# Stat budget rule: the sum of positive bonuses may not exceed 3 plus the sum of
# penalties taken, and the net total may not exceed +3. Verified by
# tests/content/test_races.py.
#
# Stat codes: STR strength, AGI agility, END endurance, INT intellect,
# WIS wisdom, CHA charisma, LCK luck.
#
# Every race has exactly one passive and exactly one active ability. The active
# one lives in skills.toml with owner = "race:<id>" and occupies the separate
# racial slot, so it never competes with class skills.

[[race]]
id = "human"
name = "Обозный"
description = "Родом с большой дороги, при обозах: прилаживаются к любому месту и учатся на ходу."
bonuses = { STR = 1, INT = 1, CHA = 1 }
passive = { id = "adaptability", name = "Дорожная выучка", text = "Вы получаете на 5 процентов больше опыта." }
active = "race_human_second_wind"

[[race]]
id = "high_elf"
name = "Престольный"
description = "Из Старого Престола, где остались имперские школы и учат по книгам."
bonuses = { INT = 2, WIS = 1, END = -1 }
passive = { id = "arcane_legacy", name = "Школьная выучка", text = "Запас вашего ресурса больше на 10 процентов." }
active = "race_high_elf_mana_surge"

[[race]]
id = "wood_elf"
name = "Лесовик"
description = "Выросли в лесах за трактом и ходят по ним бесшумно."
bonuses = { AGI = 2, WIS = 1 }
passive = { id = "forest_paths", name = "Тропы леса", text = "Шанс засады под открытым небом ниже на 20 процентов." }
active = "race_wood_elf_true_shot"

[[race]]
id = "dark_elf"
name = "Штольник"
description = "Родились в выработках Каменного Дола и дневной свет считают помехой."
bonuses = { AGI = 2, INT = 1, CHA = -1 }
passive = { id = "darkvision", name = "Привычка к темноте", text = "В тёмных местах вы не теряете точность." }
active = "race_dark_elf_gloom_cloud"

[[race]]
id = "half_elf"
name = "Крестовский"
description = "С перекрёстка в Крестовье: торгуются с малолетства и сходятся с кем угодно."
bonuses = { AGI = 1, WIS = 1, CHA = 1 }
passive = { id = "diplomat", name = "Торговый язык", text = "Цены в лавках для вас ниже на 10 процентов." }
active = "race_half_elf_charm"

[[race]]
id = "dwarf"
name = "Загорный"
description = "Из-за хребта, где всё сложено из камня; решений своих не меняют."
bonuses = { END = 2, STR = 1 }
passive = { id = "stone_skin", name = "Дублёная кожа", text = "Ваша броня выше на 10 процентов." }
active = "race_dwarf_ancestral_stance"

[[race]]
id = "gnome"
name = "Стеклянский"
description = "Из Стеклянки: разбирают и чинят всё, что попадает им в руки."
bonuses = { INT = 2, AGI = 1, STR = -1 }
passive = { id = "tinkerer", name = "Мастеровые руки", text = "Результат ремесла и разбора выше на 15 процентов." }
active = "race_gnome_cunning_trap"

[[race]]
id = "halfling"
name = "Хуторской"
description = "С хуторов у дороги: домашний народ, известный своим везением."
bonuses = { LCK = 2, AGI = 1 }
passive = { id = "lucky", name = "Везунчик", text = "Раз за бой вы переброшиваете неудачную проверку." }
active = "race_halfling_nimbleness"

[[race]]
id = "orc"
name = "Безводец"
description = "Из Безводья: живут на сухой стороне и в драке идут вперёд до конца."
bonuses = { STR = 3, END = 1, INT = -1 }
passive = { id = "fury", name = "Отчаянность", text = "Чем меньше у вас здоровья, тем выше ваш урон, до 30 процентов." }
active = "race_orc_war_cry"

[[race]]
id = "half_orc"
name = "Каторжанин"
description = "Родились на копях, куда ссылают за долги; ломаются позже прочих."
bonuses = { STR = 2, END = 1 }
passive = { id = "unbreakable", name = "Несгибаемость", text = "Раз за бой смертельный удар оставляет вам 1 здоровья." }
active = "race_half_orc_savage_blow"

[[race]]
id = "goblin"
name = "Затонский"
description = "С причалов Затона: щуплые, ловкие и цепкие до чужого добра."
bonuses = { AGI = 2, LCK = 1, STR = -1 }
passive = { id = "scavenger", name = "Цепкие руки", text = "С противников вы получаете на 20 процентов больше золота." }
active = "race_goblin_dirty_trick"

[[race]]
id = "troll"
name = "Болотник"
description = "С Камышовых Топей: тяжёлые и неспорые, раны на них затягиваются за считаные часы."
bonuses = { STR = 2, END = 2, INT = -2 }
passive = { id = "regeneration", name = "Живучесть", text = "В конце вашего хода вы восстанавливаете 2 процента здоровья." }
active = "race_troll_crushing_swing"

[[race]]
id = "dragonborn"
name = "Пепельный"
description = "От Пепельных Врат, где земля горит: жёсткая кожа, тяжёлый нрав, гарь в голосе."
bonuses = { STR = 2, CHA = 1 }
passive = { id = "scales", name = "Пепельная корка", text = "Вы сопротивляетесь стихии своих мест на 25 процентов." }
active = "race_dragonborn_breath"

[[race]]
id = "tiefling"
name = "Горновой"
description = "Выросли при плавильнях: жар их не берёт, а языком работают не хуже, чем клещами."
bonuses = { CHA = 2, INT = 1 }
passive = { id = "infernal_legacy", name = "Привычка к жару", text = "Вы сопротивляетесь огню на 25 процентов." }
active = "race_tiefling_curse_seal"

[[race]]
id = "aasimar"
name = "Лазурский"
description = "Из Лазури, где лечат при водах: говорят ровно и заметны в любой толпе."
bonuses = { WIS = 2, CHA = 1 }
passive = { id = "heavens_light", name = "Целебные воды", text = "Получаемое вами лечение выше на 15 процентов." }
active = "race_aasimar_healing_hand"

[[race]]
id = "lizardfolk"
name = "Бродник"
description = "С Бродов: терпеливы, холодны на голову и почти не поддаются страху."
bonuses = { END = 2, LCK = 1, CHA = -1 }
passive = { id = "cold_blood", name = "Хладнокровие", text = "Вы невосприимчивы к страху." }
active = "race_lizardfolk_tail_drop"
