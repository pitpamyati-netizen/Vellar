# Sixteen trade families a character can be born into.
#
# Vellar has no other peoples: everyone here is a человек, and what separates them
# is the work their family does (Narrative.md, section 2). The name is a trade
# that exists in this world, never an invented tribe; what the trade does to a
# person goes in the description, the passive and the racial active. Ids are
# frozen - characters in the database point at them.
#
# Stat budget rule: the sum of positive bonuses may not exceed 3 plus the sum of
# penalties taken, and the net total may not exceed +3. Verified by
# tests/content/test_races.py.
#
# Stat codes: STR strength, AGI agility, END endurance, INT intellect,
# WIS wisdom, CHA charisma, LCK luck.
#
# Every family has exactly one passive and exactly one active ability - what the
# household taught, and the one trick of the trade that works in a fight. The active
# one lives in skills.toml with owner = "race:<id>" and occupies the separate
# racial slot, so it never competes with class skills.

[[race]]
id = "human"
name = "Обозники"
description = "Семьи, что ходят с обозами: полжизни в дороге и привычка прилаживаться к любому месту."
bonuses = { STR = 1, INT = 1, CHA = 1 }
passive = { id = "adaptability", name = "Дорожная выучка", text = "Вы получаете на 5 процентов больше опыта." }
active = "race_human_second_wind"

[[race]]
id = "high_elf"
name = "Писари"
description = "Заставные писари: считают, переписывают и держат в голове больше прочих."
bonuses = { INT = 2, WIS = 1, END = -1 }
passive = { id = "arcane_legacy", name = "Школьная выучка", text = "Запас вашего ресурса больше на 10 процентов." }
active = "race_high_elf_mana_surge"

[[race]]
id = "wood_elf"
name = "Смолокуры"
description = "Гонят смолу в чаще за трактом и ходят по лесу бесшумно."
bonuses = { AGI = 2, WIS = 1 }
passive = { id = "forest_paths", name = "Тропы леса", text = "Шанс засады под открытым небом ниже на 20 процентов." }
active = "race_wood_elf_true_shot"

[[race]]
id = "dark_elf"
name = "Рудокопы"
description = "С малолетства в забое: темнота им привычнее дневного света."
bonuses = { AGI = 2, INT = 1, CHA = -1 }
passive = { id = "darkvision", name = "Привычка к темноте", text = "В тёмных местах вы не теряете точность." }
active = "race_dark_elf_gloom_cloud"

[[race]]
id = "half_elf"
name = "Мытари"
description = "Считают пошлину на заставах: торгуются раньше, чем выучиваются читать."
bonuses = { AGI = 1, WIS = 1, CHA = 1 }
passive = { id = "diplomat", name = "Торговый язык", text = "Цены в лавках для вас ниже на 10 процентов." }
active = "race_half_elf_charm"

[[race]]
id = "dwarf"
name = "Каменотёсы"
description = "Тешут камень с детства: тяжёлые руки, ровное дыхание, спорить не о чем."
bonuses = { END = 2, STR = 1 }
passive = { id = "stone_skin", name = "Дублёная кожа", text = "Ваша броня выше на 10 процентов." }
active = "race_dwarf_ancestral_stance"

[[race]]
id = "gnome"
name = "Колёсники"
description = "Чинят колёса и оси у дороги: разберут и соберут что угодно."
bonuses = { INT = 2, AGI = 1, STR = -1 }
passive = { id = "tinkerer", name = "Мастеровые руки", text = "Результат ремесла и разбора выше на 15 процентов." }
active = "race_gnome_cunning_trap"

[[race]]
id = "halfling"
name = "Пасечники"
description = "Держат ульи на хуторах: тихие, домовитые и везучие сверх всякой меры."
bonuses = { LCK = 2, AGI = 1 }
passive = { id = "lucky", name = "Везунчик", text = "Раз за бой вы переброшиваете неудачную проверку." }
active = "race_halfling_nimbleness"

[[race]]
id = "orc"
name = "Гуртовщики"
description = "Гонят скот по тракту: голос слышно за версту, отступать не приучены."
bonuses = { STR = 3, END = 1, INT = -1 }
passive = { id = "fury", name = "Отчаянность", text = "Чем меньше у вас здоровья, тем выше ваш урон, до 30 процентов." }
active = "race_orc_war_cry"

[[race]]
id = "half_orc"
name = "Бурлаки"
description = "Тянут баржи на бечеве: ломаются позже прочих и знают, почём труд."
bonuses = { STR = 2, END = 1 }
passive = { id = "unbreakable", name = "Несгибаемость", text = "Раз за бой смертельный удар оставляет вам 1 здоровья." }
active = "race_half_orc_savage_blow"

[[race]]
id = "goblin"
name = "Ветошники"
description = "Собирают тряпьё и лом на причалах: щуплые, ловкие и цепкие до чужого добра."
bonuses = { AGI = 2, LCK = 1, STR = -1 }
passive = { id = "scavenger", name = "Цепкие руки", text = "С противников вы получаете на 20 процентов больше золота." }
active = "race_goblin_dirty_trick"

[[race]]
id = "troll"
name = "Торфяники"
description = "Режут торф на топях: неспорые и тяжёлые, а заживает на них быстро."
bonuses = { STR = 2, END = 2, INT = -2 }
passive = { id = "regeneration", name = "Живучесть", text = "В конце вашего хода вы восстанавливаете 2 процента здоровья." }
active = "race_troll_crushing_swing"

[[race]]
id = "dragonborn"
name = "Углежоги"
description = "Жгут уголь в ямах у Пепельных Врат: жёсткая кожа, гарь в голосе, тяжёлый нрав."
bonuses = { STR = 2, CHA = 1 }
passive = { id = "scales", name = "Прокопчённая кожа", text = "Вы сопротивляетесь огню и дыму на 25 процентов." }
active = "race_dragonborn_breath"

[[race]]
id = "tiefling"
name = "Плавильщики"
description = "Стоят у горнов на Плавильнях: жар их не берёт, а языком работают не хуже клещей."
bonuses = { CHA = 2, INT = 1 }
passive = { id = "infernal_legacy", name = "Привычка к жару", text = "Вы сопротивляетесь жару на 25 процентов." }
active = "race_tiefling_curse_seal"

[[race]]
id = "aasimar"
name = "Костоправы"
description = "Правят кости при храме в Лазури: спокойные руки, ровный голос."
bonuses = { WIS = 2, CHA = 1 }
passive = { id = "heavens_light", name = "Лекарская родня", text = "Получаемое вами лечение выше на 15 процентов." }
active = "race_aasimar_healing_hand"

[[race]]
id = "lizardfolk"
name = "Перевозчики"
description = "Переправляют через Броды: терпеливы, холодны на голову и страху не подвержены."
bonuses = { END = 2, LCK = 1, CHA = -1 }
passive = { id = "cold_blood", name = "Хладнокровие", text = "Вы невосприимчивы к страху." }
active = "race_lizardfolk_tail_drop"
