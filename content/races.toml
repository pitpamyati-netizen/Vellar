[[race]]
id = "gnome"
name = "Гном"
description = "Разберут и соберут что угодно, было бы под рукой."
bonuses = { INT = 2, AGI = 1, STR = -1 }
passive = { id = "tinkerer", name = "Мастеровые руки", text = "Результат ремесла и разбора выше на 15 процентов." }
