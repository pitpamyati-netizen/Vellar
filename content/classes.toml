# Восемь классов, выбираются сразу после расы при создании персонажа.
#
# Класс говорит, как приключенец дерётся, а не чем он зарабатывает: делать вещи за
# плату - это ремесло, и ремёсла живут в crafts.toml (Narrative.md, раздел 2).
#
# Идентификаторы заморожены: на них показывают персонажи в базе.
#
# ``power`` - та единственная строка, которую игра говорит о том, как этот класс
# наносит урон: она называет характеристику, на которой меряется обычный удар
# (key_stats[0]), потому что экран, печатающий одни лишь «ключевые характеристики»,
# не отвечает, *почему* они ключевые.
#
# ``weapons`` и ``armor`` - что класс носит своим: идентификаторы берутся из
# items.toml [meta].weapon_types / armor_types. Это класс в руках игрока - разбойник
# с двуручным мечом уже не разбойник, - и умение вправе сузить их ещё
# (skills.toml, ``weapons``), но никогда не расширить.
#
# ДОСПЕХ У КЛАССА ОДИН (ADR 0064). Не запрет: латы на маге застёгиваются, но
# каждая чужая часть стоит точности и инициативы (``equipment.proficiency_penalty``,
# ADR 0015). Своё у каждого своё: ткань - маг и жрец, кожа - разбойник и друид,
# кольчуга - варвар и следопыт, латы - воин и паладин. По двое на род, и у
# каждого рода свой мастер: портной, кожевник, кузнец на двух верхних (ADR 0062).
#
# Каждый класс даёт 24 боевых и 20 пассивных умений на всё развитие (skills.toml,
# owner = "class:<id>"), открываемых на уровнях из [meta].active_unlock_levels /
# passive_unlock_levels. Боевое умение приходит каждые семь-восемь уровней, между
# ними пассивное, и нигде нет уровня, за которым ничего не открывается.
#
# ЧТО РАСТЁТ САМО. base_stat_value - с чего начинается каждая характеристика,
# stat_growth_per_level - на сколько каждая из семи растёт сама по себе за
# уровень, stat_points_per_level - сколько игрок раздаёт руками (ADR 0058).
# Прежде рос только розданный: очков хватало на две характеристики, и остальные
# пять стояли на пятёрке и на потолке. Теперь удача, ловкость и мудрость воина
# растут вместе с ним, а «кем ты стал» по-прежнему решают розданные очки.
#
# У ресурса класса regen_per_turn - ПРОЦЕНТЫ от максимума за ход, а не число
# (ADR 0058): запас растёт с уровнем, и числом восстановление значило что-то
# ровно на первом уровне.
#
# На четырёх уровнях из двадцати боевое умение приходит развилкой: два умения на
# одно место, берётся одно, второе закрыто до наставника ([meta].fork_levels,
# ADR 0024). Поэтому боевых написано 24, а изучить можно 20.
#
# Игрок ставит в панель 6 из 20 боевых - этот выбор и есть сборка. Пассивные умения
# слотов не занимают: изученное работает. См. docs/skills.md.
#
# ============================================================================
# СЕТКА: ЧТО КЛАССУ ДАЁТ ОЧКО ХАРАКТЕРИСТИКИ (ADR 0068)
# ============================================================================
#
# [class.scaling] - главное, что здесь есть. У каждой из семи характеристик
# написано, что она даёт ИМЕННО ЭТОМУ КЛАССУ. Прежде характеристика висела в
# воздухе: ``key_stats`` называл две из семи, движок читал первую, и класс
# отличался от класса только словом. Сила мага и сила воина были одним и тем же
# числом, а выносливость держала ровно 1,6 брони у обоих.
#
# Пять выходов, и каждый кто-то складывает (``loader.SCALING_CHANNELS``):
#   blow      прибавка к обычному удару, В ОТНОШЕНИЯХ, а не в уроне. Сила воина
#             2,2, сила мага 0,2 - воин вытягивает из очка силы в одиннадцать раз
#             больше. Во что отношение обращается, решает ОДНО число на всю игру
#             (``combat.BLOW_PER_SCALING``): правя баланс удара, правят его и не
#             трогают восемь классов; правя характер класса, трогают одну строку.
#   health    здоровье за очко (``rules/stats.derived_stats``).
#   resource  запас класса за очко - Отвага, Ярость, Чары, Вера.
#   armor     броня за очко.
#   healing   насколько очко усиливает лечение, в процентах
#             (``modifiers.scaling_modifiers`` → ``healing_done_percent``).
#
# Называть обязаны все семь, даже нулём. Молчание неотличимо от нуля, а ноль
# сказан вслух: класс, промолчавший про удачу, обещает игроку, что удача ему
# что-то даёт, - экран характеристик всё равно её напечатает.
#
# ВЫХОД, КОТОРОГО НИКТО НЕ СКЛАДЫВАЕТ, ЗАГРУЗЧИК НЕ ПРИНИМАЕТ. Тот же договор,
# что у прибавок (``modifiers.EFFECTIVE_KEYS``, ADR 0018): написать классу
# ``carry = 3`` и не считать переносимый вес - это обещание, а не механика.
#
# ============================================================================
# ВЕХИ: ПОРОГ, ЗА КОТОРЫМ ОЧКО ПЕРЕСТАЁТ БЫТЬ ЧИСЛОМ (ADR 0068)
# ============================================================================
#
# [[class.milestone]] - пороги характеристики и черты за них. Ровный рост ничего
# не решает: сто очков силы отличаются от девяноста девяти только тем, что их
# сто, и раздача сводилась к арифметике - лей в ключевую, пока не кончатся.
#
# Веха делает раздачу РЕШЕНИЕМ. За порогом приходит именованная черта, и взять её
# можно, только СОБРАВ характеристику, а не размазав очки по семи. Отсюда и
# сборка: два воина одного уровня расходятся не только деревом умений, но и тем,
# какие пороги каждый решил взять.
#
# Пороги общие: 30, 60, 100, 160, 240. Тридцать берут к двадцатому уровню, двести
# сорок - только сосредоточившись и уже к концу полосы: последняя веха - это то,
# ради чего всю дорогу лили в одну характеристику.
#
# Платит веха ОБЫЧНОЙ ЧЕРТОЙ из traits.toml, и это нарочно: черта в Vellar не
# даёт ни кнопки, ни боевого умения, ни экрана - только прибавки (Claude.md,
# правило 2). Значит вехи заведены, ничего не прибавив к тому, что игрок слушает:
# панель осталась шесть плюс один, экранов не прибавилось, а сборка стала глубже.
# Черты вех лежат в разделе "milestone", помеченном granted: при создании
# персонажа их нет, потому что выбрать нельзя то, что зарабатывают.
#
# Считается веха от ВЛОЖЕННОГО - основа, уровень, раса, класс, розданное, - а не
# от итогового. Порог, который берут и теряют, снимая перчатки, - это не веха, а
# мерцание (``domain/rules/milestones.py``).

[meta]
base_stat_value = 5
free_points_at_creation = 10
stat_points_per_level = 4
stat_growth_per_level = 0.5
active_unlock_levels = [1, 3, 8, 13, 18, 24, 31, 38, 45, 53, 61, 69, 77, 86, 95, 104, 114, 124, 133, 143]
fork_levels = [38, 69, 104, 143]
passive_unlock_levels = [
    2, 5, 9, 14, 20, 26, 33, 40, 48, 55,
    63, 72, 80, 89, 98, 108, 117, 127, 137, 146,
]
active_slots = 6
racial_slots = 1

