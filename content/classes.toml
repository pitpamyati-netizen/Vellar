# Eight classes, chosen right after the race during character creation.
#
# A class says how the adventurer fights, not what they do for a living: making
# things for pay is a craft, and crafts live in crafts.toml (Narrative.md,
# section 2). Ids are frozen - characters in the database point at them.
#
# ``power`` is the one line the game says about how this class does damage: it
# names the stat the standard blow scales on (key_stats[0]), because a screen
# that only prints "ключевые характеристики" never answers *why* they are key.
#
# ``weapons`` and ``armor`` are what the class may put on: the ids come from
# items.toml [meta].weapon_types / armor_types. They are the class in the player's
# hands - a rogue with a two-handed sword is not a rogue - and a skill may narrow
# them further (skills.toml, ``weapons``), never widen them.
#
# Each class contributes 8 active and 6 passive skills across the whole
# progression (skills.toml, owner = "class:<id>"), unlocked at the levels in
# [meta].active_unlock_levels / passive_unlock_levels. The player equips 6 of the
# 8 actives and 3 of the 6 passives - that choice is the build. See docs/skills.md.

[meta]
base_stat_value = 5
free_points_at_creation = 5
stat_points_per_level = 2
active_unlock_levels = [1, 4, 8, 14, 22, 35, 60, 100]
passive_unlock_levels = [2, 6, 12, 20, 30, 50]
active_slots = 6
passive_slots = 3
racial_slots = 1

[[class]]
id = "warrior"
name = "Воин"
role = "Стойкий боец ближнего боя"
description = "Держит строй и принимает удар на себя."
power = "Сила ведёт удар, выносливость держит Отвагу и место в строю."
key_stats = ["STR", "END"]
weapons = ["sword", "axe", "mace", "spear", "greatsword"]
armor = ["light", "medium", "heavy"]
bonuses = { STR = 2, END = 1 }
resource = { id = "valor", name = "Отвага", base = 40, per_level = 1.0, stat = "END", per_stat = 1.0, regen_per_turn = 6 }
health = { base = 110, per_level = 9.0, per_endurance = 6.0 }

