# Alembic берётся чисто как исполнитель миграций: миграции несут явный SQL, а моделей
# ORM, из которых их можно было бы вывести, нет. См. docs/adr/0001-no-orm.md.
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Адрес читается из POSTGRES_DSN на ходу (см. migrations/env.py); это значение — только
# запасное, для генерации SQL без базы.
sqlalchemy.url = postgresql+asyncpg://vellar:vellar@localhost:5432/vellar

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
