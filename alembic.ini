# Alembic is used purely as a migration runner: migrations contain explicit SQL,
# there are no ORM models to autogenerate from. See docs/adr/0001-no-orm.md.
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# The URL is read from POSTGRES_DSN at runtime (see migrations/env.py); this value
# is only a fallback for offline SQL generation.
sqlalchemy.url = postgresql+asyncpg://vellar:vellar@localhost:5432/vellar

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
