# Webhook mode. Overlay on top of the base stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Telegram will only deliver to a public HTTPS URL, so this expects a reverse
# proxy (Caddy, nginx, Cloudflare Tunnel) in front of port 8080 holding the
# certificate for WEBHOOK_BASE_URL. Requires WEBHOOK_BASE_URL and WEBHOOK_SECRET
# in .env; the bot refuses to start without the secret.
services:
  bot:
    environment:
      APP_ENV: prod
      # JSON logs are forced in prod anyway; stated here so it is not a surprise.
      LOG_JSON: "true"
    ports:
      # Loopback: the reverse proxy terminates TLS and forwards here. Publish on
      # 0.0.0.0 only if something else already fronts this host.
      - "127.0.0.1:8080:8080"
