# Режим вебхука. Накладывается поверх основного стека:
#
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Telegram доставляет только на публичный адрес HTTPS, поэтому здесь ждут обратный
# прокси (Caddy, nginx, Cloudflare Tunnel) перед портом 8080, держащий сертификат
# для WEBHOOK_BASE_URL. Нужны WEBHOOK_BASE_URL и WEBHOOK_SECRET в .env; без секрета
# бот отказывается стартовать.
services:
  bot:
    environment:
      APP_ENV: prod
      # В prod журнал в JSON включён и так; сказано здесь, чтобы это не было
      # неожиданностью.
      LOG_JSON: "true"
    ports:
      # Loopback: TLS завершает обратный прокси и передаёт сюда. Публикуйте на 0.0.0.0,
      # только если перед этой машиной уже что-то стоит.
      - "127.0.0.1:8080:8080"
