[project]
name = "vellar"
version = "0.1.0"
description = "Vellar - an accessible text MMORPG for Telegram"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram==3.30.0",
    "asyncpg>=0.31.0",
    "redis>=8.1.0",
    "alembic>=1.19.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.165.0",
    "ruff>=0.16.2",
    "mypy>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmorpg"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ASYNC",# flake8-async
    "PTH",  # flake8-use-pathlib
    "TID",  # flake8-tidy-imports
]
ignore = [
    "RUF001",  # ambiguous unicode characters: game texts are in Russian
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["mmorpg"]
warn_unreachable = true
disallow_any_explicit = false
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# asyncpg ships no py.typed marker; the repositories annotate their own signatures.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: requires PostgreSQL and Redis to be running",
    "slow: long running property based tests",
]

[tool.coverage.run]
source = ["src/mmorpg"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
