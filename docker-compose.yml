name: vellar

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vellar
      POSTGRES_PASSWORD: vellar
      POSTGRES_DB: vellar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vellar -d vellar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://vellar:vellar@postgres:5432/vellar
      REDIS_DSN: redis://redis:6379/0
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
