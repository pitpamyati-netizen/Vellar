# Полный стек: PostgreSQL, Redis, разовый прогон миграций и бот в режиме long
# polling. Рассчитан примерно на сотню игроков онлайн разом — откуда взяты эти числа
# и что менять первым при росте числа игроков, см. docs/deployment.md.
#
# docker compose up -d           запустить всё
# docker compose logs -f bot     следить за ботом
# docker compose down            остановить, сохранив мир
#
# Режим вебхука добавляет сверху docker-compose.prod.yml; см. docs/deployment.md.
name: vellar

# Без потолка файл журнала JSON растёт, пока не кончится диск, а вместе с диском уходит
# и база.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    container_name: vellar-postgres
    environment:
      POSTGRES_USER: vellar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vellar}
      POSTGRES_DB: vellar
      # Контрольные суммы превращают тихую порчу данных в громкую ошибку, пока она ещё
      # заперта на одной странице.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      # Бот держит не больше POSTGRES_POOL_MAX (20) соединений. Остальное — запас на
      # прогон миграций, psql и pg_dump.
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
      # Запросы — это поиск одной строки по первичному ключу; всё дольше 200 мс —
      # ошибка, о которой стоит прочитать, а бюджет p95 на обновление — 100 мс.
      - -c
      - log_min_duration_statement=200
    ports:
      # Только loopback: база предназначена этой машине, а не сети.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vellar -d vellar"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    container_name: vellar-redis
    command:
      - redis-server
      # Redis держит состояние автомата и начатые бои, а не один лишь кэш: потеря файла
      # выбивает игроков из боя посреди хода, поэтому он сохраняется.
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      # Вытеснять можно только те ключи, которым игра дала срок. У ключей автомата срока
      # нет, поэтому эта политика не может тихо забыть, где стоит игрок.
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 640m

  # Доходит до конца раньше, чем стартует бот, поэтому бот никогда не встречает схему,
  # которой не знает. Идемпотентно: на свежей базе не делает ничего.
  migrate:
    build:
      context: .
      args:
        # Штампует Start.bat; «unknown» — у сборки, запущенной руками.
        VELLAR_BUILD: ${VELLAR_BUILD:-unknown}
    image: vellar-bot
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://vellar:${POSTGRES_PASSWORD:-vellar}@postgres:5432/vellar
    command: ["alembic", "upgrade", "head"]
    # Проверка из образа ждёт сердцебиение, которого этот контейнер не пишет.
    healthcheck:
      disable: true
    restart: "no"
    logging: *logging

  bot:
    build:
      context: .
      args:
        VELLAR_BUILD: ${VELLAR_BUILD:-unknown}
    image: vellar-bot
    container_name: vellar-bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    # Эти значения сильнее .env: у стека есть настоящие PostgreSQL и Redis, поэтому
    # адаптеры в памяти отсюда не должны быть достижимы, что бы ни говорил .env.
    environment:
      APP_ENV: dev
      POSTGRES_DSN: postgresql://vellar:${POSTGRES_PASSWORD:-vellar}@postgres:5432/vellar
      REDIS_DSN: redis://redis:6379/0
      # Режим отладки asyncio проставляет время каждому колбэку: это инструмент
      # разработки, а не то, на чём держат игроков (src/mmorpg/monitoring.py).
      SLOW_CALLBACK_DETECTOR: "false"
      HEARTBEAT_PATH: /tmp/vellar-heartbeat
      # В стеке файлов журнала нет: stdout собирает демон ниже (пять файлов по 10 МБ), а
      # боту под /app не принадлежит ничего.
      LOG_DIR: ""
    restart: unless-stopped
    # Достаточно, чтобы aiogram доработал обновления, уже бывшие в полёте.
    stop_grace_period: 25s
    logging: *logging
    deploy:
      resources:
        limits:
          # Замеренный простой куда ниже 200 МБ; остальное — запас на всплеск
          # одновременных обновлений.
          memory: 512m
          cpus: "2.0"
      # Telegram отдаёт getUpdates одному потребителю. Вторая копия провела бы жизнь,
      # проигрывая гонки первой, поэтому опрос не растёт вширь никогда.
      replicas: 1

volumes:
  pgdata:
  redisdata:
